  "<li><b>Your domain</b> — the public address once it is live: set an <b>A record</b> for the name at your DNS host pointing at your home's public IP, forward <b>443 and 80</b> on your router to this machine, and Apex's ACME client issues the name's real certificate. Only then — name resolving to this machine, certificate live — does Apex say <b>outside reach verified</b>, and only then does the status dropdown say from anywhere.</li>" +
  "<li><b>Your public IP (WAN)</b> — the address the internet sees for your home, detected with a small HTTPS echo lookup (cached; it never blocks anything). With no domain this is the public address shown, marked <b>outside reach unverified</b>: Apex cannot prove your router forwards reach it until the path is proven. If the detected address is itself private or a carrier-NAT address (100.64.0.0/10), the page says plainly that this machine sits <b>behind another router/NAT</b>. If detection fails, the page says it <b>could not detect</b> the address — never a guess.</li>" +
  "<li><b>Your LAN address</b> — an address like <span class='mono'>192.168.1.x</span>. It works <b>only on this network</b> and lives in its own labeled home: <b>On this network (LAN)</b>. It is never shown under a public label.</li></ul>" +
  "<p><b>What the state lines mean.</b> <i>On — listening, outside reach unverified</i> means the proxy is up on this machine but the outside path is not proven; the page names the next step (forward 443 + 80 on the router to this machine, or add your domain). The ladder's last step is a <b>local check</b> — answered on this machine — and is labeled that way. <b>Reachable anywhere</b> appears only for a verified domain setup. And when the listener on 80/443 is Apex's own proxy, the availability rows read <b>In use by Apex's DHD proxy — this door working</b>: a healthy state, never a port problem.</p></div>" +
    "<div class='doc-sec'><h4>Prerequisites, installs, and operation cards</h4>" +
  "<p><b>The prerequisites ship with Apex.</b> Everything the DHD stack needs — the OpenSSL binary, a writable certificate home under <span class='mono'>config/dhd/</span>, the proxy component (part of the bridge itself) — is installed by the normal Apex installer, on every distro family, whether or not DHD is ever turned on. An update installs them too: the Updater runs the full installer, and its step ladder and update log show <b>DHD prerequisites</b> as its own named step. The added weight is small: OpenSSL is a roughly 1 MB package usually already present (when present, the step costs milliseconds and downloads nothing), the certificate home is one empty directory, and the low-port capability grant is file metadata. And the certificate home is on the installer's keep-list: a <span class='mono'>--fresh</span> reinstall preserves <span class='mono'>config/dhd/</span>, so a real certificate is never wiped and forced to re-issue.</p>" +
  "<p><b>The safety net.</b> If a prerequisite later goes missing, the DHD page lists it under <b>Prerequisites</b> and the enable offers an <b>Install</b> action right there: one click installs the missing piece through the same distro-aware machinery the installer uses, shows progress on the operation card, and continues the enable on its own. A missing dependency is never a dead-end refusal.</p>" +
  "<p><b>When a fix has to be yours, the commands are exact.</b> If an install fails, or any ladder step has a manual remedy, the failure state shows the literal command lines — complete and correct for your detected distro family — in one copyable block with a <b>Copy commands</b> button, ready to paste into Apex chat (CLI mode runs them) or a terminal.</p>" +
  "<p><b>Operations live in chat as cards.</b> Ask in chat to turn DHD on and the thread shows a live operation card — prerequisites, certificate, proxy, reachability — each step marked as it goes, output expandable inline, exact commands inline on failure. The card is driven entirely by the bridge's deterministic step state: <b>no model generation happens while an operation runs</b>. The finished card stays in the thread as the record, the DHD page shows the same operation, and nothing on a card depends on opening an external file or handler.</p></div>" +
    "<div class='doc-sec'><h4>The parts you may still handle by hand</h4>" +
  "<p>One click covers everything on the machine. Two things live outside it, in your router and your domain, and they are yours:</p><ul>" +
  "<li><b>Router port forwarding.</b> Forward ports <b>80</b> and <b>443</b> (TCP) on your router to the machine Apex runs on. Without the forward, the internet cannot reach the proxy at all, and in domain mode port 80 is also how the certificate proof arrives — the DHD page will tell you plainly: port 80 isn't reaching this machine — check the router forward.</li>" +
  "<li><b>Pointing your domain here.</b> At your domain's DNS host, set an <b>A record</b> for the name (for example <span class='mono'>apex.example.com</span>) to your home's public IP address. <b>Dynamic IP caveat:</b> most home connections change address from time to time; when yours does, the name stops resolving here until the record follows. A dynamic-DNS hostname avoids the manual step — you can put a DDNS name in the domain field just as well.</li></ul>" +
  "<p>The domain is <b>optional and addable at any time</b>: leave the field empty as long as you like. Adding one later changes nothing about the door except its certificate — the page holds the domain as certificate pending until the ACME step completes, and the self-signed door keeps answering meanwhile.</p></div>" +
    "<div class='doc-sec'><h4>Certificates — the warning, the real one, and renewal</h4>" +
  "<p><b>The self-signed warning is expected.</b> Until a domain is added, Apex serves a certificate it signed itself. Your browser cannot verify a self-signed certificate with any public authority, so it warns. That warning means no authority vouches for this certificate, not that the connection is unencrypted: the traffic is still TLS-encrypted, and the access code is still the door's lock. It is the normal state of a no-domain DHD.</p>" +
  "<p><b>With a domain, the warning goes away.</b> Apex's built-in ACME client talks to Let's Encrypt directly: it places an order, proves you control the domain by serving the HTTP-01 challenge through its own proxy on port 80, finalizes, downloads the certificate, installs it, and reloads the proxy. No Certbot, no external ACME tool.</p>" +
  "<p><b>Renewal is automatic.</b> Let's Encrypt certificates live 90 days. Apex checks the expiry when the bridge starts and once a day after that, and renews on its own when 30 days or fewer remain — same ACME flow, no operator action. The DHD page always shows the current expiry.</p></div>" +
    "<div class='doc-sec'><h4>Turning it off</h4>" +
  "<p>Flip the master switch on the DHD page back off. The proxy stops, ports 80/443 close, and Apex answers only on this machine and — if Apex | Node is on — your home network, exactly as before DHD. Your domain and certificate stay saved on the machine, so turning DHD back on later is the same one click.</p>" +
  "<p>Turning DHD off does not touch Apex | Node, the access code, or anything else. If you also forwarded ports on your router, you can leave the forwards in place (nothing is listening) or remove them — either is fine.</p></div>" },
  { id: "mesh", title: "Apex | Mesh — pooled inference", related: ["settings", "dhd", "troubleshooting"], html:
    "<div class='doc-sec'><h4>What Mesh is</h4>" +
  "<p><b>Apex | Mesh</b> lets your own machines share the work of answering. One machine assembles a chat request the way it always does — persona, Vault, knowledge packs, conversation — and a stronger machine you own writes the reply on its own model. The routing is <b>whole-request</b>: one machine answers, start to finish, and the reply carries a small pill saying which machine wrote it — the Hexlink glyph and <i>via &lt;name&gt;</i> in Mesh cyan. There is no split answer and no streaming between machines in Ring 1.</p>" +
  "<p>Mesh is off until you turn it on, and it works only between machines you pair by hand. Nothing about it is tied to a specific person, machine name, or domain: every name and address comes from your own settings and the cards you exchange. The status column's <b>Servers</b> group lists them in product order — <b>Navi</b> (the engine), <b>Apex | Node</b>, <b>Apex | Mesh</b>, <b>Apex | DHD</b>. Every Mesh control lives on the <b>Mesh page</b> — Mesh in the left menu's Apex | Systems group — which puts the controls first and the <b>roster</b> below them: this machine and every paired machine, each with its capability line, live status, and balance. Settings → System keeps a one-line summary and a button that jumps to the page.</p>" +
  "<p>That Servers row is also where Mesh warnings live — the persistent place to check when something feels off. Its dot and line read the connection state at a glance: grey when Mesh is off or no machine is paired yet, green when a paired machine is reachable (amber while a borrow or a lend is actually running), and amber with the reason in short words — <i>“&lt;machine&gt; unreachable”</i>, <i>“&lt;machine&gt; dropped”</i> — when a connection breaks. The chat notice still speaks in the moment a borrow falls back; the status row is what keeps the warning on screen afterwards, until the machine answers again.</p></div>" +
    "<div class='doc-sec'><h4>Pairing — the card is the handshake</h4>" +
  "<p>Each machine has a <b>Mesh card</b> — a PNG picture whose face a person can read and whose inside carries the card data: its name, its node id, its public key, the fingerprint of the certificate its Mesh door serves, the addresses it can be reached at, and a <b>capabilities block</b> — the machine's own report of its hardware class, GPU or CPU, RAM, model, speed class, and the caps it lends under.</p><ol>" +
  "<li>On the first machine, open the <b>Mesh page</b>, turn Mesh on, and give the machine a name.</li>" +
  "<li>Choose <b>Download PNG card</b> and carry the picture file to the second machine.</li>" +
  "<li>On the second machine, turn Mesh on, then drop the picture onto the <b>Paired machines</b> area — or use <b>Upload a PNG card</b> — and the peer is added.</li>" +
  "<li>Do the same in the other direction — each machine needs the other's card.</li></ol>" +
  "<p><b>Pairing is the consent act:</b> a paired machine is a trusted machine, and a paired machine's signed requests are accepted on that basis alone. Either side can unpair by removing the card. The <b>Can borrow</b> toggle on a peer is the borrowing machine's own choice about that peer: untick it there and that machine will not borrow from the peer, while staying paired — it does not gate what the peer accepts.</p>" +
  "<p><b>The card is a picture — the only way it travels.</b> <b>Download PNG card</b> saves the card as a .png. Its face is the card a person reads — the machine's name, its node identity, and the offer in words: its capabilities, the lending limits it is configured with, and whether it lends when idle or even while busy. The whole card rides inside the picture, in the same data-in-a-picture format the chips use, so Apex keeps one cartridge language. On the other machine, drop the picture onto the Mesh page's <b>Paired machines</b> area, or use <b>Upload a PNG card</b> there, and the peer is added. Earlier builds also offered the card as copyable text; that path is gone — there is nothing to paste anymore, and a text card saved from an earlier build can no longer be used. Machines already paired are unaffected.</p>" +
  "<p><b>Send the picture as a file.</b> The data inside the picture survives only if the file's bytes arrive untouched. Put it inside a <b>.zip</b> before sending it through a chat app — Discord and its kind recompress the pictures people upload and strip the data out, leaving a picture that looks like the card and pairs nothing. When that has happened, the Mesh page says so in those words and tells you to resend the original inside a .zip. A damaged picture — cut short, or with its payload tampered with — is refused just as loudly, never silently ignored.</p></div>" +
    "<div class='doc-sec'><h4>Borrowing — automatic, with off switches</h4>" +
  "<p>Once Mesh is on and a lender is paired and reachable, borrowing happens by itself: a chat request goes to the first reachable lender, and the reply arrives with its <i>via &lt;name&gt;</i> pill. The first borrowed reply of a session also raises a notice card in the thread, so borrowing never starts silently.</p>" +
  "<p>Three off switches, from widest to narrowest:</p><ul>" +
  "<li>The <b>Mesh master switch</b> turns the whole thing off.</li>" +
  "<li>The <b>Borrowing switch</b> stops this machine from borrowing while leaving it able to lend.</li>" +
  "<li><b>This chat only</b>, beside the composer, holds one chat session on this machine — no borrow is attempted for it at all. It stays latched for the session, like the CLI/Navi latch.</li></ul>" +
  "<p>If the lender is <b>busy</b>, your machine waits a short grace (2 seconds by default, set on the Mesh page) for it to free up, then answers locally — a lender that frees up during the grace can still take that request, but once your machine starts answering, the lender is never claimed mid-reply; it serves the <b>next</b> request. If a lender <b>drops mid-answer</b>, you see the notice — <i>“&lt;machine&gt; dropped mid-answer — this reply was generated locally instead”</i> — and your machine writes a fresh reply of its own. Two machines' prose is never spliced together. CLI mode, chips, and every built-in route never borrow; only model answers do.</p></div>" +
    "<div class='doc-sec'><h4>Lending — automatic when idle, off means off</h4>" +
  "<p>Lending can only be turned <b>on</b> from the lending machine's own dashboard, <b>in person</b>, at that machine. It cannot be armed through the DHD door. Turning it off works from anywhere you are signed in — and <b>Stop lending now</b> ends lending and aborts a borrowed generation already running, mid-flight, at once.</p>" +
  "<p>Open this page through the DHD door and the <b>Lend this machine</b> switch shows the lock itself: while lending is off it renders locked — dimmed, not clickable — with the reason in plain words directly under the switch, because lending can only be turned on in person. While lending is on, the switch stays live on the remote view, since turning lending off works from anywhere; a note under it says turning it back on will require being at the machine. The lock is the bridge's, not the page's: the bridge refuses a lending turn-on that arrives through the DHD door regardless of what any client renders.</p>" +
  "<p>A lender serves only inside the limits set on its card:</p><ul>" +
  "<li><b>Idle only</b> (on by default): the machine must have been quiet for 60 seconds, and no local generation may be running.</li>" +
  "<li><b>Share cap:</b> borrowed work may take at most a set share of any rolling hour — <b>25%</b> as shipped.</li>" +
  "<li><b>Generation caps:</b> at most a set number of borrowed generations an hour — <b>20</b> as shipped — and a set number for any one machine — <b>10</b> as shipped.</li></ul>" +
  "<p>The three caps are yours to set, on the lending machine itself: they sit in the <b>Lending</b> section of its Mesh page, beside the Caps line that shows the current values, and they take effect as soon as you save — no restart. Set them for the machine it is; a strong server can take far more than the shipped defaults. Your card advertises the caps you set, so a paired machine sees the real offer before it asks.</p>" +
  "<p><b>Idle only</b> has an override in the same section: the <b>Lend only when idle</b> switch, on as shipped. Turn it off and the machine lends without waiting for a quiet minute — borrowed generations run alongside your own work, and your own replies may slow down. The caps still apply, and lending still serves one borrowed generation at a time: a request that arrives mid-generation waits for the next slot, exactly as before. Your card states the posture either way — <i>lends when idle</i> or <i>lends even while busy</i>.</p>" +
  "<p>Your own work always wins: a local request takes the next slot ahead of any new borrowed work, though it never kills a borrowed answer already running. A request whose assembled context exceeds the lender's context setting is refused whole — never silently truncated.</p></div>" +
    "<div class='doc-sec'><h4>Privacy — what travels, what never does</h4>" +
  "<p><b>What travels</b> when you borrow: the assembled prompt for that one reply — your Soul and Memory text, any Vault or knowledge-pack material the question pulled in, and the recent conversation — sent encrypted to the lending machine, whose model reads it to write the reply. The lender keeps none of it: no prompt or reply text is written to disk on the lending machine, ever. But that machine's operator owns the machine it runs on. <b>Only borrow from machines you trust with the conversation.</b> The Mesh page shows this in plain words the first time borrowing is enabled.</p>" +
  "<p><b>What never travels:</b> your files and data stores, your credentials and access codes, and command-line access. Mesh carries chat requests and replies, nothing else. Mesh keys and dashboard codes are separate credentials that share nothing in either direction: a guest signed in through DHD can never reach Mesh, and a paired Mesh peer gains no dashboard access.</p>" +
  "<p>Every Mesh request is signed with the borrowing machine's Ed25519 node key and checked against the key on its paired card; stale or unsigned requests are refused with no detail given. The connection is pinned to the certificate fingerprint on the card — if the machine answering presents a different certificate, the borrower refuses and says so in plain words.</p></div>" +
    "<div class='doc-sec'><h4>The ledger and balances</h4>" +
  "<p>Each machine keeps a small ledger of Mesh work: who, which direction, how long, how it ended — metadata only, never content. The Mesh page's roster shows each paired machine's <b>balance</b> in seconds lent minus seconds borrowed, next to its capability line and live status (reachable, lending, busy, idle, unreachable). That status is kept current by the bridge itself: while Mesh is on, every paired peer is checked in the background about every thirty seconds — and immediately when a peer is paired and when Mesh is turned on — so a pair reaches “checked” on its own, with no chat sent. A failed check stays on the roster with its reason and how long it has been since the peer last answered — <i>unreachable — unauthorized (last checked 42s ago)</i> — until a newer check replaces it; the age keeps growing while the peer stays down, because failed checks refresh the reason, not the clock. “not checked yet” appears only before a peer's first check has ever completed. A machine's addresses never appear in the roster or anywhere else on screen — they are plumbing for the transport, not display. Balances are a record, not a rule: Ring 1 has no give-to-get enforcement. The ledger stays out of GitHub backups unless you tick <b>Include the Mesh ledger in backups</b> (off by default); the node keypair never rides a backup either way. The pairing-card pictures ride on their own tick — <b>Mesh pairing cards</b> in Settings → GitHub &amp; Backup carries this machine's own card as a PNG, minted fresh as the backup runs, plus a re-drawn picture for every paired peer; a restore lands them in <span class='mono'>config/mesh/cards/</span> and re-pairs the peers through the same card check a hand import passes, and the restoring machine's own card picture is kept as a file — it never overwrites that machine's identity. A fresh reinstall keeps <span class='mono'>config/mesh/</span> on the installer's keep-list, so a machine never loses its identity — or its pairings — to an update.</p></div>" +
    "<div class='doc-sec'><h4>Getting there — the doors</h4>" +
  "<p>Mesh always travels through its <b>own dedicated TLS listener</b> on the Mesh port (8765 by default), whether or not DHD is on — and the certificate it serves is the Mesh certificate, the one the paired card pins, in every configuration. Mesh never rides the DHD door: the DHD proxy refuses Mesh paths outright, and the dashboard itself serves only the dashboard-local Mesh controls behind the access-code gate; the node-facing status and borrow endpoints live only on the dedicated port. There is no plaintext Mesh listener. Ring 1 does no NAT traversal, no relay, and no racing between lenders: the first reachable lender serves.</p></div>" +
    "<div class='doc-sec'><h4>When the Mesh goes dark — the health check</h4>" +
  "<p>A Mesh failure used to report a single word — <i>unreachable — fingerprint</i> — and the rest was archaeology. Now the failure surfaces speak in sentences. A peer's roster row carries the full reason under its state: what answered, what did not match, and the cure where the product knows it. A changed Mesh identity is cured by importing that machine's fresh PNG card — the pin is replaced in place and the pair's ledger history is kept. A refused signature names its first suspect — the two machines' clocks — because a Mesh signature lives for 120 seconds, so a clock more than two minutes out reads as a forgery. A borrow that falls back names the stage it failed at — connect, TLS, fingerprint, signature, or timeout — in the chat notice.</p>" +
  "<p>The <b>Mesh health check</b>, at the foot of the Mesh page, runs the two decisive reads of any dark pair on the spot. It compares the certificate on this machine's disk with the one its Mesh door actually presents — a difference means something else is serving the door, usually a second bridge, and the check's process census counts the bridges and names the door's owner. For every paired machine it holds the fingerprint this machine pinned from its card up against the certificate that machine presents right now, and then runs the signed check, so identity and signature are judged separately. Every verdict is a sentence, with the actual fingerprints side by side. The check changes nothing: no pairing, pin, or route is touched — it reads and reports.</p></div>" +
    "<div class='doc-sec'><h4>Troubleshooting</h4><ul>" +
  "<li><b>Certificate fingerprint does not match.</b> The machine that answered is not presenting the certificate on its card — the card is stale, or something else is answering at that address. Re-copy the card from that machine's Mesh page and re-add the peer.</li>" +
  "<li><b>Replies keep saying “answered locally” with a busy, cap, or idle note.</b> The lender is doing its job: it is mid-answer, over its caps for the hour, or not idle yet. The note names which. Wait, or raise the caps on the lender.</li>" +
  "<li><b>“&lt;machine&gt; dropped mid-answer.”</b> The lender went away during a reply — its operator hit Stop lending now, or the machine or its bridge stopped. Your reply was written locally, whole. Check the lender.</li>" +
  "<li><b>A peer shows unreachable.</b> The roster says why, and when it was last checked. <i>Unauthorized</i> means the other machine does not hold this machine's card — pairing is the consent, so re-exchange cards. <i>Fingerprint</i> means the machine answering is not presenting the certificate on its card. Anything else means it could not be reached at all: its Mesh is off, its bridge is stopped, or the addresses on its card no longer reach it. Checks retry on their own about every thirty seconds, and the roster updates when one succeeds.</li>" +
  "<li><b>“This image has no readable Mesh card data.”</b> The PNG card arrived without its payload — almost always because a chat app recompressed it on the way. Resend the original card file inside a .zip, or by any channel that moves files untouched, and import that.</li></ul></div>" },
  { id: "guardian", title: "Guardian — protecting Navi's headroom", related: ["mesh", "settings", "troubleshooting"], html:
    "<div class='doc-sec'><h4>What the Guardian is</h4>" +
  "<p>The <b>Guardian</b> is Apex's system monitor: a quiet engine in the bridge that watches this machine's memory and Navi's own footprint, and protects the headroom she needs to answer well. A machine can have free RAM on paper and still starve her — another program balloons, a browser eats the reserve, a generation slows to a crawl — and the Guardian is the part of Apex that notices, keeps score, and acts before her replies pay for someone else's appetite.</p>" +
  "<p>It lives <b>with the bridge</b>: always on while the bridge runs, <b>even headless</b> — a server install with no dashboard open is still guarded. Its face is the <b>Guardian page in Apex | Utilities</b>: the summary (pressure, free RAM against the reserve, Navi's footprint, whether she is generating now), the live watch of the machine's heaviest processes, what it has learned, its settings, and its action log. The page polls the bridge every few seconds while it is open and stops the moment you leave it.</p></div>" +
    "<div class='doc-sec'><h4>The ladder — watch, warn, throttle, kill</h4>" +
  "<p>The Guardian escalates one rung at a time, and only while the crowding lasts:</p><ol>" +
  "<li><b>Watch.</b> It samples the machine — free memory against the reserve you set, Navi's footprint, how long her generations are taking, and the heaviest processes — and keeps the watch table current. Watching costs nothing and accuses no one.</li>" +
  "<li><b>Warn.</b> When a foreign process keeps crowding Navi past the warn delay, the Guardian says so — in its log, with the process named. A warning is a receipt, not a punishment.</li>" +
  "<li><b>Throttle.</b> If the crowding continues, the offending process is capped to the CPU ceiling you set, so Navi gets her cores back while the offender keeps running, slower. Throttling is reversible and is lifted when the pressure passes.</li>" +
  "<li><b>Kill.</b> The last rung, and the narrowest: only with killing enabled, only after the grace period following a final warning, and only ever a process on the expendable list — see below.</li></ol>" +
  "<p>Pressure is reported in plain words on the Guardian page — <b>OK</b>, <b>Tight</b>, <b>Critical</b> — with the free RAM and the reserve beside it, so you can see the same arithmetic the Guardian is acting on.</p></div>" +
    "<div class='doc-sec'><h4>The expendable list — killing is impossible until you name a name</h4>" +
  "<p>The expendable list is the Guardian's entire kill authority, and it <b>ships empty on purpose</b>. Until you type a process name into it on the Guardian page, the Guardian <b>cannot kill anything at all</b> — the top rung of the ladder simply does not exist. Even with the list filled, killing needs its own switch (<b>Killing enabled</b>) on top of the Guardian's main switch, and a named process still gets its warning and its grace period first.</p>" +
  "<p>Killing never happens to anything not on that list: not Navi, not Apex, not a system process, not a stranger the Guardian merely dislikes. If a process is worth protecting absolutely, the protection is structural — keep it off the list. Names are process names, one per line, exactly as the watch table shows them.</p></div>" +
    "<div class='doc-sec'><h4>What it learns — collisions, counted</h4>" +
  "<p>The Guardian learns this machine by <b>counting collisions</b>, not by modeling anything: every time a process crowds Navi — while she is generating, while memory is tight — that process's score grows: how often it has been seen, how many collisions, how many warnings it earned, how many times it was throttled, and whether it was ever killed. The <b>Learned offenders</b> card on the Guardian page is that scoreboard. A process that collides once and never again fades into trivia; a repeat offender is met higher on the ladder, sooner, because it has a record. There is no model, no cloud, and no profile leaving the machine — just arithmetic over what actually happened here.</p></div>" +
    "<div class='doc-sec'><h4>The log is the receipts</h4>" +
  "<p>Everything the Guardian does lands in its <b>action log</b>: warnings, throttles, kills, and the pressure changes that caused them, newest first on the Guardian page, each with its time, its kind, and the process it concerned. The Guardian never acts silently — if it touched a process on your machine, the receipt is there to read, and the offenders' scoreboard agrees with it. If you ever wonder why a program was slowed or closed, the log is the first and only place to look.</p></div>" +
    "<div class='doc-sec'><h4>Its own footprint, and the Mesh note</h4>" +
  "<p>A monitor that eats the headroom it guards would be a poor joke: the Guardian samples on a timer with the standard library, keeps only its counters and a short log in memory, and its own cost is <b>measured and small</b> — Navi's footprint on the summary card is the llamafile's real resident memory, read from the same process table the watch uses, so the numbers it judges by are the numbers you see.</p>" +
  "<p><b>Mesh-aware, like everything else in Apex now:</b> when <b>Apex | Mesh</b> is on, the summary says borrowing is available and from how many paired machines — a Guardian that can lean on the Mesh leans there before it ever leans on a local process. When Mesh is off, the Guardian says so plainly and works <b>locally only</b>, with this machine's own memory. Either way it degrades gracefully: no Mesh is a posture, not an error.</p></div>" },
  { id: "settings", title: "Settings & persona", related: ["installing", "voice", "github"], html:
    "<div class='doc-sec'><h4>Her persona — Soul and Memory</h4>" +
  "<p>Navi's personality is two documents in <span class='mono'>config/</span>: <span class='mono'>soul.md</span> (who she is) and <span class='mono'>memory.md</span> (what she carries). The bridge builds her system prompt from them on every chat. Both are editable in Settings, along with what she calls you. Nothing overwrites them once they exist: updates, reinstalls, and even a --fresh install stash and restore them, along with her installed chips and the llamafile. Only a first install creates them fresh.</p></div>" +
    "<div class='doc-sec'><h4>Memory from chat — she writes things down herself</h4>" +
  "<p>Navi pulls memories out of the conversation itself, two ways. <b>The trigger:</b> tell her <i>remember this</i>, <i>remember: …</i>, or <i>save this to your memory</i> — or tap <b>Save to memory</b> under any of your messages in Chat — and she writes the fact down. <b>On her own:</b> when you say something durable — a fact about you, a preference, a decision, a commitment, a correction — she saves it in the same reply she was already giving, with no extra round-trip. Small talk, command output, and questions are never saved.</p>" +
  "<p><b>Nothing is saved silently.</b> Every save leaves a receipt in the chat showing exactly what she wrote, word for word, with a one-tap <b>Undo</b>. A save that corrects an existing entry <b>replaces</b> it — the receipt shows the old line struck through, and Undo restores it. <b>Secrets are never saved</b>, on any path: ask her to remember a password, a key, or a card number and she refuses, says why, and the receipt shows no payload.</p>" +
  "<p><b>Settings → Persona</b> holds the leash: <b>She saves on her own</b> (the default), <b>Ask first</b> (each autonomous save waits as a proposal — in the chat receipt and under Settings → Persona — until you approve or dismiss it), or <b>Only when I say</b> (trigger only). The entries live in two files, split by who authored them: <b>Settings → Operator</b> holds yours — added by hand, or saved because you asked — under <i>About you — memories for Navi</i>; <b>Persona</b> holds hers, under <i>Her file — what she keeps</i>. Every entry says how it got there.</p></div>" +
    "<div class='doc-sec'><h4>Memory, the updater, and Settings</h4>" +
  "<p>The status column is a tabbed pane: <b>Status</b> first — her presence, the update line, the servers, and the rest of the column as it has always been — and <b>Chats</b> second, the chat manager: the known chats (switch, new, delete) and the uploaded files. On a phone the whole pane is the dock, and it opens on Status. On a desktop the column starts hidden — its width belongs to the content until you open it: the pane button at the top right of her presence bar — the bar above every view — is its door, and on a phone the top bar's panel button is the other; hidden is the default at every launch, never a remembered choice. What she remembers from chat lives under <b>Settings → Operator</b> (your file) and <b>Settings → Persona</b> (her file and the leash). <b>RAG</b> holds her knowledge packs (the section above). The <b>Vault</b> holds the shared desk of notes — hers and yours. The <b>Updater</b> watches the release channel. <b>Settings</b> is organized into topic tabs, and every setting lives under exactly one:</p><ul>" +
  "<li><b>Operator</b> — what she calls you, your picture and your Operator Badge, and your file: the memories you handed her about you. Your picture rides beside your messages; upload one in the tab (it is trimmed to a square here, kept with your profile, and carried in the settings backup) or let the picture generated from your name stand in. The <b>Operator Badge</b> is your self-portrait in the cartridge format — a card with your chosen face and your name (and this node's name) carried inside the picture. It is not a credential: nothing reads a badge to prove identity, and a badge whose payload is damaged simply reads as no badge.</li>" +
  "<li><b>Persona</b> — the Soul and Memory editors, her file of what she keeps from chat, the save-mode leash, and anything waiting on your word.</li>" +
  "<li><b>Appearance</b> — the theme picker, Potato mode for low-power machines, and the UI scale.</li>" +
  "<li><b>Voice</b> — her voice settings.</li>" +
  "<li><b>GitHub &amp; Backup</b> — sign-in and the backup/import block.</li>" +
  "<li><b>System</b> — the hardware profile (the detected profile, its override, and re-detect), plus installed commands.</li></ul>" +
  "<p>There is no backend switch: the app always talks Live to the real bridge and llamafile, and the llamafile's Running state in the status column is the live signal.</p>" +
  "<p><b>Themes.</b> Settings' Appearance tab holds the theme picker: eleven palettes over the same colors the whole app is built from, so every screen — dropdowns and typing boxes included — changes together:</p><ul>" +
  "<li><b>Nordic dark</b>: the Nord family — Polar Night backgrounds in steps, pale Snow Storm words, and Frost-blue highlights with muted Aurora colors. In Nordic, each menu icon gets its own color from that palette — Chat is Frost blue, Voice Aurora purple, Chips Aurora yellow, and so on — the same color everywhere it appears, even in the collapsed rail, and her written answers dress the same way: Snow Storm words, Frost headings and links, and code sitting on the deepest Polar Night step.</li>" +
  "<li><b>Dark Liquid Glass</b> comes second: frosted dark glass — deep near-black blue panels you can half see through, with a cheap blur on the big surfaces only (the side menu, the status column, the bar you type in), so it stays smooth on modest graphics; where blur or see-through panels are unavailable it falls back gracefully to the same colors, solid.</li>" +
  "<li><b>Terminal</b> is green on black, the classic console.</li>" +
  "<li><b>Signature dark</b> is her original console, cyan on near-black.</li>" +
  "<li><b>Light</b> is the same console on pale slate.</li>" +
  "<li><b>High contrast</b> is pure black with white words and bright signals.</li>" +
  "<li><b>Nocturne Row</b> is the default: a rain-slick Rockport night — blue-black streets with neon cyan and magenta signs.</li>" +
  "<li><b>Abyss</b> is the deep sea off her app icon — near-black and quiet, with one bioluminescent cyan, the anglerfish lure, as the only loud color.</li>" +
  "<li><b>Case File</b> is a light theme — warm paper, ink-black words, evidence-red string accents, and terminal blocks set like a typewriter.</li>" +
  "<li><b>Blood Moon</b> is crimson over black with gold thread for highlights.</li>" +
  "<li><b>Phosphor Amber</b> is amber on black, Terminal's warmer sibling.</li></ul>" +
  "<p>Pick one and it stays picked — the choice is saved in your config like the other settings, and a choice you already saved is always honored over the default.</p>" +
  "<p><b>Motion.</b> The whole app moves in one language — menus unfold, panes swap, and views arrive on the same curves. On a low-power machine, Appearance's <b>Potato mode</b> turns the decorative motion off across Apex: state changes become instant, and the glass theme's backdrop blur is suspended as well, since on weak graphics the blur costs more than the motion does. Your operating system's reduced-motion setting always wins over the switch, either way.</p>" +
  "<p><b>Interface size.</b> Appearance's <b>UI scale</b> — 100%, 110%, 125%, 150% — scales the whole interface, words and layout together, like a display scale: one knob, deliberately, because a separate text size would multiply against it and squeeze the fixed rows at the big end. It applies the moment you pick it and persists beside the theme.</p>" +
  "<p><b>Hardware profile.</b> Settings' System tab shows the profile the installer made of your machine: what it detected (the CPU and its core count, how much memory, the graphics chip — separate or built in, and its memory), and the settings it chose from that — threads, context size, batch size, and graphics layers. Her settings are picked from <i>your</i> machine at install, never copied from the developer's: a modest laptop gets the proven gentle numbers, a strong machine gets more room. Type your own numbers to override them, or press <b>Re-detect</b> to profile the machine again and return to the automatic choice. The installer writes what it found and why it chose it to <span class='mono'>hardware-profile.log</span> in the install folder.</p></div>" +
    "<div class='doc-sec'><h4>Apex | Node — Apex on your phone or tablet</h4>" +
  "<p>The <b>DHD page</b> holds the <b>Apex | Node</b> [local] controls, under the DHD options — Settings' System tab keeps only a pointer to them. Apex | Node is <b>off by default</b>: off, Apex answers only this machine. Turn it on and she also serves her page to your <b>home network</b> — the same Apex, in a phone or tablet browser. The choice is saved in <span class='mono'>config/navi.config.json</span> with your other settings and kept across updates. Flipping the switch is the whole job: Apex <b>restarts her own bridge</b> so the choice takes effect — the row says <b>Restarting the bridge…</b> while it happens, then confirms the live state read from the bridge that actually answers: <b>On your network</b>, or <b>This machine only</b>. Turning it off is the same one flip in reverse. No relaunching the app yourself, no hunting for a process.</p>" +
  "<p>If a restart ever fails, the row says so in plain words: it names the step that failed (the old bridge would not stop, the new bridge did not answer, or the answering bridge's bind does not match your choice), states the state that is <b>actually live</b> — the old bridge keeps serving its old setting, untouched, until a new one is confirmed — and offers the fallbacks: press <b>Restart bridge</b> to try again, or quit Apex fully and relaunch. A restart never leaves a half-state behind.</p>" +
  "<p>While the toggle is on, the row shows two things only someone sitting at this machine should see: the address to open on your phone — <span class='mono'>http://&lt;your machine's network address&gt;:8675</span>, as a button that copies it — and your <b>access code</b>. A phone that visits is asked for the code once; its browser is remembered after that. The code never applies on this machine itself. Press <b>Regenerate</b> for a new code: every phone let in with the old one is shut out and will be asked again.</p>" +
  "<p><b>The honest warning, in full:</b> anyone on the network who has the access code can use Apex in full — chat, the command line, and settings included. The code is the only lock on that door. Share it like a house key, and turn the toggle off when you no longer want the door there.</p></div>" },
  { id: "github", title: "GitHub — the pulse, issues & backups", related: ["settings", "installing"], html:
    "<div class='doc-sec'><h4>The pulse — a peek into the project</h4>" +
  "<p>The <b>GitHub</b> item in the side menu is her window into the project itself: <span class='mono'>AlexKollar/Apex</span>, the repo this rebuild lives in (the original Navi she grew from stays at SaintsSec/Navi as the legacy archive). The section has four tabs:</p><ul>" +
  "<li><b>Overview</b> is the pulse: the repo's description, its stars, forks, and watchers, the latest release, the most recent commits, the open-issue count, and when it last moved — read live from GitHub through the bridge, with a Refresh button, and honest about it when a read fails.</li>" +
  "<li><b>Issues</b> is the repo's current open-issues list — number, title, labels, author, when it last changed — also live, also refreshable.</li>" +
  "<li><b>Roadmap</b> is Alex's project board for Apex.</li>" +
  "<li><b>Discussions</b> are the project's open forum.</li></ul>" +
  "<p>In her desktop window, Roadmap and Discussions each open as a webview in its own window — GitHub will not be framed inside a web page, so where no webview exists the tab says so and links out to GitHub instead of showing a blank frame. At the bottom of the Issues, Roadmap, and Discussions tabs sits one quiet link to the matching place on GitHub — file an issue, open the board, start a discussion. <b>Looking needs no account at all</b>, in any tab. Clicking an issue opens its log in a window of its own — in her desktop window, a native window of the app like the Roadmap and Discussions windows; in a plain browser, a new tab — never framed inside her window. Filing an issue happens on GitHub's own pages too: when you write one, GitHub asks you to sign in there, with your own account. That is GitHub's door, not Navi's — she never stands between you and it. Account things — sign-in, backup, import — live in <b>Settings → GitHub &amp; Backup</b>; this section is for looking at the project.</p></div>" +
    "<div class='doc-sec'><h4>Signing in — only for GitHub things, never for Navi</h4>" +
  "<p>Navi <b>never</b> needs you to sign in. She starts, chats, runs commands, uses her chips and knowledge packs, and works with no internet at all — signed out, forever, if you like. Signing in exists for one reason: a few actions write to GitHub (backups and imports, below), and GitHub only lets an account write to its own things.</p>" +
  "<p><b>What signing in turns on:</b></p><ul>" +
  "<li><b>Publish to GitHub</b> for your RAG packs and chips (Navi does the whole chain — repo, topic, files, tag, and the published release, picture attached).</li>" +
  "<li><b>Automatic backups</b> to a repo under your own account.</li>" +
  "<li><b>Taking part</b> in the GitHub section's live issues, roadmap, and discussions — looking never needed an account; joining in does.</li></ul>" +
  "<p>None of it is required: <b>Export for GitHub</b> is always available, signed in or not — sign-in only adds the upload route; it never gates exporting or publishing by hand.</p>" +
  "<p>Sign-in uses GitHub's <b>Device Flow</b> — the way made for apps like hers. Press <b>Sign in with GitHub</b> and you get a short code. Open <span class='mono'>github.com/login/device</span> in your browser, type the code, and say yes. GitHub tells Navi you're in. Your password is never typed into Navi, and there is no secret key hidden inside the app. The token GitHub hands back is kept in one file on your own machine (<span class='mono'>config/github-auth.json</span>, readable only by you). It is <b>never</b> written into a backup and never logged.</p>" +
  "<p>One thing has to exist before sign-in can work: a <b>client ID</b>. That is a short public label for the app, made by registering an “OAuth App” on GitHub — and it has to be registered under the project owner's own GitHub account, so Navi does not ship with one filled in. If Settings → GitHub &amp; Backup says no client ID is configured, it shows the three short steps to make one and the box to paste it into. Until then, everything else — the GitHub section's pulse and Issues included — works as always.</p></div>" +
    "<div class='doc-sec'><h4>Backups — the ready-to-fly essentials</h4>" +
  "<p>A backup is a copy of Navi, kept in a <b>repository</b> (a project's folder on GitHub) under <b>your own account</b> — the name is yours to pick; <span class='mono'>navi-backup</span> is the starter suggestion. It is made <b>private</b> unless you choose otherwise, and the page warns you plainly if you pick public: a public backup puts her Soul and Memory on the open internet.</p>" +
  "<p>The backup carries <b>only the essentials</b> — the things a fresh Navi needs to be fully herself. Fresh install + import = <b>ready to fly</b>:</p><ul>" +
  "<li>Her <b>Soul</b> document — who she is.</li>" +
  "<li>Her <b>Memory</b> document — what she carries.</li>" +
  "<li><b>Settings &amp; config</b> — what she calls you, her theme, her installed commands, and her voice choice and voice settings.</li>" +
  "<li>Her <b>installed chips</b> — the whole chips, so they come back working, not just named.</li>" +
  "<li>Her <b>RAG packs</b> — their documents, their built indexes, and which ones are switched on.</li>" +
  "<li>Her <b>workflows</b> — the saved chains of chips.</li>" +
  "<li>Your <b>chats</b> — the threads themselves, which live on the server now. A restore <i>converges</i> them rather than overwriting: newest wins per thread, and a thread both machines moved on survives whole, as a dated sibling.</li>" +
  "<li>The <b>Vault</b> — the shared desk of notes, cases included.</li>" +
  "<li>Her <b>Mesh pairing cards</b> — the pictures themselves: her own card, minted fresh as the backup runs, and a re-drawn picture for every machine she is paired with, so a restored Navi can re-pair without meeting everyone from nothing. Her node keypair is never among them — a restored machine still mints its own identity.</li></ul>" +
  "<p>Some things are <b>never</b> backed up, on purpose: your call logs (those are history, not identity), caches and log files, her <b>hardware profile</b> (a new machine gets profiled fresh at its own install — an old machine's numbers must never be forced onto it), and her voice model files (big downloads that reinstall themselves; her voice <i>settings</i> are backed up).</p>" +
  "<p>The essentials checklist in Settings → GitHub &amp; Backup starts with every essential ticked. <b>Soul, Memory, and Settings &amp; config are ticked automatically and stay ticked</b> — they are what makes an imported Navi her, so every backup carries them. Installed chips, RAG packs, workflows, the Vault, and Mesh pairing cards are yours to choose; untick one of those and it tells you what it means: an import from that backup will no longer be fully ready-to-fly, because the unticked part stays behind.</p></div>" +
    "<div class='doc-sec'><h4>When backups happen, and bringing her back</h4>" +
  "<p>You pick how often: <b>every day, every 3 days, every 5 days, or every 7 days</b>. Navi checks the clock herself — when she starts, and while she is running — and when a backup is due and she is signed in, she runs it. That is the honest limit: <b>backups happen while Navi is running.</b> If the machine is off when one comes due, it simply runs at her next start. Settings → GitHub &amp; Backup shows the last backup's time and what it wrote, and the same for the last import — and the status column carries a <b>Backup</b> section with the last backup's time and result at a glance (or says plainly that no backup has run yet).</p>" +
  "<p><b>Import</b> (in Settings → GitHub &amp; Backup) is how a backup becomes a Navi again — on a fresh install, or any time you want to roll back to the backed-up her. Press <b>Preview what would change</b> first: it lists, essential by essential, what the backup holds and what restoring it would replace. Nothing is overwritten until you press <b>Confirm import</b>. What was never backed up — call logs, the old machine's hardware numbers, voice models — starts fresh, which is exactly what a new home should do.</p></div>" +
    "<div class='doc-sec'><h4>Account sync — the Operator Badge pulls</h4>" +
  "<p>Import has a second door, made for the ordinary case: you worked on one machine and want <i>this</i> machine caught up. In <b>Settings → GitHub &amp; Backup</b>, the <b>Account sync</b> card slots your <b>Operator Badge</b>. The badge is a pointer, never a key — it says whose backup to pull; the GitHub sign-in remains the only thing that can unlock it, and signed out, the sync stops at its first step and fetches nothing. Slotting it pulls the latest backup and builds the same per-item preview Import builds, laid on a <b>live operation card in Chat</b>: Navi speaks before it and after it, nothing is generated while it runs, and <b>nothing is applied until you confirm on the card</b>. Her node keypair and Mesh certificate never ride a backup, so they can never ride a sync. As of Build 13 the badge also slots <b>from a file</b> — on the Account sync card itself, and in Settings → Operator beside the minting controls — because a badge minted on one machine reaches another as a picture file; both slots feed the one badge state, and a file that is not an operator badge is refused in plain words. Pressing the sync button takes you to Chat at once, where the card runs, and a pull that has not answered in 45 seconds says so in plain words rather than leaving Settings spinning.</p></div>" },
  { id: "server-mode", title: "Server mode — headless & at boot", related: ["installing", "dhd"], html:
    "<div class='doc-sec'><h4>Apex without the window</h4>" +
  "<p>A server does not need a window. <span class='mono'>./start.sh --headless</span> starts exactly the services — the llamafile (check-first, as always: an answering server is left alone) and the bridge, supervised — and opens <b>no window</b>. It is safe over SSH, safe to run twice (a service already answering is adopted, never doubled), and it writes the same <span class='mono'>start.log</span> the desktop launch writes, so a headless start explains itself after the fact the same way. Run it after a reboot and Apex — with DHD, if DHD was left on — is simply back.</p>" +
  "<p>The desktop launch adopts, too: open the app on a machine whose services are already running (from boot, or from a headless start) and it uses them as they are instead of starting second copies.</p></div>" +
    "<div class='doc-sec'><h4>At boot, honestly</h4>" +
  "<p>Choose <b>At system boot</b> in the installer and it registers <b>two</b> systemd user services — <span class='mono'>navi-llamafile.service</span> and <span class='mono'>navi-bridge.service</span> (the bridge unit runs <span class='mono'>start.sh --headless</span>) — and tries to enable <b>lingering</b> for your user, which is what lets user services start at boot rather than at login. If the installer cannot enable lingering itself, it prints the exact command — <span class='mono'>sudo loginctl enable-linger $USER</span> — rather than assuming: a boot-armed Apex you only <i>believe</i> in is worse than one that tells you the step it could not take. The status column's <b>Servers</b> group carries a <b>Boot</b> row that reads the armed state from the system every time — both units and the linger state — so what it shows is what the machine says, never what an installer once hoped.</p><p>The app can now change it. <b>Arm at boot</b> and <b>Disarm</b> in the status column's Servers \u2192 Boot row \u2014 and the same control in Settings \u2192 System \u2014 register and enable both units from the templates the package ships, and try to enable linger. If linger cannot be enabled from the app, the row shows the exact command \u2014 <span class='mono'>sudo loginctl enable-linger $USER</span> \u2014 instead of pretending. After any action the row re-reads the system, and a half-done arm shows as half-done. Disarm disables the units \u2014 what is running keeps running; it just won't come up at boot \u2014 and leaves linger as it is. Arming is a local action \u2014 it is not offered through the DHD door.</p></div>" },
  { id: "headless-autostart", title: "Headless auto-start — setup, the Wi-Fi secret fix, and the boot test", related: ["server-mode", "dhd", "troubleshooting"], html:
    "<div class='doc-sec'><h4>Headless auto-start</h4>" +
    "<p>Apex's headless mode starts the bridge on boot, with no app window and nobody logged in — so a machine can power on and simply <i>be on duty</i>: answering locally, over DHD, and lending to the Mesh. This page covers the one-time setup, the one environment trap that can silently defeat it (a Wi-Fi profile with no stored secret), and the boot test that proves the whole chain. Everything below is a one-liner where a command is needed.</p></div>" +
    "<div class='doc-sec'><h4>1. One-time setup</h4>" +
    "<p>Boot-arming lives <b>in the app</b>. In the status column's <b>Servers</b> group, the <b>Boot</b> row carries an <b>Arm at boot</b> button \u2014 the same control sits in <b>Settings \u2192 System</b>, on the <b>Startup \u2014 at boot</b> card. Press it and the app:</p><ul>" +
    "<li>registers and enables two systemd user services \u2014 <span class='mono'>navi-llamafile.service</span> and <span class='mono'>navi-bridge.service</span> (the bridge unit runs <span class='mono'>start.sh --headless</span>) \u2014 from the templates the package ships, and</li>" +
    "<li>tries to enable <b>lingering</b> for your user, which is what lets user services start at boot rather than at login. If linger cannot be enabled from the app, the row shows the exact command instead of pretending:</li></ul>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>sudo loginctl enable-linger $USER</pre>" +
    "<p>After any action the row re-reads the system, so what it shows is what the machine reports now \u2014 and a half-done arm shows as half-done. <b>Disarm \u2014 don't start at boot</b> disables the units (what is running keeps running; it just won't come up at boot) and leaves linger as it is. Arming is a local action \u2014 it is not offered through the DHD door. The installer remains the alternative path: run it and choose <b>At system boot</b>, and it registers the same units and tries linger the same way, as the initial state.</p>" +
    "<p>You can also start the services headlessly at any time by hand — safe over SSH, and safe to run twice (a service already answering is adopted, never doubled):</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>./start.sh --headless</pre>" +
    "<p><b>Check the armed state in the app, no terminal needed:</b> the status column's <b>Servers</b> group carries a <b>Boot</b> row that reads the state from the system every time it shows — <i>Armed — Apex comes up headless at boot</i>, or <i>Not armed — Apex starts when you open it</i> — with a detail line naming both units and the linger state (on/off), read live, never assumed.</p>" +
    "<p><b>Reaching the machine from your own network:</b> if you want other devices (a phone, a second laptop) to reach this machine without DHD, turn the <b>Local server</b> toggle on in <b>Settings → System</b>. Off (the default), the bridge listens only on the machine itself (<span class='mono'>127.0.0.1:8675</span>); on, it answers on the LAN on port <b>8675</b>, and anything that isn't the machine itself must present your Apex access code first.</p>" +
    "<p>Verify the boot machinery from a terminal:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>systemctl --user is-enabled navi-bridge.service navi-llamafile.service\nloginctl show-user \"$(id -un)\" --property=Linger --value</pre>" +
    "<p>You want <span class='mono'>enabled</span> twice and <span class='mono'>yes</span>. If the linger query gives you trouble, the ground truth is the directory — your username listed means linger is on:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>ls /var/lib/systemd/linger/</pre>" +
    "<p>If the Boot row says <b>Not armed</b>, press <b>Arm at boot</b> on the row (or in Settings \u2192 System) \u2014 re-running the installer and choosing <b>At system boot</b> is the fallback if the units cannot be registered from the app. If it is armed but linger is off, run the <span class='mono'>enable-linger</span> command the row shows, once.</p></div>" +
    "<div class='doc-sec'><h4>2. The trap: a Wi-Fi profile with no stored secret</h4>" +
    "<p>Headless Apex can only answer on a network that exists. On Pop!_OS / Ubuntu (the netplan-backed NetworkManager stack), a Wi-Fi connection created without a system-stored password keeps its secret in the <i>desktop session</i>. At boot, NetworkManager asks for the secret, no session agent exists yet, and activation fails with:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>&lt;warn&gt;  no secrets: No agents were available for this request\n&lt;info&gt;  Activation: failed for connection '&lt;SSID&gt;'</pre>" +
    "<p>NetworkManager then backs off and retries much later — so after a reboot the machine is dark to SSH, DHD, and the Mesh until a human logs into the desktop, at which point everything \"mysteriously\" comes back at once. This is an environment defect, not an Apex defect: the bridge started fine; the network underneath it never arrived.</p>" +
    "<p><b>Check whether your profile stores its secret:</b></p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>sudo grep -c password /etc/netplan/90-NM-*.yaml</pre>" +
    "<ul><li><span class='mono'>1</span> or more — the password is stored in the system profile. You're clean.</li>" +
    "<li><span class='mono'>0</span> — the profile is secretless. Apply the fix below.</li></ul>" +
    "<p>(The netplan source file is named <span class='mono'>90-NM-&lt;connection-uuid&gt;.yaml</span>. Wired connections don't have this problem; it is Wi-Fi-specific.)</p>" +
    "<p><b>The fix.</b> Type this yourself, at the machine, with your real Wi-Fi password — never send the password through a chat, a ticket, or a screenshot:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>sudo nmcli connection modify \"&lt;SSID&gt;\" wifi-sec.psk \"&lt;your-wifi-password&gt;\"</pre>" +
    "<p>On the netplan-backed stack this writes through to the netplan source file, so the generated boot profile carries the secret and NetworkManager can activate Wi-Fi with nobody logged in. Expect the connection to bounce once when you apply it (an SSH session may drop; reconnect).</p>" +
    "<p>Verify the write landed — again without printing the secret: run the <span class='mono'>grep -c</span> check above again. You want <span class='mono'>1</span> or more now.</p></div>" +
    "<div class='doc-sec'><h4>3. The verdict test (local — no DHD required)</h4>" +
    "<p>This proves auto-start on one machine using only a phone:</p><ol>" +
    "<li>Reboot the machine.</li>" +
    "<li><b>Do not log in.</b> Leave the login screen completely untouched — hands off is the whole test. If you log in, you've proven nothing.</li>" +
    "<li>Wait about two minutes.</li>" +
    "<li>On your phone, on the <i>same Wi-Fi</i>, open <span class='mono'>http://&lt;machine-LAN-IP&gt;:8675</span> and enter your Apex access code. (Requires the <b>Local server</b> toggle from §1.)</li>" +
    "<li><b>Pass:</b> Navi answers while the login screen still sits untouched. The node auto-fired: service up, network up, no human involved.</li></ol>" +
    "<p>Wrinkle: some networks (many workplace and guest Wi-Fi setups) isolate clients from each other, so the phone can't see the machine. Then put the machine on your phone's hotspot instead and browse to it there — same test, your own network.</p>" +
    "<p><b>The remote variant.</b> Once the local test passes, the same proof works from anywhere, through whichever doors you've set up — from another machine, try your SSH door and/or your DHD address after a no-login reboot:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>ssh -p &lt;your-ssh-port&gt; &lt;user&gt;@&lt;your-host&gt;</pre>" +
    "<p>If either answers with the login screen untouched, headless auto-start is proven end to end on that machine.</p></div>" +
    "<div class='doc-sec'><h4>4. If it fails</h4>" +
    "<p>Log into the desktop — everything recovers; that recovery is itself a clue (it means the services were waiting on something the login provided). Then read the boot record before changing anything:</p>" +
    "<pre class='exec mono' style='margin:6px 0;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word'>journalctl -b -u NetworkManager --no-pager | grep -i -E \"no secrets|activation.*fail\"\nsystemctl --user status navi-bridge --no-pager</pre>" +
    "<ul><li>The <span class='mono'>no secrets</span> line is present → §2's trap; apply the fix and retest.</li>" +
    "<li>The bridge unit is failed or missing → the problem is in the Apex layer; the unit's own journal lines say why.</li>" +
    "<li>Neither → note the exact boot time and what <i>did</i> answer, and file it with those two outputs attached. Guessing wastes more time than the journal takes to read.</li></ul></div>" +
    "<div class='doc-sec'><h4>5. One-liner summary</h4>" +
    "<ul><li>Boot units armed? — <span class='mono'>systemctl --user is-enabled navi-bridge.service navi-llamafile.service</span></li>" +
    "<li>Linger on? — <span class='mono'>loginctl show-user \"$(id -un)\" --property=Linger --value</span> (fallback: <span class='mono'>ls /var/lib/systemd/linger/</span>)</li>" +
    "<li>Turn linger on — <span class='mono'>sudo loginctl enable-linger $USER</span></li>" +
    "<li>Wi-Fi secret stored? — <span class='mono'>sudo grep -c password /etc/netplan/90-NM-*.yaml</span></li>" +
    "<li>Store the Wi-Fi secret — <span class='mono'>sudo nmcli connection modify \"&lt;SSID&gt;\" wifi-sec.psk \"&lt;your-wifi-password&gt;\"</span></li>" +
    "<li>Bridge alive right now? — <span class='mono'>systemctl --user status navi-bridge --no-pager</span></li>" +
    "<li>Boot-time network failures — <span class='mono'>journalctl -b -u NetworkManager --no-pager | grep -i -E \"no secrets|activation.*fail\"</span></li></ul></div>"
  },
  { id: "installing", title: "Installing & updating", related: ["getting-started", "troubleshooting"], html:
    "<div class='doc-sec'><h4>Installing Navi, and keeping her up to date</h4>" +
  "<p>Navi lives on your own computer — the app, her model, her memory, and her voice are all on your machine.</p>" +
  "<p><b>Right now Navi installs on Linux.</b> That is the one installer in the package: <span class='mono'>install.sh</span>. How you run it depends on where your copy came from — from the <b>release zip</b>, run <span class='mono'>./install.sh</span> (its scripts arrive executable, so that just works); from a <b>git clone or GitHub's source zip</b>, run <span class='mono'>bash install.sh</span> instead (the paragraph below explains why, in plain words). Windows and macOS installers are planned for later — they are not in this package yet, so there is nothing to run on those systems today.</p><ol>" +
  "<li>Download the app package and unzip it — or clone the repo / unzip GitHub's source zip, and use <span class='mono'>bash install.sh</span> in the next step instead of <span class='mono'>./install.sh</span>.</li>" +
  "<li>Run the Linux installer: <span class='mono'>./install.sh</span> from the release zip, or <span class='mono'>bash install.sh</span> from a clone or source zip. It asks one question: should her model start when the app opens, or when the computer boots? Either is fine.</li>" +
  "<li>The installer downloads her model file (big — about 3 GB — so this takes a while) unless it is already there. It never downloads it twice.</li>" +
  "<li>It also offers her voice, and sets up the tool that builds her window, the same way — say no and she still works; she just cannot talk out loud yet.</li>" +
  "<li>It looks at your machine — the processor and its cores, how much memory, the graphics chip — and picks her thinking settings to fit it: how many threads, how big a context, how much she reads at once, and whether the graphics chip helps. A modest machine gets the gentle, proven numbers; a strong one gets more. It writes what it found and why into <span class='mono'>hardware-profile.log</span>, and you can see or change the result later in Settings.</li>" +
  "<li>Open <b>Apex</b> from your app menu. Her own window opens — no web browser. That window is the app.</li></ol>" +
  "<p>On Linux she installs into <span class='mono'>/opt/navi-apex</span>. Her window talks to a small helper program (the <b>bridge</b>) at port " + BRIDGE_PORT + ", and the bridge talks to her model at port 8080. <b>Your things are safe:</b> updating, reinstalling, and even a fresh install (<span class='mono'>--fresh</span>) keep what is yours — her model file, installed chips and knowledge packs, the Vault, the DHD certificate home (<span class='mono'>config/dhd/</span> — a real certificate there is never wiped by a reinstall), her Soul and Memory pages, her voice and its models. A first install is the only true blank start.</p>" +
  "<p><b>One installer, every major Linux family.</b> The installer reads your distro from <span class='mono'>/etc/os-release</span> and says out loud which family it found. Only its dependency step changes with the family — the same development libraries and base tools, under each family's own package names:</p><ul>" +
  "<li><b>Debian family</b> (Debian, Ubuntu, Pop!_OS, Mint and their kin) — installed with <span class='mono'>apt</span>.</li>" +
  "<li><b>Fedora</b> and Fedora-based distros — installed with <span class='mono'>dnf</span>.</li>" +
  "<li><b>Arch</b> and Arch-based distros — installed with <span class='mono'>pacman</span>.</li>" +
  "<li><b>Bazzite</b> — Fedora-based but immutable, so it is its own case (below).</li></ul>" +
  "<p>Everything else — profiling your machine, the model download, what an update keeps, the startup choice — is the same on every family. On <b>Bazzite</b> the installer never layers packages onto the system with <span class='mono'>rpm-ostree</span> and never asks for a reboot: her window is built inside a Fedora <b>distrobox</b> when you have one, and when you don't, the window build is skipped — in plain words, during the install — and you get the complete core install: the bridge and the dashboard, which <span class='mono'>start.sh</span> opens in your browser. Create a Fedora distrobox later and re-run the installer to add the window. And if your distro isn't one the installer recognizes, it says so, guesses no package manager, installs everything it can user-space, and completes the core install just the same.</p>" +
  "<p><b>Installing from a git clone — or from GitHub's source zip</b> (the zip the green Code button offers, the one that unpacks to a folder like <span class='mono'>Apex-main</span>) <b>works too</b> — with two honest differences. <b>First, how you run it:</b> from a clone or a source zip, the way is <span class='mono'>bash install.sh</span> — and <span class='mono'>bash start.sh</span> when you start her from that source tree. Run it through bash because it needs no executable permission. Why, in plain words: the git tree does not preserve the scripts' executable permission, so every script that comes out of a clone or a source zip arrives without it, and a script without that permission cannot be run as <span class='mono'>./install.sh</span> until the permission is set — running it through bash skips that entirely, because bash reads the file itself. From the <b>release zip</b> it is the other way round: its scripts arrive executable, so <span class='mono'>./install.sh</span> is the instruction there. Release zip → <span class='mono'>./install.sh</span>; clone or GitHub source zip → <span class='mono'>bash install.sh</span>. If you try <span class='mono'>./install.sh</span> from a clone anyway, you will meet a baffling pair of errors — bash answers <i>Permission denied</i>, and <span class='mono'>sudo ./install.sh</span> answers <i>command not found</i>, which sounds like the file is not there at all. It is there; it just cannot be run that way. Use <span class='mono'>bash install.sh</span> and both errors go away. (If you prefer <span class='mono'>./install.sh</span>, you can set the permission yourself first — <span class='mono'>chmod +x install.sh start.sh run-llamafile.sh</span> — and then run it the usual way. That works too; bash is simply the shorter path, and the one these instructions lead with.) <b>Second, the icons:</b> the clone does not carry the binary icon files (the app icon, its <span class='mono'>.ico</span>/<span class='mono'>.icns</span> renditions, and her window's icon): those ship only inside the release zip. So a clone install runs without the custom icon — the installer says so in plain words while it installs, the app and its menu entry use a fallback icon, and her standalone window is not built, because it is built around that icon; she opens in your browser instead. Everything else about the install is exactly the same. The release zip remains the complete package.</p>" +
  "<p><b>Updating is real, and it works like this.</b> The <b>Updater</b> tab (and one quiet automatic check each time she starts) asks GitHub for the project's latest release and compares its tag with her VERSION file. If a newer release exists, the single line under Navi's status in the status column flips to a yellow <b>Update available</b>. The Updater screen shows that release's <b>notes</b> right there — the words from its GitHub release page, or, when the release page carries none, the matching section of the project's CHANGELOG — so you can read what changed before you press the button. Press <b>Download &amp; install</b> and she does the whole job from that one click: the release package is downloaded, checked (it must be a real Apex package — and a package that arrives gzip-wrapped is unwrapped and accepted, not refused), and unpacked beside the app, under <span class='mono'>updates/</span>; then a small helper that outlives the app runs that folder's installer — never with <span class='mono'>--fresh</span>, so everything that's yours is kept, exactly as the paragraph above promises — and relaunches her. While it works, the Updater names the step it is on: downloading, verifying, staging, installing, restarting. When she comes back, the Updater shows the confirmation in plain words — <b>Updated v0.1.6a → v0.1.7</b>, with the actual versions — and only when the install after the restart reads as what the update promised: the VERSION file's version — and, for a same-version build refresh, the build number the relaunched bridge reports and the one baked into the bridge on disk, since a refresh deliberately keeps the same version number. Before staging, the package itself is proven to be the build on offer: a package left beside the app by an earlier update is reused only when its size matches the offered package's, and the build number inside its bridge must match the release's, or it is fetched fresh. If any step fails, the Updater names the step and the reason, nothing is left half-applied that can be rolled back, and — once the package was staged — it shows the manual fallback as a fallback: the staged folder and the one command that finishes the job by hand, running that folder's <span class='mono'>./install.sh</span> in a terminal. That command carries your startup and voice choices as flags (<span class='mono'>--startup</span> / <span class='mono'>--voice</span>), so the installer never has to ask a question — which is the whole point in a shell with no terminal to answer one, like her own CLI shell: there, an installer that asks dies at the first question (issue #75, field-proven on a staged update), while the flagged command runs straight through. The helper keeps a <b>step log</b> while it works — <span class='mono'>apply-trace.log</span> in the update's folder under <span class='mono'>updates/</span>, its path named on the apply record — timestamping every step it completes, with a heartbeat while it waits, so an interrupted apply shows exactly where it stopped; if the helper itself fails or is stopped, the record is closed as failed at that step with the reason in words, and if the helper is killed outright — the one death it cannot record itself — the bridge's <b>apply watchdog</b> closes the record the same way, quoting the step log's last line, instead of leaving it claiming to be installing forever. A relaunched bridge that never answers fails the record at the restarting step, naming the build that was expected and what was found instead. And if a check cannot reach GitHub — no network, or GitHub's rate limit — the Updater says that, in those words, instead of pretending you are up to date.</p>" +
  "<p><b>An update never needs a reboot — and it proves it took.</b> Before any file is replaced, the installer finds the bridge that is running — by its pid file, by the process holding her port, and by every bridge process working out of the install folder — and stops it <i>provably</i>: it waits for the process to be gone and the port to be free, escalates to a forced end if a polite signal is not enough, and if the port still cannot be cleared it aborts before touching a single file, naming the process that holds the port and the exact command that ends it (<span class='mono'>kill -9 &lt;pid&gt;</span>). Nothing is left nameless: a stuck process is a named process, with its remedy printed. If a bridge was running when the install began, the installer also relaunches her at the end and checks that the bridge answering reports the new build before it says <span class='mono'>Done.</span> — an update is not finished when the files land, but when the new build is the thing answering. The apply helper runs the same escalation before its own relaunch, and a dashboard left open across the update notices the bridge is newer than the page and offers a reload in the status column, so the new UI is one click away rather than one reboot. (An installer run that should leave her stopped can say so: <span class='mono'>--no-relaunch</span> — and it prints plainly that Apex is not running.)</p>" +
  "<p><b>Two channels: Stable and Edge.</b> The Updater follows one release channel, set by the <b>Release channel</b> card directly under the Current card in the Updater tab — the panel reads Current, then Release channel, then the patch notes, then the Check for updates / Download &amp; install buttons. <b>Stable</b> follows full releases only — cut from the project's main branch and tagged with the bare version number, like <b>v0.1.7</b>. <b>Edge</b> follows the newest release including pre-releases — test builds cut from the project's separate dev branch and tagged with an <span class='mono'>e</span>, like <b>v0.1.8e</b>. Edge is how you get a build before it is finished: newer, less settled. <b>Until you choose a channel yourself, the default follows the build you are running</b>: an Edge build defaults to the Edge channel, a full release to Stable — a preview is never silently stranded on a channel that does not carry it. A channel you pick in the panel is yours and it stays. And if you are running an Edge build and set the channel to Stable yourself, the Updater says so plainly, in a notice in the panel: Edge builds and refreshes of your preview are published only on Edge, so none will be offered while the channel stands. An Edge build of a version is the preview of that version, never an upgrade over its full release — when the full release of the same numbers lands, graduating to it is the update. Switching back to Stable never downgrades you; it simply waits for the next full release to pass what you run. The <b>About this release</b> dropdown in the Updater tab carries the release page of the version you are running — its name, tag, whether it is a full release or an Edge pre-release, its published date, the link to GitHub, and its full patch notes — fetched with the same check, straight from the release page.</p>" +
  "<p><b>Checks also happen in the background.</b> While the bridge runs, it re-checks your channel on its own every three hours, the first run shortly after startup, and the dashboard folds the verdict in quietly: an available update shows as <b>Update available</b> without you pressing anything, and a stale one clears. It never interrupts an install already under way. <b>Edge publications of one version are numbered</b> — Build 1, Build 2, and so on: the Updater's Current line shows the build you are running, and when the same Edge version is republished with fixes, the offer is a <b>refresh</b> of the preview you already run (Build 2 replaces Build 1), labeled with its build — not a new version. When the offered update is an Edge pre-release, an amber notice in the Updater says so plainly: preview contents can change between builds, your Soul, Memory, chips and packs carry over as always, and the next full release supersedes the preview automatically; graduating to that full release gets a green notice instead, because updating leaves the preview line.</p>" +
  "<p><b>Turn Sudo Mode on before you update.</b> The installer's system step needs root, and without it an update can stall or finish without its system packages — field-proven the hard way. So when an update is available and Sudo Mode is off, the Updater shows a red warning directly above the <b>Download &amp; install</b> button: <i>Enable Sudo Mode before updating.</i> Turn Sudo Mode on (in the status column) and the warning is replaced by a quiet green <i>Sudo Mode is on — ready to update.</i> It is a warning, not a lock — the button still works, because you may know your machine needs nothing new.</p>" +
  "<p><b>Once you opt in, the install chain moves.</b> The moment you press Download &amp; install, the step chain — downloading, verifying, staging, installing, DHD prerequisites, restarting — appears below the buttons, as the panel's tail, with a slim progress bar across the top of its card: the bar for the glance, the chain for the receipts. And if the Installing step runs long, the chain says why, in place: <i>Taking a while? This step is likely rebuilding the UI — that can take a few minutes on modest hardware. It's working, not stuck. We're working on making it faster.</i> No countdown and no ETA — on a modest machine an honest note beats a lying estimate.</p>" +
