/* ------------------------------ Docs ----------------------------------- */
var DOC_PAGES = [
  { id: "getting-started", title: "Getting started", related: ["chat-cli", "installing"], html:
    "<p style='color:var(--dim)'>How Apex fits together, and how she starts.</p>" +
    "<div class='doc-sec'><h4>The shape of her — dashboard, bridge, model</h4>" +
  "<p>Apex is three pieces on your own machine. The <b>dashboard</b> is this page, served by the bridge at <span class='mono'>http://localhost:" + BRIDGE_PORT + "</span>. The <b>bridge</b> (bridge.py, in the install folder) does the real work: it serves the dashboard, runs shell commands, manages chips and workflows, holds the sudo root shell, and carries your words to the model. The <b>model server</b> is navi.llamafile, running <span class='mono'>./navi.llamafile --server --v2</span> plus the flags from her <b>hardware profile</b> on port 8080 — at install, the installer profiled this machine (CPU, RAM, GPU) and chose the context size, threads, batch size, and GPU layers to fit it, so her settings come from your hardware, not the developer's; Settings shows what was detected and what was chosen, and the full log is <span class='mono'>hardware-profile.log</span>; the model answers to the id <span class='mono'>navi</span>, which the bridge reads from the server itself (<span class='mono'>/v1/models</span>) rather than guessing. Nothing leaves the machine on its own — the only network calls the bridge makes are to GitHub: when you open the chip or pack catalogs, check something for updates, or, once you have signed in and set it up, run a backup. The <b>GitHub — issues &amp; backups</b> page in this wiki covers that whole side of her.</p>" +
  "<p>Two small details ride the frame: under the <b>APEX</b> wordmark sits her <b>tagline</b> — “Powered by Navi”, one static line; and at the top of the status column, her <b>presence line</b> starts at “Navi is here.” and cycles every few minutes through what she's up to — listening to the network breathe, arguing with a CAPTCHA, haunting Rockport's west end.</p></div>" +
    "<div class='doc-sec'><h4>Starting her up</h4>" +
  "<p>On Linux she lives in <span class='mono'>/opt/navi-apex</span>. Launch her from the application menu or <span class='mono'>./start.sh</span>. Every launch is check-first: the launcher probes the model server, and if navi.llamafile is already running — from boot, an earlier launch, or started by hand — it leaves it alone and just runs the app; only when nothing answers does it start the server itself, with <span class='mono'>./navi.llamafile --server --v2</span> and the hardware-profile flags from <span class='mono'>config/navi.config.json</span>. The launcher starts the bridge, verifies the thing answering on port " + BRIDGE_PORT + " is really this build — naming whatever else it finds by its page title — and only then opens the dashboard. During install you chose when the model server starts: <b>on app launch</b> (the bridge starts navi.llamafile when you press Connect) or <b>at system boot</b>. Server output lands in <span class='mono'>navi.llamafile.log</span> beside the app.</p></div>" },
  { id: "chat-cli", title: "Chat & CLI mode", related: ["chips-guide", "voice"], html:
    "<div class='doc-sec'><h4>Chat and CLI access</h4>" +
  "<p>Chat is <b>CLI-first</b>. Type a system command — anything whose first word is a command this machine has — and it runs immediately, no model call, no waiting on Navi to orchestrate it: the raw terminal output lands in the thread as a terminal block and becomes <b>context she reasons over</b>, so you can list a folder and then ask her about a file the listing showed. Everything else goes to Navi as conversation, including plain-language requests like “show me the contents of /home/name/”, where she runs the command and answers with the actual output attached. Under the composer sit two mode toggles — <b>CLI</b> and <b>Navi</b>: press one once and it latches, so every line you send goes that way until you press the other; the pill beside them shows which way the current line will go, and clicking the pill flips the latch. A leading <span class='mono'>$</span> flips to a command, a leading <span class='mono'>&gt;</span> flips back to Navi — and either one re-latches the mode to match. Chips are untouched by the routing: they are her own purpose-built tools, run the same ways as ever.</p>" +
  "<p>The composer works like a good shell: the line is <b>colored as you type</b> — the command word by whether the system knows it, flags, quoted strings, and paths each in their own color, the zsh-syntax-highlighting read — a dim <b>ghost</b> of the most recent matching command from this chat completes the line (Tab or → accepts it, in the zsh-autosuggestions way), and the command word autocompletes from what the system has installed, the same set that decides the CLI route. The terminal blocks in the thread keep the same coloring, so the history reads like a real shell session. Her replies render as markdown: code arrives as code blocks, not literal backticks. When navi.llamafile is disconnected, chat drops to a <b>plain command line</b> until you reconnect from the status column; chips still run in that mode. Conversations are saved as known chats — switch in Memory.</p>" +
  "<p><b>Her window.</b> Apex opens in her own standalone window — the Tauri shell — and closing the window quits the app. There is no tray icon and no login autostart: she runs when you launch her from the application menu, and not before. Her window binary is verified, never assumed: installers stamp it with a hash of the shell sources, a failed rebuild retires the previous binary (navi-apex-shell.stale) instead of leaving it to be run, and the launchers refuse to run a binary the stamp doesn't cover — an older shell is a different app wearing this build's name.</p></div>" +
    "<div class='doc-sec'><h4>Sudo mode</h4>" +
  "<p>The status column's sudo switch makes Navi execute commands as root. Turning it on asks for your sudo password once; the bridge validates it by opening <b>one persistent root shell</b> that every sudo command runs inside, so a fingerprint-first PAM stack is consulted exactly once, at authentication. The password lives only in this page's memory — never saved, never logged — and turning sudo off closes the root shell on the spot.</p></div>" +
    "<div class='doc-sec'><h4>Raw terminal work — Chat's CLI mode</h4>" +
  "<p>There is no separate terminal view: <b>Chat's CLI mode is the terminal</b>. Press the composer's <b>CLI</b> toggle once and it latches — every line you send runs as a command and the raw output lands in the thread as a terminal block, with nothing of Navi in the loop until you press <b>Navi</b> (or start a line with <span class='mono'>&gt;</span>) to latch back. The same installed commands decide what counts as a command, the same autocomplete finishes the command word as you type, and the same sudo switch in the status column covers the commands you run this way.</p></div>" },
  { id: "chips-guide", title: "Chips development guide", related: ["navi-functions", "chips-publishing"], html:
    "<div class='doc-sec'><h4>Chips — chips, the catalog, and the Studio</h4>" +
  "<p>A chip is a small Python module shipped as a <b>chip</b>: a .png whose entire codebase rides inside the image. A loadable chip declares <span class='mono'>command</span>, <span class='mono'>use</span>, <span class='mono'>aliases</span> and <span class='mono'>params</span>, and defines <span class='mono'>run(arguments)</span>. Chips reach Navi through <span class='mono'>navi_internal.navi_instance</span> — <span class='mono'>print_message(text)</span> to speak, <span class='mono'>llm_chat(message)</span> to ask her model, <span class='mono'>process_message(text)</span> for her full pipeline. Every method is written up in full on this wiki's <b>Navi Chip Functions</b> page — the documentation is their home; Chip Studio's one pointer is a button that opens the Docs there.</p>" +
  "<p><b>Navi User Repo (NUR)</b> searches GitHub for repos tagged <span class='mono'>navi-chips</span> — that topic is the whole store. Install tracks the latest release; a newer release offers an <b>Update</b>. <b>Chip Studio</b> is where chips are written: a full code editor with highlighting, find, templates, and a live structure check. To publish: public repo, the <span class='mono'>navi-chips</span> topic, a release tag as the version.</p>" +
  "<p><b>Editing a chip you already have.</b> Any chip in the folder can go back to the Studio — pick it in the Studio's <b>Open a chip</b> list: forged chips, GitHub installs, and chips you once exported and installed again all open with their whole file set, root.py and modules together. Saving re-forges the chip with your changes inside. If the chip came from GitHub, saving marks it <b>edited locally</b>: the app says plainly that your copy no longer matches the published one, and an Update will refuse rather than quietly overwrite your edits. To share your version, use <b>Export for GitHub</b> in Navi User Repo (NUR) and cut a new release. Knowledge packs work the same way: <b>Edit in RAG Studio</b> on the RAG tab reopens any pack — documents in or out, name and description adjusted — and saving rebuilds its index on your machine.</p></div>" +
    "<div class='doc-sec'><h4>Running chips from chat, and Workflows</h4>" +
  "<p>Any loaded chip runs from the conversation: <span class='mono'>/chip &lt;name&gt;</span>, “run the &lt;name&gt; chip”, its name alone, or its pill in the row above the composer — its output lands in the thread. The bridge genuinely runs it: code defining <span class='mono'>run()</span> executes with a working <span class='mono'>navi_internal</span>; a chip that only declares an output shows that instead. <b>Workflows</b> chain chips in order — each chip's output becomes the next chip's input, and the last output is the result.</p></div>" +
    "<div class='doc-sec'><h4>Writing a chip, step by step</h4>" +
  "<p>A <b>chip</b> is a small Python program Navi can run. A chip is a set of files: <span class='mono'>root.py</span> — the main file, the one Navi runs; every chip has exactly one — and helper files like <span class='mono'>helpers.py</span>, extra Python files root.py brings in with <span class='mono'>import helpers</span>. The rules root.py follows (the Studio checks them and underlines what is missing):</p><ol>" +
  "<li>It brings in Navi with <span class='mono'>import navi_internal</span> and takes hold of her with <span class='mono'>navi_instance = navi_internal.navi_instance</span>.</li>" +
  "<li>It says its name with <span class='mono'>command</span> — the word people type to run it.</li>" +
  "<li>It says what it does with <span class='mono'>use</span> — one short line.</li>" +
  "<li>It can list other names in <span class='mono'>aliases</span> and describe its inputs in <span class='mono'>params</span> (what <span class='mono'>-help</span> shows).</li>" +
  "<li>It defines <span class='mono'>run(arguments)</span> — the part Navi calls; <span class='mono'>arguments.text</span> is the words typed after the chip's name.</li></ol>" +
  "<p>Through navi_instance a chip can <span class='mono'>print_message(text)</span> (show a line), <span class='mono'>llm_chat(text)</span> (ask her model), <span class='mono'>process_message(text)</span> (hand text to Navi as if typed), <span class='mono'>get_user()</span>/<span class='mono'>set_user(name)</span>, <span class='mono'>clear_terminal()</span>, and <span class='mono'>chat_with_navi()</span>. Every one of those functions is explained in full — what it takes, what it gives back, and when to reach for it — on this wiki's <b>Navi Chip Functions</b> page, in the sidebar. <b>Making one:</b> Chips tab → Chip Studio → name it, write root.py, add helper files in the file list, Forge chip. The whole file set packs into the chip picture. The editor colors code, guides indents, folds blocks, finds words in every file, saves on its own, underlines missing pieces, and goes full screen — its toolbar holds the rest (command palette, outline, zoom, wrap). The writing desk itself has its own page in the sidebar: <b>The Chip Studio editor</b>.</p></div>" },
  { id: "navi-functions", title: "Navi Chip Functions", related: ["chips-guide", "studio-editor"], html:
    "<div class='doc-sec'><h4>Navi Chip Functions — what a chip can call</h4>" +
  "<p>A chip does not run off on its own — it runs inside Navi, and everything it does with her goes through one doorway: <span class='mono'>navi_internal</span>, her own chip API. At the top of root.py the chip brings her in and takes hold of the live instance:</p><ul>" +
  "<li><span class='mono'>import navi_internal</span> — brings Navi's chip API into the chip.</li>" +
  "<li><span class='mono'>navi_instance = navi_internal.navi_instance</span> — the live Navi herself. Every function below is called on this instance; take hold of it first, at the top of <span class='mono'>run()</span> or at module level.</li></ul>" +
  "<p><b>Talking and thinking.</b> The three functions a chip reaches for most:</p><ul>" +
  "<li><span class='mono'>print_message(text, include_ai_name=True)</span> — prints a message to Navi's terminal, with her name in front of it unless you pass <span class='mono'>include_ai_name=False</span>. This is the main way a chip talks: results, progress, errors — if the operator should see it, it goes through here.</li>" +
  "<li><span class='mono'>llm_chat(user_message, called_from_app=False)</span> — sends a message to Navi's model and returns its response, so a chip can ask her to think and then work with what she says. The published navi-nmap chip uses it to turn raw scan output into a summary a person can read.</li>" +
  "<li><span class='mono'>process_message(user_message)</span> — runs a message through Navi's full pipeline — command detection and all — exactly as if the operator had typed it. Reach for it when the chip wants Navi herself to handle something, not just her model.</li></ul>" +
  "<p>The difference between the last two matters: <span class='mono'>llm_chat</span> is a question and an answer; <span class='mono'>process_message</span> is handing her the keyboard.</p></div>" +
    "<div class='doc-sec'><h4>The operator, the terminal, and the session</h4>" +
  "<p><b>Who she is working for:</b></p><ul>" +
  "<li><span class='mono'>get_user()</span> — returns the current operator's name: the name selected in Settings, the one her greetings use.</li>" +
  "<li><span class='mono'>set_user(sys_user)</span> — sets the current operator's name.</li></ul>" +
  "<p><b>The screen and the session:</b></p><ul>" +
  "<li><span class='mono'>clear_terminal()</span> — clears the terminal screen and reprints the Navi banner. A chip that is about to draw something full-screen starts here.</li>" +
  "<li><span class='mono'>chat_with_navi()</span> — opens an interactive chat session with Navi, dropping the operator into conversation with her from inside the chip.</li>" +
  "<li><span class='mono'>setup_history()</span> — initializes the history for prompt sessions, so a chip that runs its own prompts keeps them navigable.</li>" +
  "<li><span class='mono'>setup_navi_vocab()</span> — registers commands and aliases with Navi's vocabulary (the spaCy entity ruler), so her command detection learns the words the chip brought with it.</li></ul>" +
  "<p><b>This page is their home.</b> The full method list lives here in the documentation, complete and kept current — Chip Studio carries no method panels of its own, only a button that opens the Docs at this page, so the list is written once and read while you write. Upstream, the project's chip-developer wiki page, <i>Developing Chips — Indepth</i>, documents <span class='mono'>navi_internal.py</span>'s NaviApp class — the source this page follows. New to chips entirely? Start with the <b>Chips development guide</b>, in the sidebar.</p></div>" },
  { id: "studio-editor", title: "The Chip Studio editor", related: ["chips-guide", "glossary"], html:
    "<div class='doc-sec'><h4>The Chip Studio editor, button by button</h4>" +
  "<p>The editor is the writing desk inside Chip Studio — the place chip code gets written. It looks plain on purpose: everything it does is one click or one key away, and this page names each thing in the order you will meet it.</p>" +
  "<p><b>These pages live in the Docs view.</b> This wiki's home is the Docs view — the main documentation window. Press <b>Pop out</b> at the top of the Docs view and the wiki detaches into its own window, open at the page you were reading, so you can keep it beside the editor or the chat while you work. <b>Pop back in</b> — in the popped window or in the Docs view holding its place — returns it to the Docs view, same page. The pop-out is always another window entirely — the app's own second window — never a panel inside this one; if a window host ever blocks it, the Docs view says so and offers a direct link that opens the wiki in a new window instead.</p>" +
  "<p><b>The file list.</b> On the left is the list of the chip's files. <span class='mono'>root.py</span> sits at the top — the main file, the one Navi runs. Click any file to open it. Buttons under the list add a new file, rename the open one, or delete it (root.py cannot be deleted — every chip needs its main file). A dot beside a file's name means “changed, not saved yet”. Everything in the list travels with the chip: forge the chip and all the files go inside the picture.</p>" +
  "<p><b>Full screen.</b> The button in the toolbar with the four corners makes the editor fill the whole app window — room to think on a big chip. Press it again, or press <span class='mono'>Esc</span>, to shrink it back. Your place in the code does not move either way.</p>" +
  "<p><b>Reading the code.</b> The editor colors the code — names, words, and numbers each get their own color, so the shape of a line is visible at a glance. Thin vertical lines (<b>indent guides</b>) show where a block starts and ends. Click the small arrow beside a block to <b>fold</b> it away; click again to bring it back. Folding is only for your eyes — a save always keeps the whole file.</p>" +
  "<p><b>Finding things.</b> <b>Find</b> searches the open file, and can replace what it finds. <b>Find in all files</b> searches every file in the chip and lists the hits as file and line — click a hit to jump straight there. The <b>Outline</b> list names every function and class in the file; pick one to jump to it. The command palette also has <b>go to line</b> for when you know the number.</p>" +
  "<p><b>The red squiggles.</b> A wavy red line under code means the chip is missing something it needs — a file with no <span class='mono'>run()</span>, say. The bar under the editor says what is wrong, in words. Fix the words and the line goes away.</p>" +
  "<p><b>More than one cursor.</b> Hold <span class='mono'>Alt</span> and click to plant another cursor. Type once and every cursor types at once — handy for renaming a word in ten places. The palette's “clear extra cursors” puts you back to one.</p>" +
  "<p><b>The command palette.</b> The <b>Commands</b> button opens one box that lists everything the editor can do. Type a few letters of the thing you want, press Enter, and it happens. If you forget where a button lives, the palette knows.</p>" +
  "<p><b>Minimap, zoom, wrap.</b> The thin strip on the right is a tiny picture of the whole file — click it to jump. <b>Zoom</b> makes the letters bigger or smaller. <b>Wrap</b> folds long lines onto the screen instead of letting them run off the side.</p>" +
  "<p><b>Saving.</b> On a chip that already exists, the editor saves by itself while you work — watch the dot beside the file's name disappear. <span class='mono'>Ctrl+S</span> saves right now. On a brand-new chip, <b>Forge chip</b> is the save.</p></div>" },
  { id: "chips-publishing", title: "Publishing chips", related: ["chips-guide", "rag"], html:
    "<div class='doc-sec'><h4>Publishing a chip on GitHub</h4>" +
  "<p>Publishing means putting your chip on <b>GitHub</b> (a website that holds code) so any Navi can find and install it. The export builds the whole package — you never copy files by hand:</p><ol>" +
  "<li>Forge the chip in Chip Studio first.</li>" +
  "<li>Open Chips → Navi User Repo (NUR) → Local Chips and find your chip — installed chips under <b>Installed</b>, your own makes under <b>Forged</b>.</li>" +
  "<li>Type a version like <span class='mono'>0.1.0</span> (a version is just a label: this is the first one) and press <b>Export for GitHub</b>, then download the ZIP (one file holding many files).</li>" +
  "<li>On GitHub, make a new <b>public</b> repository (one project's folder on GitHub; public means everyone can see it) and unzip the export at its top.</li>" +
  "<li>On the repo page, open the About gear and add the topic <span class='mono'>navi-chips</span> — a topic is a label, and this label is how Navi finds chips.</li>" +
  "<li>Make a <b>release</b> (GitHub's way of saying: this exact version, ready to download) whose tag is the same version.</li></ol>" +
  "<p><b>Inside the export:</b> <span class='mono'>root.py</span> and the helper files at the top (install downloads every Python file at the repo root — root.py, or the entry named in the manifest, is the chip; the rest are its modules); <span class='mono'>navi-chip.json</span>, a small card with the name, description, version, and entry file; the chip <span class='mono'>.png</span>; and a generated <span class='mono'>README.md</span> page. <b>Installs and updates:</b> Navi User Repo (NUR) searches GitHub for the <span class='mono'>navi-chips</span> topic; Install brings the whole file set down as a chip; a release with a bigger tag offers every install an update. Knowledge packs publish the same way — see the RAG page.</p></div>" },
  { id: "rag", title: "RAG packs & exports", related: ["chips-publishing", "settings"], html:
    "<div class='doc-sec'><h4>RAG — knowledge packs</h4>" +
  "<p>Her knowledge comes in <b>packs</b>, chip-style like her chips, managed in the <b>RAG tab</b>. A pack is a GitHub repo tagged <span class='mono'>navi-rag</span> whose documents are its <span class='mono'>.md</span>/<span class='mono'>.txt</span> files and the extracted text of its <span class='mono'>.pdf</span> files (a PDF gives up its words at the door; only the text is stored). Installing one downloads the documents into <span class='mono'>rag-packs/</span> and <b>builds the pack's index there, at install time</b> — feature-hashed term vectors, small local embeddings computed with the standard library alone, no model to download. At question time only your question is embedded, so retrieval stays fluid on CPU. Each pack carries an <b>active</b> toggle: only active packs feed her answers, and when a pack informs an answer, the pack and the document it came from appear as a source pill under her message — display only, never part of her reply text, so her voice never reads citations aloud, and a message that drew on no pack carries none. A bare <span class='mono'>/rag</span> in chat lists the packs on this machine and which are active. <b>RAG Studio</b> (the RAG tab's second tab) forges packs from documents on your disk — picked files, or a folder on this machine — into the same folder, documents, index, and metadata, ready to use immediately. Publishing a pack mirrors chips: a public repo, the <span class='mono'>navi-rag</span> topic, and a release tag as its version — a newer tag is what offers an update. The Packs list's <b>Export for GitHub</b> button packages a pack into exactly that repo shape: a generated README page (installs skip a root README, so it is never indexed), a navi-rag.json manifest, the documents under documents/, a .gitignore, and the pack's built index.json, shipped as a reference copy — installing Navi rebuilds the index locally from the documents, so the two can never disagree. Installed packs and their indexes are on the persistence keep-list with her chips and voice models: updates and --fresh installs keep them. The folder starts empty — Navi ships with no pre-installed packs.</p></div>" +
    "<div class='doc-sec'><h4>Publishing a pack, step by step</h4>" +
  "<ol><li>On the Packs list, type a version like <span class='mono'>0.1.0</span> and press <b>Export for GitHub</b>; download the ZIP.</li>" +
  "<li>Make a new public repository on GitHub and unzip the export at its top.</li>" +
  "<li>Add the topic <span class='mono'>navi-rag</span> (repo page → About gear → Topics).</li>" +
  "<li>Make a release whose tag is the same version.</li></ol>" +
  "<p>Inside the export: a <span class='mono'>README.md</span> page (installs skip a root README — it describes the pack, it is never a document), the <span class='mono'>navi-rag.json</span> card, the documents under <span class='mono'>documents/</span>, and <span class='mono'>index.json</span> — the built index, shipped as the pack's reference copy. Install downloads the documents (Markdown, text, and PDF files anywhere in the repo) and builds the index fresh on that machine. A release with a bigger tag offers everyone an update.</p></div>" },
  { id: "voice", title: "Voice & calls", related: ["chat-cli", "settings"], html:
    "<div class='doc-sec'><h4>Her voice — calling Navi</h4>" +
  "<p>Navi can be <b>called</b>, not just typed at — and the whole loop is local, running on CPU on this machine, because a voice that phones home isn't hers. You speak; <b>faster-whisper</b> (OpenAI's Whisper on CTranslate2, int8) turns it into text; her model answers with her persona, her CLI access, and her chips intact; and <b>Kokoro</b> — an 82M-parameter voice model, Apache-2.0 — speaks the answer back, sentence by sentence as it arrives, so she starts talking before she's finished thinking. <b>Piper</b> is the lighter fallback engine. Nothing you say is recorded anywhere but this machine.</p>" +
  "<p>The <b>Voice tab</b> holds the pipeline and the call itself — her settings (which Whisper model hears you, which engine and voice she speaks with, her speed and pitch — saved in <span class='mono'>config/navi.config.json</span>) live in <b>Settings → Voice</b>: a Call button, push-to-talk through your real microphone, an elapsed timer, and a live transcript; the same call can be started from the Chat tab — the Call button beside its composer opens the live call panel (timer, push-to-talk, End) right in the chat window, with the thread as the transcript and the composer speaking to the call; a mic beside the chat composer does push-to-talk for one-off spoken messages, and typed-chat replies can be spoken aloud too. The speech engines are an optional install — the installers offer them in an isolated <span class='mono'>voice/venv</span> — and until they exist the app says voice is unavailable and names the step, rather than faking audio. Models download once into <span class='mono'>voice/models/</span>, which sits on the persistence keep-list with her chips, the llamafile, and her Soul/Memory. Finished calls are recorded in <span class='mono'>voice/calls.json</span> and filed into the conversation — a call is a conversation, not a separate mode. <b>Her voice is picked in Settings → Voice</b>: the list is auto-generated — the bridge enumerates the voices this machine's Kokoro installation actually has (the voice files it holds, or the catalog the installed package pulls from, which download on first use) — and she defaults to <b>Isabella</b>, the British female voice (<span class='mono'>bf_isabella</span>).</p></div>" },
  { id: "settings", title: "Settings & persona", related: ["installing", "voice", "github"], html:
    "<div class='doc-sec'><h4>Her persona — Soul and Memory</h4>" +
  "<p>Navi's personality is two documents in <span class='mono'>config/</span>: <span class='mono'>soul.md</span> (who she is) and <span class='mono'>memory.md</span> (what she carries). The bridge builds her system prompt from them on every chat. Both are editable in Settings, along with what she calls you. Nothing overwrites them once they exist: updates, reinstalls, and even a --fresh install stash and restore them, along with her installed chips and the llamafile. Only a first install creates them fresh.</p></div>" +
    "<div class='doc-sec'><h4>Memory, the updater, and Settings</h4>" +
  "<p><b>Memory</b> holds local memory entries and the known chats. <b>RAG</b> holds her knowledge packs (the section above). The <b>Updater</b> watches the release channel. <b>Settings</b> is organized into topic tabs, and every setting lives under exactly one: <b>Operator &amp; Persona</b> (what she calls you, and the Soul and Memory editors), <b>Appearance</b> (the theme picker), <b>Voice</b> (her voice settings), <b>GitHub &amp; Backup</b> (sign-in and the backup/import block), and <b>System</b> — the backend switch (<b>Live</b> talks to the real bridge and llamafile, <b>Mock</b> is an offline simulator for the UI, and the app always starts Live), the hardware profile (the detected profile, its override, and re-detect), plus installed commands.</p>" +
  "<p><b>Themes.</b> Settings' Appearance tab holds the theme picker: four palettes over the same colors the whole app is built from, so every screen — dropdowns and typing boxes included — changes together. <b>Signature dark</b> is her usual console. <b>Light</b> is the same console on pale slate. <b>High contrast</b> is pure black with white words and bright signals. <b>Nordic dark</b> is the Nord family: Polar Night backgrounds in steps, pale Snow Storm words, and Frost-blue highlights with muted Aurora colors. In Nordic, each menu icon gets its own color from that palette — Chat is Frost blue, Voice Aurora purple, Chips Aurora yellow, and so on — the same color everywhere it appears, even in the collapsed rail, and her written answers dress the same way: Snow Storm words, Frost headings and links, and code sitting on the deepest Polar Night step. Pick one and it stays picked — the choice is saved in your config like the other settings.</p>" +
  "<p><b>Hardware profile.</b> Settings' System tab shows the profile the installer made of your machine: what it detected (the CPU and its core count, how much memory, the graphics chip — separate or built in, and its memory), and the settings it chose from that — threads, context size, batch size, and graphics layers. Her settings are picked from <i>your</i> machine at install, never copied from the developer's: a modest laptop gets the proven gentle numbers, a strong machine gets more room. Type your own numbers to override them, or press <b>Re-detect</b> to profile the machine again and return to the automatic choice. The installer writes what it found and why it chose it to <span class='mono'>hardware-profile.log</span> in the install folder.</p></div>" },
  { id: "github", title: "GitHub — the pulse, issues & backups", related: ["settings", "installing"], html:
    "<div class='doc-sec'><h4>The pulse — a peek into the project</h4>" +
  "<p>The <b>GitHub</b> item in the side menu is her window into the project itself: <span class='mono'>AlexKollar/Apex</span>, the repo this rebuild lives in (the original Navi she grew from stays at SaintsSec/Navi as the legacy archive). The section has four tabs. <b>Overview</b> is the pulse: the repo's description, its stars, forks, and watchers, the latest release, the most recent commits, the open-issue count, and when it last moved — read live from GitHub through the bridge, with a Refresh button, and honest about it when a read fails. <b>Issues</b> is the repo's current open-issues list — number, title, labels, author, when it last changed — also live, also refreshable. <b>Roadmap</b> is Alex's project board for Apex and <b>Discussions</b> are the project's open forum: in her desktop window each opens as a webview in its own window — GitHub will not be framed inside a web page, so where no webview exists the tab says so and links out to GitHub instead of showing a blank frame. At the bottom of the Issues, Roadmap, and Discussions tabs sits one quiet link to the matching place on GitHub — file an issue, open the board, start a discussion. <b>Looking needs no account at all</b>, in any tab. Clicking an issue (or the Issues-page button) opens it in your browser, in a window of its own — never inside her window. Filing an issue happens on that page too: when you write one, GitHub asks you to sign in there, with your own account. That is GitHub's door, not Navi's — she never stands between you and it. Account things — sign-in, backup, import — live in <b>Settings → GitHub &amp; Backup</b>; this section is for looking at the project.</p></div>" +
    "<div class='doc-sec'><h4>Signing in — only for GitHub things, never for Navi</h4>" +
  "<p>Navi <b>never</b> needs you to sign in. She starts, chats, runs commands, uses her chips and knowledge packs, and works with no internet at all — signed out, forever, if you like. Signing in exists for one reason: a few actions write to GitHub (backups and imports, below), and GitHub only lets an account write to its own things.</p>" +
  "<p>Sign-in uses GitHub's <b>Device Flow</b> — the way made for apps like hers. Press <b>Sign in with GitHub</b> and you get a short code. Open <span class='mono'>github.com/login/device</span> in your browser, type the code, and say yes. GitHub tells Navi you're in. Your password is never typed into Navi, and there is no secret key hidden inside the app. The token GitHub hands back is kept in one file on your own machine (<span class='mono'>config/github-auth.json</span>, readable only by you). It is <b>never</b> written into a backup and never logged.</p>" +
  "<p>One thing has to exist before sign-in can work: a <b>client ID</b>. That is a short public label for the app, made by registering an “OAuth App” on GitHub — and it has to be registered under the project owner's own GitHub account, so Navi does not ship with one filled in. If Settings → GitHub &amp; Backup says no client ID is configured, it shows the three short steps to make one and the box to paste it into. Until then, everything else — the GitHub section's pulse and Issues included — works as always.</p></div>" +
    "<div class='doc-sec'><h4>Backups — the ready-to-fly essentials</h4>" +
  "<p>A backup is a copy of Navi, kept in a <b>repository</b> (a project's folder on GitHub) under <b>your own account</b> — the name is yours to pick; <span class='mono'>navi-backup</span> is the starter suggestion. It is made <b>private</b> unless you choose otherwise, and the page warns you plainly if you pick public: a public backup puts her Soul and Memory on the open internet.</p>" +
  "<p>The backup carries <b>only the essentials</b> — the things a fresh Navi needs to be fully herself. Fresh install + import = <b>ready to fly</b>:</p><ul>" +
  "<li>Her <b>Soul</b> document — who she is.</li>" +
  "<li>Her <b>Memory</b> document — what she carries.</li>" +
  "<li><b>Settings &amp; config</b> — what she calls you, her theme, her installed commands, and her voice choice and voice settings.</li>" +
  "<li>Her <b>installed chips</b> — the whole chips, so they come back working, not just named.</li>" +
  "<li>Her <b>RAG packs</b> — their documents, their built indexes, and which ones are switched on.</li>" +
  "<li>Her <b>workflows</b> — the saved chains of chips.</li></ul>" +
  "<p>Some things are <b>never</b> backed up, on purpose: your chat transcripts and call logs (those are history, not identity), caches and log files, her <b>hardware profile</b> (a new machine gets profiled fresh at its own install — an old machine's numbers must never be forced onto it), and her voice model files (big downloads that reinstall themselves; her voice <i>settings</i> are backed up).</p>" +
  "<p>The essentials checklist in Settings → GitHub &amp; Backup starts with all six essentials ticked. <b>Soul, Memory, and Settings &amp; config are ticked automatically and stay ticked</b> — they are what makes an imported Navi her, so every backup carries them. Installed chips, RAG packs, and workflows are yours to choose; untick one of those and it tells you what it means: an import from that backup will no longer be fully ready-to-fly, because the unticked part stays behind.</p></div>" +
    "<div class='doc-sec'><h4>When backups happen, and bringing her back</h4>" +
  "<p>You pick how often: <b>every day, every 3 days, every 5 days, or every 7 days</b>. Navi checks the clock herself — when she starts, and while she is running — and when a backup is due and she is signed in, she runs it. That is the honest limit: <b>backups happen while Navi is running.</b> If the machine is off when one comes due, it simply runs at her next start. Settings → GitHub &amp; Backup shows the last backup's time and what it wrote, and the same for the last import — and the status column carries a <b>Backup</b> section with the last backup's time and result at a glance (or says plainly that no backup has run yet).</p>" +
  "<p><b>Import</b> (in Settings → GitHub &amp; Backup) is how a backup becomes a Navi again — on a fresh install, or any time you want to roll back to the backed-up her. Press <b>Preview what would change</b> first: it lists, essential by essential, what the backup holds and what restoring it would replace. Nothing is overwritten until you press <b>Confirm import</b>. What was never backed up — transcripts, the old machine's hardware numbers, voice models — starts fresh, which is exactly what a new home should do.</p></div>" },
  { id: "installing", title: "Installing & updating", related: ["getting-started", "troubleshooting"], html:
    "<div class='doc-sec'><h4>Installing Navi, and keeping her up to date</h4>" +
  "<p>Navi lives on your own computer — the app, her model, her memory, and her voice are all on your machine.</p>" +
  "<p><b>Right now Navi installs on Linux.</b> That is the one installer in the package: <span class='mono'>./install.sh</span>. Windows and macOS installers are planned for later — they are not in this package yet, so there is nothing to run on those systems today.</p><ol>" +
  "<li>Download the app package and unzip it.</li>" +
  "<li>Run the Linux installer, <span class='mono'>./install.sh</span>. It asks one question: should her model start when the app opens, or when the computer boots? Either is fine.</li>" +
  "<li>The installer downloads her model file (big — about 3 GB — so this takes a while) unless it is already there. It never downloads it twice.</li>" +
  "<li>It also offers her voice, and sets up the tool that builds her window, the same way — say no and she still works; she just cannot talk out loud yet.</li>" +
  "<li>It looks at your machine — the processor and its cores, how much memory, the graphics chip — and picks her thinking settings to fit it: how many threads, how big a context, how much she reads at once, and whether the graphics chip helps. A modest machine gets the gentle, proven numbers; a strong one gets more. It writes what it found and why into <span class='mono'>hardware-profile.log</span>, and you can see or change the result later in Settings.</li>" +
  "<li>Open <b>Apex</b> from your app menu. Her own window opens — no web browser. That window is the app.</li></ol>" +
  "<p>On Linux she installs into <span class='mono'>/opt/navi-apex</span>. Her window talks to a small helper program (the <b>bridge</b>) at port " + BRIDGE_PORT + ", and the bridge talks to her model at port 8080. <b>Your things are safe:</b> updating, reinstalling, and even a fresh install (<span class='mono'>--fresh</span>) keep what is yours — her model file, installed chips and knowledge packs, her Soul and Memory pages, her voice and its models. A first install is the only true blank start.</p>" +
  "<p><b>Updating is real, and it works like this.</b> The <b>Updater</b> tab (and one quiet automatic check each time she starts) asks GitHub for the project's latest release and compares its tag with her VERSION file. If a newer release exists, the status column lights up <b>New Version Available</b>. Press <b>Download &amp; stage</b> and the release package is downloaded and unpacked beside the app, under <span class='mono'>updates/</span> — then the Updater shows you the one command that finishes the job: run that folder's <span class='mono'>./install.sh</span> in a terminal. She never installs over herself while she is running; the installer replaces the app and keeps everything that's yours, exactly as the paragraph above promises. And if a check cannot reach GitHub — no network, or GitHub's rate limit — the Updater says that, in those words, instead of pretending you are up to date.</p>" +
  "<p><b>One file says which version she is.</b> At the top of the install folder sits a plain text file named <span class='mono'>VERSION</span>. It holds the version number, and optionally a build status after it — like <span class='mono'>0.1.0 alpha</span>, which is what this first public release carries (the status word can be <span class='mono'>alpha</span>, <span class='mono'>beta</span>, or <span class='mono'>stable</span>; no word means stable). It is the one source of truth: the bridge reads it and reports the number and the status, the update checker reads the same file to compare against the newest release, and the dashboard shows it at the bottom of the side menu (under a divider, in the lower-left corner) as <b>Ver. + number + a one-letter status tag</b> — alpha wears <span class='mono'>a</span>, beta wears <span class='mono'>b</span>, stable wears none, the same letter style Python's PEP 440 versioning uses. So this alpha reads <b>Ver. 0.1.0a</b> and a stable build reads <b>Ver. 0.1.0</b>. With the side menu collapsed to its icon rail, the footer narrows with it: just the number and its tag, centered, in the same status color — the full <b>Ver.</b> form returns when the menu opens again. The number-and-tag is colored by status in every theme: red for alpha, yellow for beta, blue for stable (in Nordic dark, Aurora red #BF616A, Aurora yellow #EBCB8B, and Frost blue #88C0D0). The status column's UPDATER element carries no number — it reads <b>Not checked yet</b> until the first real check runs, <b>Up to date</b> once one has run clean, the plain words <b>Couldn't check for updates</b> when GitHub couldn't be reached, and it switches to a lit <b>New Version Available</b> warning when a check finds a newer one. Installing an update replaces the VERSION file along with the rest of the app; no other place stores the version.</p></div>" },
  { id: "troubleshooting", title: "Troubleshooting", related: ["installing", "getting-started"], html:
    "<div class='doc-sec'><h4>Troubleshooting</h4><ul>" +
  "<li><b>The dashboard shows some other page.</b> Something else holds port " + BRIDGE_PORT + " — the launcher names it by its page title; find it with <span class='mono'>ss -ltnp | grep " + BRIDGE_PORT + "</span>.</li>" +
  "<li><b>“BRIDGE OUT OF DATE”.</b> An older bridge process is still running after a reinstall. Quit the app fully and relaunch.</li>" +
  "<li><b>Chat 400s.</b> The bridge uses the model id the server itself reports (<span class='mono'>navi</span>); on failure the server's own error text is shown — check <span class='mono'>navi.llamafile.log</span>.</li>" +
  "<li><b>She doesn't answer.</b> Every chat request is bounded — at most 1,024 tokens of generation — and the bridge waits up to ten minutes for a CPU-bound reply to finish. If the wait runs out, the message in the thread says the model was still generating; that never means the server died. An empty reply from the model is reported the same way, in the thread, rather than swallowed as silence.</li>" +
  "<li><b>The llamafile won't start.</b> Press Connect — in app-launch mode the bridge starts the server itself and reports the specific failure.</li>" +
  "<li><b>Her voice is not installed.</b> Her voice is an extra the installer offers — it is not part of the main app. Say yes when the installer asks, or follow the step the Voice view names. Until then she still works; she just answers in writing instead of out loud.</li>" +
  "<li><b>A chip will not run.</b> Open it in Chip Studio and read the red squiggles first — a chip needs a <span class='mono'>command</span>, a <span class='mono'>use</span> line, and a <span class='mono'>run()</span> before Navi can run it, and the bar under the editor names what is missing. A chip that only declares an output is not broken: it shows that output instead of running code.</li>" +
  "<li><b>The catalog finds nothing.</b> The catalog is a live search of GitHub. With no network it finds nothing, and when GitHub itself is busy the search says so instead of pretending the shelf is empty — wait a minute and press Search again.</li>" +
  "<li><b>She answers without using my pack.</b> Only packs switched <b>on</b> feed her answers. Check the switch on the Packs tab. When a pack does help, the small label under her message names the pack and the document — no label means no pack was used for that answer.</li>" +
  "<li><b>The call will not start.</b> A call needs her voice installed and switched on, and her model connected. The Voice view names the missing piece — fix that one thing and try again.</li>" +
  "<li><b>Known issue: she cannot hear me in the desktop app.</b> Field report from the operator's Framework 13 (Pop!_OS), 2026-11-07, and noted on the Voice page at his request: in the standalone window, the microphone does not reach Navi — push-to-talk and calls get no working mic — even with the OS permission allowed. Her shell is built to grant the dashboard's mic requests, so the break is somewhere in that chain and the fix is still being worked on; it is <b>not fixed yet</b>. What works today: <b>typing</b>. The call panel takes typed lines and she answers out loud; Chat takes typed messages the whole time. If your mic works in the app, you are ahead of the field report — the Voice page shows what this window's own mic requests did this session, which helps narrow it down.</li></ul></div>" },
  { id: "glossary", title: "Glossary — the words we use", related: ["getting-started", "chips-guide"], html:
    "<div class='doc-sec'><h4>Glossary — the words we use, in plain words</h4>" +
  "<p>Every special word in this wiki, explained once, in the order you are most likely to meet it. If a page ever uses a word that is not clear, it should be in this list.</p>" +
  "<p><b>Dashboard</b> — the page you are looking at. The buttons, the chat, the lists: all of it is the dashboard.</p>" +
  "<p><b>Bridge</b> — a small helper program that lives in the install folder. The dashboard asks it to do things — run a command, start the model, save a setting — and it does them.</p>" +
  "<p><b>Model</b> — the part that thinks and writes her answers. Hers lives inside one big file.</p>" +
  "<p><b>navi.llamafile / llamafile</b> — that big file. It holds the model and the program that runs it, all in one file, so there is nothing else to install.</p>" +
  "<p><b>Port</b> — a numbered door on your own computer that programs talk through. The bridge listens at door " + BRIDGE_PORT + "; the model at door 8080. Nothing from the internet comes through them.</p>" +
  "<p><b>Chip</b> — a small program that gives Navi a new skill. You write it, or install one somebody else wrote.</p>" +
  "<p><b>Chip</b> — a chip packed into one picture file. The code hides inside the image. Share the picture and you have shared the chip.</p>" +
  "<p><b>root.py</b> — a chip's main file, the one Navi runs. Every chip has exactly one. Other files are helpers it can bring in with <span class='mono'>import</span>.</p>" +
  "<p><b>Workflow</b> — chips lined up in a row, where each one's answer is handed to the next one, like a bucket brigade.</p>" +
  "<p><b>Pack</b> — a bundle of documents Navi can look things up in before she answers. One pack is one topic.</p>" +
  "<p><b>Index</b> — the map a pack builds from its documents, so Navi can find the right page fast instead of reading everything every time.</p>" +
  "<p><b>Active</b> — switched on. Only active packs feed her answers.</p>" +
  "<p><b>Repository (repo)</b> — one project's folder on GitHub, the website that holds code.</p>" +
  "<p><b>Topic</b> — a label on a repository. The label <span class='mono'>navi-chips</span> is how Navi finds chips; <span class='mono'>navi-rag</span> is how she finds packs.</p>" +
  "<p><b>Release / tag</b> — a release is GitHub's way of saying “this exact version, ready to download”. Its tag is the version's name label, like <span class='mono'>0.1.0</span>. A bigger tag than the one you have is what offers an update.</p>" +
  "<p><b>Manifest</b> — a small card inside an export (like <span class='mono'>navi-chip.json</span>) that says what the package is: its name, its version, and which file starts it.</p>" +
  "<p><b>Soul / Memory</b> — two plain documents in the config folder: who Navi is, and what she carries with her. Together they are her <b>persona</b> — the way she acts.</p>" +
  "<p><b>Sudo / root</b> — <b>root</b> is the master account that can do anything on the machine. <b>Sudo</b> is asking to borrow it for one job.</p>" +
  "<p><b>Backend</b> — which engine the dashboard talks to. <b>Live</b> is the real bridge and model. <b>Mock</b> is a pretend one for trying the buttons safely.</p>" +
  "<p><b>Catalog</b> — the list the Chips and RAG tabs build by searching GitHub. It is a search result, not a store — the chips and packs themselves live in their repositories.</p></div>" },
];

/* ------------------------------ live calls ------------------------------ */
function stripCite(text) {
  // Citations are presentation, not prose: sources ride the chat
  // payload and render as pills under the message (srcPills). A
  // footer in the old shape ("— from …") is stripped wherever one
  // survives — a thread stored by an older build — so it never
  // shows as part of her words, never gets spoken, and never
  // rides back to the model as history.
  var lines = String(text || "").replace(/\s+$/, "").split("\n");
  while (lines.length && lines[lines.length - 1].trim().indexOf("— from ") === 0) {
    lines.pop();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  }
  return lines.join("\n");
}
function srcPills(sources) {
  // The breadcrumb path of where an answer came from: one quiet
  // pill per source, pack › document, drawn under the message it
  // belongs to. Only a message that actually drew on a pack
  // carries any — once the conversation moves on, they stop.
  if (!sources || !sources.length) return "";
  return "<div class='srcs' aria-label='Sources'>" + sources.map(function (s) { return "<span class='srcpill'>" + esc(s.pack) + " <span class='srcsep' aria-hidden='true'>›</span> " + esc(s.document) + "</span>"; }).join("") + "</div>";
}
// Ghost-hint history for the chat composer: the CLI lines already
// run in this conversation, newest first — terminal blocks carry
// their command; operator lines count when they routed to the CLI.
function chatCliHistory() {
  var out = [], seen = {};
  for (var i = messages.length - 1; i >= 0 && out.length < 50; i--) {
    var m = messages[i];
    var line = null;
    if (m.exec && !m.text) line = m.exec.command;
    else if (m.who === "YOU" && routeOfLine(m.text).kind === "cli") line = m.text;
    if (line && !seen[line]) { seen[line] = 1; out.push(line); }
  }
  return out;
}
// How one terminal block reads as model context: the command, the
// raw output, capped per block so prefill stays lean — with the
// truncation stated in the text, never silent.
function execContextText(x) {
  var out = String(x.output || "");
  var note = "";
  if (out.length > 1200) { note = "\n… [terminal output truncated for context — " + out.length + " characters in full]"; out = out.slice(0, 1200); }
  return "$ " + x.command + "\n" + out + note;
}
function liveChat(text, speak) {
  // Sliding history: only the last 20 messages ride to the model
  // (the slice above). Prefill is paid per token on CPU — an
  // ever-growing transcript would make every reply slower than the
  // last. The full conversation stays in this tab; only her view
  // of it slides. The bridge caps again on its side.
  // Reply presentation rule (the operator's call, stated plainly):
  // her answers are never typed out character by character. The
  // bridge request is non-streaming, the typing indicator covers
  // the whole wait, and when the reply is ready it renders complete,
  // all at once. Do not add a typewriter reveal here.
  // Terminal blocks ride as context: a block the operator produced
  // by running a command directly (CLI-first) becomes a system note
  // carrying the command and its output, and a block attached to
  // one of her replies folds into that reply's content — so her
  // next answer can reason over what the terminal showed (list a
  // folder, then ask her about a file in the listing) instead of
  // starting blind. Earlier builds filtered exec blocks out of
  // history entirely; that is exactly what CLI-first reverses.
  var hist = [];
  messages.slice(-20).forEach(function (x) {
    if (x.exec && !x.text) {
      hist.push({ role: "system", content: "Terminal output from earlier in this conversation — the operator ran this command directly in the chat:\n" + execContextText(x.exec) });
      return;
    }
    var content = x.who === "NAVI" ? stripCite(x.text) : String(x.text || "").replace(/^>\s+/, "");
    if (x.exec) content += "\n\n[terminal]\n" + execContextText(x.exec);
    hist.push({ role: x.who === "YOU" ? "user" : "assistant", content: content });
  });
  var payload = { messages: hist.concat([{ role: "user", content: text }]), sudo: !!CONFIG.sudo, sudo_password: CONFIG.sudo ? sudoPassword : "", operator_name: CONFIG.operatorName || "", speak: !!speak, mode: chatMode };
  return fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "bridge error"); return j; }); })
    .then(function (j) { return { text: stripCite(j.reply), exec: j.exec ? { command: j.exec.command, output: j.exec.output } : null, sources: (j.rag && j.rag.length) ? j.rag : null, mode: j.mode || "model" }; });
}
function liveShell(cmd) {
  return fetch("/api/shell", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command: cmd, sudo: !!CONFIG.sudo, sudo_password: CONFIG.sudo ? sudoPassword : "" }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { return { command: j.command, output: j.output + (j.exit_code ? "\n[exit " + j.exit_code + "]" : "") }; });
}

/* ----------------------------- autocomplete ----------------------------- */
// One completion system with two completers: the dropdown completes
// the command word from the system's commands; the ghost —
// zsh-autosuggestions style — completes the whole line from command
// history. They never fight: while the dropdown is open it owns
// Tab/Enter/arrows (and swallows the keystroke whole, so accepting
// a suggestion never also submits the line); the ghost shows only
// when the dropdown is closed, and Tab or Right Arrow accepts it.
// In rich mode the input also wears the highlight layer — the typed
// line, colored as it's typed when it routes to the CLI — and, when
// a hint element is supplied, drives the route hint under the
// composer, whose button flips the line's route by rewriting its
// marker prefix.
function attachAutocomplete(input, opts) {
  if (!input || input.dataset.acReady) return;
  input.dataset.acReady = "1";
  opts = opts || {};
  var wrap = input.parentElement;
  wrap.classList.add("ac-wrap");
  var box = document.createElement("div");
  box.className = "ac"; box.style.display = "none"; box.setAttribute("role", "listbox"); box.setAttribute("aria-label", "Command suggestions");
  wrap.appendChild(box);
  var layer = null, ghostLine = "", ghostOffFor = "";
  if (opts.rich) {
    layer = document.createElement("div");
    layer.className = "hlayer";
    layer.setAttribute("aria-hidden", "true");
    wrap.insertBefore(layer, input);
    input.classList.add("rich");
  }
  var items = [], active = 0;
  function lineRoute() { return routeOfLine(input.value, chatMode); }
  // Latch a composer mode (the CLI / Navi toggles and the hint
  // pill): the mode sticks for later lines, and a contrary prefix
  // comes off the current draft so the line reads as it will run.
  function latchMode(m) {
    chatMode = m;
    var v = input.value;
    if (m === "cli" && (v.trim() === ">" || v.indexOf("> ") === 0)) input.value = v.replace(/^>s*/, "");
    else if (m === "navi" && v.charAt(0) === "$") input.value = v.replace(/^$s*/, "");
  }
  function close() { box.style.display = "none"; items = []; input.dataset.acOpen = ""; }
  function accept(i) { var c = items[i]; if (!c) return; input.value = c.name + " "; close(); input.focus(); refresh(); }
  function paint() {
    box.innerHTML = items.map(function (c, i) { return "<div class='ac-it" + (i === active ? " on" : "") + "' role='option' data-i='" + i + "'><b>" + esc(c.name) + "</b><span>" + esc(c.description) + "</span><em>" + (c.source === "default" ? "built-in" : "installed") + "</em></div>"; }).join("");
    box.querySelectorAll(".ac-it").forEach(function (el) { el.addEventListener("mousedown", function (e) { e.preventDefault(); accept(Number(el.getAttribute("data-i"))); }); });
  }
  function findGhost() {
    if (!opts.rich || !opts.history) return "";
    var v = input.value;
    if (!v || ghostOffFor === v) return "";
    if (input.selectionStart !== v.length) return "";
    if (lineRoute().kind !== "cli") return "";
    var hist = opts.history() || [];
    for (var i = 0; i < hist.length; i++) {
      var h = hist[i];
      if (h.length > v.length && h.toLowerCase().indexOf(v.toLowerCase()) === 0) return h;
    }
    return "";
  }
  function paintLayer() {
    if (layer) {
      var v = input.value;
      var html = lineRoute().kind === "cli" ? cmdTokensHtml(v) : esc(v);
      if (ghostLine) html += "<span class='ghost'>" + esc(ghostLine.slice(v.length)) + "</span>";
      layer.innerHTML = html;
      layer.scrollLeft = input.scrollLeft;
    }
    if (opts.hintEl) {
      var btn = opts.hintEl.querySelector("button.pill");
      if (btn) {
        var r = lineRoute();
        btn.textContent = r.kind === "cli" ? "⏎ CLI — runs as a system command" : "⏎ Navi — goes to Navi";
        btn.className = r.kind === "cli" ? "pill cli" : "pill";
        btn.setAttribute("aria-label", r.kind === "cli" ? "CLI mode is latched — this line will run as a system command. Click to latch Navi mode instead." : "Navi mode is latched — this line will go to Navi. Click to latch CLI mode instead.");
      }
      opts.hintEl.querySelectorAll("button[data-mode]").forEach(function (b) {
        var m = b.getAttribute("data-mode");
        var on = chatMode === m;
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.className = on ? (m === "cli" ? "on-cli" : "on-navi") : "";
      });
    }
  }
  function refresh() {
    var v = input.value;
    var open = false;
    if (v && v.indexOf(" ") === -1) {
      var t = v.toLowerCase();
      items = getCommands().filter(function (c) { return c.name.indexOf(t) === 0 && c.name !== t; }).slice(0, 8);
      if (items.length) { active = 0; paint(); box.style.display = "block"; input.dataset.acOpen = "1"; open = true; }
    }
    if (!open) close();
    ghostLine = open ? "" : findGhost();
    paintLayer();
  }
  if (opts.hintEl) {
    var pillBtn = opts.hintEl.querySelector("button.pill");
    if (pillBtn) pillBtn.onclick = function () {
      latchMode(lineRoute().kind === "cli" ? "navi" : "cli");
      input.focus();
      refresh();
    };
    opts.hintEl.querySelectorAll("button[data-mode]").forEach(function (b) {
      b.onclick = function () {
        latchMode(b.getAttribute("data-mode") || "navi");
        input.focus();
        refresh();
      };
    });
  }
  input.addEventListener("input", refresh);
  input.addEventListener("focus", refresh);
  input.addEventListener("scroll", function () { if (layer) layer.scrollLeft = input.scrollLeft; });
  input.addEventListener("blur", function () { setTimeout(close, 150); });
  input.addEventListener("keydown", function (e) {
    if (box.style.display !== "none") {
      if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % items.length; paint(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); }
      else if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); e.stopImmediatePropagation(); accept(active); }
      else if (e.key === "Escape") { close(); }
      return;
    }
    if (ghostLine && (e.key === "Tab" || e.key === "ArrowRight")) { e.preventDefault(); input.value = ghostLine; ghostLine = ""; refresh(); return; }
    if (e.key === "Escape" && ghostLine) { ghostOffFor = input.value; ghostLine = ""; paintLayer(); }
  });
  paintLayer();
}

/* -------------------------------- render -------------------------------- */
applyTheme();
var appEl = document.getElementById("app"), navEl = document.getElementById("nav"), mainEl = document.getElementById("main"), statusEl = document.getElementById("status");
var toggleBtn = document.createElement("button");
toggleBtn.id = "nav-toggle";

toggleBtn.setAttribute("aria-label", "Collapse or expand the side menu");

navEl.appendChild(toggleBtn);
NAV.forEach(function (name) {

  b.onclick = function () { view = name; render(); if (name === "Updater" && updater.state === "idle") checkForUpdates(); };
  navEl.appendChild(b);
});
// The version at the foot of the menu, under its divider: baked
// from the package's VERSION file at build time, then kept current
// by the bridge's /api/status (which reads that same file) — one
// source of truth for the menu, the status column, and the update
// checker alike.
function verTag(st) { return st === "alpha" ? "a" : st === "beta" ? "b" : ""; }
var navVer = document.createElement("div");
navVer.id = "nav-version";
navVer.className = "mono";
navVer.setAttribute("aria-label", "Apex version " + CONFIG.version);
navVer.innerHTML = "<span class='nv-num' id='nav-version-num'><span class='nv-pre'>Ver. </span><span class='nv-val' id='nav-version-val'>" + esc(CONFIG.version) + verTag(CONFIG.versionStatus) + "</span></span>";
navVer.classList.add("st-" + (CONFIG.versionStatus || "stable"));
navEl.appendChild(navVer);
/* ------------------------- Her living details ------------------------- */
// The tagline under the wordmark is one static line — "Powered by
// Navi" — baked into the dashboard HTML; it never cycles. Her
// presence line at the top of the status column is the living one:
// its timer re-randomizes after every change and keeps the current
// text in module state, repainting whatever element is on the page
// — the frame re-renders constantly, so the cycler never rides a
// render.
var PRESENCE_LINES = ["Navi is here.", "Navi is listening to the network breathe.", "Navi is reading Sigma rules like bedtime stories.", "Navi is in a staring contest with a firewall.", "Navi is poking a honeypot to see if it pokes back.", "Navi is counting packets until she falls asleep.", "Navi is reorganizing the chip shelf. Again.", "Navi is haunting Rockport's west end.", "Navi is arguing with a CAPTCHA. And winning.", "Navi is pretending port 22 doesn't exist.", "Navi is sharpening her scans.", "Navi is running on caffeine and spite.", "Navi is watching a log file grow. Riveting.", "Navi is somewhere between the packets.", "Navi is defragmenting her opinions.", "Navi is here. Allegedly."];
// The rare one: on any given cycle it has roughly a 1-in-50 chance
// of being picked instead of the next regular line — an Easter egg
// that almost never shows. It stands as-is, not in the "Navi is…"
// shape, and it replaces that cycle's regular advance.
var PRESENCE_RARE = "Saving Ciel's ass... Again.";
var presenceIdx = 0;
var presenceText = PRESENCE_LINES[0];
function cyclePresence() {
  if (Math.random() < 1 / 50) {
    presenceText = PRESENCE_RARE;
  } else {
    presenceIdx = (presenceIdx + 1) % PRESENCE_LINES.length;
    presenceText = PRESENCE_LINES[presenceIdx];
  }
  var el = document.getElementById("presence-line");
  if (el) el.textContent = presenceText;
  setTimeout(cyclePresence, 120000 + Math.random() * 120000);
}
setTimeout(cyclePresence, 120000 + Math.random() * 120000);

function nurCardsHtml() {
  if (nurTab === "local") return nurLocalHtml();

      : "<p style='color:var(--dim)'>No community chips in the catalog yet — every navi-chips repo outside SaintsSec lands here.</p>";
  }
  return "<div class='nur-grid'>" + list.map(nurCardHtml).join("") + "</div>";
}
// The "N of M community chips match …" line under the Community
// search — empty unless a search is actually entered.
function nurMetaText() {
  if (nurTab !== "community" || !nurQuery.trim() || !chipCatalog || !chipCatalog.chips) return "";
  var q = nurQuery.trim().toLowerCase();
  var comm = chipCatalog.chips.filter(function (c) { return !nurIsSaints(c); });

  return n + " of " + comm.length + " community chips match “" + nurQuery.trim() + "”.";
}

function render() {
  // A popped docs window is docs-only: no nav, no status column,
  // no polling behind the wiki.
  if (DOCS_POP) { renderDocsPop(); return; }
  // Focus return for the chat composer: render() rebuilds the whole
  // view, which would strand the operator's cursor after every send.
  // If the composer held focus — or a send just asked for it back —
  // the rebuilt composer takes focus again at the end of render.
  var keepChatFocus = view === "Chat" && (chatFocusWanted || (document.activeElement && document.activeElement.id === "chat-in"));
  // If the operator closed the popped docs window directly, take
  // back the page it was left on and dock the wiki again.

        .then(function (j) { ragForgeMsg = j.ok ? "Packaged — the pack is in rag-packs/, active and ready. Ask her something it knows, or list packs with /rag in chat." : (j.error || "Packaging failed."); if (j.ok) { ragForgeDocs = []; ragPacksState = null; ragTab = "packs"; } render(); })
        .catch(function () { ragForgeMsg = "The bridge didn't answer."; render(); });
    };
  } else if (view === "Updater") {
    var upCheck = document.getElementById("up-check");
    if (upCheck) upCheck.onclick = function () { checkForUpdates(); };
    var upApply = document.getElementById("up-apply");
    if (upApply) upApply.onclick = function () { stageUpdate(); };
  } else if (view === "Settings") {
    mainEl.querySelectorAll("[data-settab]").forEach(function (b) { b.onclick = function () { settingsTab = b.getAttribute("data-settab"); render(); }; });
    var bind = function (id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; };
    var saveVoice = function (patch) {
      if (CONFIG.backend !== "live") { voiceMsg = "Voice settings save through the live bridge — switch the backend to Live in Settings."; render(); return; }
      fetch("/api/voice/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) })
        .then(function (r) { return r.json(); })
        .then(function () { voiceState = null; refreshVoice(true); })
        .catch(function () { voiceMsg = "The settings couldn't be saved — the bridge didn't answer."; render(); });
    };
    var enSw = document.getElementById("v-enabled");
    if (enSw) enSw.onclick = function () { saveVoice({ enabled: !(voiceState ? voiceState.enabled : true) }); };
    var sttSel = document.getElementById("v-stt");
    if (sttSel) sttSel.onchange = function () { saveVoice({ stt_model: sttSel.value }); };
    var engSel = document.getElementById("v-engine");
    if (engSel) engSel.onchange = function () { saveVoice({ tts_engine: engSel.value, tts_voice: engSel.value === "piper" ? "en_US-lessac-medium" : "bf_isabella" }); };
    var voiceSel = document.getElementById("v-voice");
    if (voiceSel) voiceSel.onchange = function () { saveVoice({ tts_voice: voiceSel.value }); };
    var rateInp = document.getElementById("v-rate");
    if (rateInp) rateInp.onchange = function () { saveVoice({ rate: Number(rateInp.value) }); };
    var pitchInp = document.getElementById("v-pitch");
    if (pitchInp) pitchInp.onchange = function () { saveVoice({ pitch: Number(pitchInp.value) }); };
    var speakRep = document.getElementById("v-speakreplies");
    if (speakRep) speakRep.onchange = function () { CONFIG.speakReplies = speakRep.checked; saveCfg(); };
    bind("gh-signin", ghSignInStart);
    bind("gh-complete", ghSignInCompleteMock);
    bind("gh-cancel", function () { ghStopPolling(); githubDevice = null; ghSetMsg("", false); render(); });
    bind("gh-signout", ghSignOut);
    bind("gh-client-save", ghSaveClientId);
    bind("gh-client-clear", function () { var inp = document.getElementById("gh-client-id"); if (inp) inp.value = ""; if (CONFIG.backend !== "live") { githubState.clientId = ""; githubState.clientIdConfigured = false; mockGithubSave(); ghSetMsg("Client ID cleared.", false); render(); } else ghPost("/api/github/client-id", { client_id: "" }, function (j) { githubState = j; ghSetMsg("Client ID cleared.", false); render(); }); });
    bind("gh-settings-save", ghSaveBackupSettings);
    bind("gh-backup", ghBackupNow);
    bind("gh-preview", ghImportPreview);
    bind("gh-apply", ghImportApply);
    var visSel = document.getElementById("gh-vis");
    var paintPubWarn = function () {
      var w = document.getElementById("gh-pubwarn");
      if (w) w.innerHTML = visSel && visSel.value === "public" ? "<div class='card' style='border-color:#f87171;color:#f87171;margin-top:8px'>A public backup repo puts her Soul and Memory documents on the open internet for anyone to read. Only choose this if you truly mean to publish them.</div>" : "";
    };
    if (visSel) { visSel.onchange = paintPubWarn; paintPubWarn(); }
    var be = document.getElementById("be");
    if (be) be.onchange = function () { CONFIG.backend = be.value; saveCfg(); voiceState = null; wfData = null; render(); };
    var th = document.getElementById("th");
    if (th) th.onchange = function () { CONFIG.theme = th.value; saveCfg(); applyTheme(); render(); };
    var opSave = document.getElementById("op-save");
    if (opSave) opSave.onclick = function () { var inp = document.getElementById("op-name"); CONFIG.operatorName = inp ? inp.value.trim() : ""; saveCfg(); refreshSeedGreeting(); render(); };
    // Hardware profile card: load the profile on first Settings open.
    if (!hardwareState) fetchHardware(true);
    // Prefill override inputs from the profile.
    var hwProf = hardwareState && hardwareState.profile ? hardwareState.profile : null;
    if (hwProf && hwProf.settings) {
      var hwSet = function (id, v) { var el = document.getElementById(id); if (el && v != null) el.value = v; };
      hwSet("hw-thr", hwProf.settings.threads); hwSet("hw-ctx", hwProf.settings.ctxSize); hwSet("hw-bat", hwProf.settings.batchSize); hwSet("hw-gpu", hwProf.settings.gpuLayers);
    }
    var hwSave = document.getElementById("hw-save");
    if (hwSave) hwSave.onclick = function () {
      if (CONFIG.backend !== "live") { hardwareMsg = "Overrides need the live bridge — switch Backend to Live."; render(); return; }
      var num = function (id) { var el = document.getElementById(id); return el ? parseInt(el.value, 10) : NaN; };
      fetch("/api/hardware/override", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ threads: num("hw-thr"), ctxSize: num("hw-ctx"), batchSize: num("hw-bat"), gpuLayers: num("hw-gpu") }) }).then(function (r) { return r.json(); }).then(function (j) { hardwareState = j; hardwareMsg = j && j.ok === false ? ("Override refused: " + (j.error || "invalid values")) : "Override saved — it applies the next time the model server starts."; render(); }).catch(function () { hardwareMsg = "The bridge did not answer — is it running?"; render(); });
    };
    var hwRedetect = document.getElementById("hw-redetect");
    if (hwRedetect) hwRedetect.onclick = function () {
      if (CONFIG.backend !== "live") { hardwareMsg = "Re-detect needs the live bridge — switch Backend to Live."; render(); return; }
      fetch("/api/hardware/redetect", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).then(function (r) { return r.json(); }).then(function (j) { hardwareState = j; hardwareMsg = j && j.profile ? "Re-detected this machine and returned to auto settings — they apply the next time the model server starts." : "Re-detect failed: " + ((j && j.error) || "unknown error"); render(); }).catch(function () { hardwareMsg = "The bridge did not answer — is it running?"; render(); });
    };
    var savePersona = function () { saveCfg(); if (CONFIG.backend === "live") fetch("/api/persona", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ soul: CONFIG.soul, memory: CONFIG.memory }) }).catch(function () {}); };
    var soulSave = document.getElementById("soul-save");
    if (soulSave) soulSave.onclick = function () { var ta = document.getElementById("soul-doc"); if (ta) CONFIG.soul = ta.value; savePersona(); };
    var memSave = document.getElementById("memdoc-save");
    if (memSave) memSave.onclick = function () { var ta = document.getElementById("mem-doc"); if (ta) CONFIG.memory = ta.value; savePersona(); };
    mainEl.querySelectorAll("[data-inst]").forEach(function (b) { b.onclick = function () { var n = b.getAttribute("data-inst"); if ((CONFIG.installed || []).indexOf(n) < 0) { CONFIG.installed = (CONFIG.installed || []).concat([n]); saveCfg(); } render(); }; });
    mainEl.querySelectorAll("[data-uninst]").forEach(function (b) { b.onclick = function () { var n = b.getAttribute("data-uninst"); CONFIG.installed = (CONFIG.installed || []).filter(function (x) { return x !== n; }); saveCfg(); render(); }; });
    var cmdAdd = document.getElementById("cmd-add");
    if (cmdAdd) cmdAdd.onclick = function () { var inp = document.getElementById("cmd-custom"); var n = inp ? inp.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "") : ""; if (n && (CONFIG.installed || []).indexOf(n) < 0) { CONFIG.installed = (CONFIG.installed || []).concat([n]); saveCfg(); } render(); };
  } else if (view === "GitHub") {
    var bind = function (id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; };
    bind("gh-tab-overview", function () { githubTab = "overview"; if (!githubPulse && !githubPulseFetching) fetchGithubPulse(false); render(); });
    bind("gh-tab-issues", function () { githubTab = "issues"; if (!githubIssues && !githubIssuesFetching) fetchGithubIssues(false); render(); });
    bind("gh-tab-roadmap", function () { githubTab = "roadmap"; openGithubPageWindow("roadmap"); render(); });
    bind("gh-tab-discussions", function () { githubTab = "discussions"; openGithubPageWindow("discussions"); render(); });
    bind("gh-webview-open", function () { openGithubPageWindow(githubTab); });
    mainEl.querySelectorAll("[data-gh-open]").forEach(function (b) { b.onclick = function () { var u = b.getAttribute("data-gh-open"); if (u && (u.indexOf("https://github.com/") === 0 || u.indexOf("https://github.com/users/") === 0)) openExternal(u); }; });
    bind("gh-pulse-refresh", function () { githubPulseError = ""; fetchGithubPulse(true); });
    bind("gh-issues-refresh", function () { githubIssuesError = ""; fetchGithubIssues(true); });
    bind("gh-repo", function () { openExternal(NAVI_REPO_URL); });
    bind("gh-issues-page", function () { openExternal(NAVI_REPO_URL + "/issues"); });
    bind("gh-legacy", function () { openExternal("https://github.com/SaintsSec/Navi"); });
    mainEl.querySelectorAll("[data-gh-issue]").forEach(function (b) { b.onclick = function () { var u = b.getAttribute("data-gh-issue"); if (u && u.indexOf("https://github.com/") === 0) openExternal(u); }; });
    if (githubTab === "overview" && !githubPulse && !githubPulseFetching) fetchGithubPulse(true);
    if (githubTab === "issues" && !githubIssues && !githubIssuesFetching) fetchGithubIssues(true);
  }
}
// In live mode, pick up persona edits made directly to the config
// files since the app last ran — and start the chip catalog search
// in the background, so the Navi User Repo list has auto-populated by
// the time the Chips screen is opened.
if (CONFIG.backend === "live") {
  loadChipCatalog();
  // One real update check per session, shortly after load, so the
  // status column's UPDATER element can light up on its own when a
  // newer release exists — the operator never has to go looking.
  checkForUpdates();
  fetch("/api/persona").then(function (r) { return r.json(); }).then(function (j) {
    if (j.soul) CONFIG.soul = j.soul;
    if (j.memory) CONFIG.memory = j.memory;
  }).catch(function () {}).then(function () { render(); });
} else {
  render();
}
</script>
</body>
</html>
