  "<p><b>One file says which version she is.</b> At the top of the install folder sits a plain text file named <span class='mono'>VERSION</span>. It holds the version number, and — only on an Edge build — the status word after it: <span class='mono'>0.1.9</span> is the current full release's own line; an Edge build reads like <span class='mono'>0.2.0 edge</span>. (The status word can be <span class='mono'>edge</span>, <span class='mono'>beta</span>, or <span class='mono'>stable</span>; no word means a full release. Builds from before the channels era wrote <span class='mono'>alpha</span> where Edge stands now — she reads those as Edge too, so nothing old is stranded.) It is the one source of truth: the bridge reads it and reports the number and the status, the update checker reads the same file to compare against the newest release on your channel, and the dashboard shows it at the bottom of the side menu (under a divider, centered) in GitHub tag form, as <b>v + number + a one-letter status tag</b> — Edge wears <span class='mono'>e</span>, beta wears <span class='mono'>b</span>, a full release wears none. So an Edge build reads <b>v0.2.0e</b> and this full release reads <b>v0.1.9</b>. With the side menu collapsed to its icon rail, the footer keeps the same v-form, centered, in the same status color. The number-and-tag is colored by status in every theme: red for Edge, yellow for beta, blue for a full release (in Nordic dark, Aurora red #BF616A, Aurora yellow #EBCB8B, and Frost blue #88C0D0). The status column's update entry carries no number and no label: it is a single line directly under Navi's status, bracketed by separators, reading a green <b>Up to date</b> once a check has run clean — and flipping to a yellow <b>Update available</b>, which opens the Updater, when a check finds a newer one. Nothing sits beneath the line. Installing an update replaces the VERSION file along with the rest of the app; no other place stores the version.</p></div>" },
  { id: "troubleshooting", title: "Troubleshooting", related: ["installing", "getting-started"], html:
    "<div class='doc-sec'><h4>Troubleshooting</h4><ul>" +
  "<li><b>Open Apex on your phone.</b> Put the phone on the <b>same network</b> as the machine Apex runs on. On the machine, open the <b>DHD</b> page and turn on <b>Apex | Node</b> [local], under the DHD options — that is the whole setup: Apex restarts her own bridge, and the row confirms <b>On your network</b> when it is live; there is no separate restart step. On the phone, open the address that same row shows (it looks like <span class='mono'>http://192.168.1.5:8675</span> — the row's button copies it) and type the <b>access code</b> from the row; the phone's browser is remembered after that. If the phone cannot reach her: check it is not on mobile data, check the row's live state line reads On your network, and check the code is the one the row shows now — regenerating the code shuts out every phone let in before. If the row names a failed restart step instead, press <b>Restart bridge</b> there, or quit Apex fully and relaunch. On the phone, the dashboard wears its small-screen layout: a slim bar stays pinned at the top — the hamburger button hugs its left edge with Apex | powered by Navi right beside it, the hamburger opening the menu (which slides in from the left), and the dock button hugging the right edge, opening the whole status column (which slides in from the right — the Chat window's own status toggle, at its top right, drives the same dock, one state behind two doors) — each a full-width overlay that closes itself when you pick where you're going. This machine itself never needs the code.</li>" +
  "<li><b>The dashboard shows some other page.</b> Something else holds port " + BRIDGE_PORT + " — the launcher names it by its page title; find it with <span class='mono'>ss -ltnp | grep " + BRIDGE_PORT + "</span>.</li>" +
  "<li><b>“BRIDGE OUT OF DATE”.</b> An older bridge process is still answering after a reinstall. The installer and the Updater now stop the old bridge and prove it stopped before new files land, so this should not survive an update; if you meet it after starting a bridge by hand, quit the app fully and relaunch — and if a process ever holds her port and will not stop, the failure that reports it names the process and the exact <span class='mono'>kill -9</span> command that ends it.</li>" +
  "<li><b>Chat 400s.</b> The bridge uses the model id the server itself reports (<span class='mono'>navi</span>); on failure the server's own error text is shown — check <span class='mono'>navi.llamafile.log</span>.</li>" +
  "<li><b>She doesn't answer.</b> Every chat request is bounded — at most 1,024 tokens of generation — and the bridge waits up to ten minutes for a CPU-bound reply to finish. If the wait runs out, the message in the thread says the model was still generating; that never means the server died. An empty reply from the model is reported the same way, in the thread, rather than swallowed as silence.</li>" +
  "<li><b>The llamafile won't start.</b> Press Connect — in app-launch mode the bridge starts the server itself and reports the specific failure.</li>" +
  "<li><b>Her voice is not installed.</b> Her voice is an extra the installer offers — it is not part of the main app. Say yes when the installer asks, or follow the step Settings → Voice names. Until then she still works; she just answers in writing instead of out loud.</li>" +
  "<li><b>A chip will not run.</b> Open it in Chip Studio and read the red squiggles first — a chip needs a <span class='mono'>command</span>, a <span class='mono'>use</span> line, and a <span class='mono'>run()</span> before Navi can run it, and the bar under the editor names what is missing. A chip that only declares an output is not broken: it shows that output instead of running code.</li>" +
  "<li><b>The catalog finds nothing.</b> The catalog is a live search of GitHub. With no network it finds nothing, and when GitHub itself is busy the search says so instead of pretending the shelf is empty — wait a minute and press Search again.</li>" +
  "<li><b>She answers without using my pack.</b> Only packs switched <b>on</b> feed her answers. Check the switch on the Packs tab. When a pack does help, the small label under her message names the pack and the document — no label means no pack was used for that answer.</li>" +
  "<li><b>The call will not start.</b> A call needs her voice installed and switched on, and her model connected. Settings → Voice names the missing piece — fix that one thing and try again.</li>" +
  "<li><b>Dark Liquid Glass looks solid, not frosted.</b> That is the design working as intended, not a bug: where your system cannot do backdrop blur, the theme falls back to the same colors, solid and fully readable. If scrolling ever feels stuttery on weak built-in graphics while the glass theme is on, pick any other theme in Settings → Appearance — the flat themes cost the graphics chip almost nothing.</li>" +
  "<li><b>Known issue: she cannot hear me in the desktop app.</b> Field report from the operator's Framework 13 (Pop!_OS), 2026-11-07, and noted in Settings → Voice at his request: in the standalone window, the microphone does not reach Navi — push-to-talk and calls get no working mic — even with the OS permission allowed. Her shell is built to grant the dashboard's mic requests, so the break is somewhere in that chain and the fix is still being worked on; it is <b>not fixed yet</b>. What works today: <b>typing</b>. The call panel takes typed lines and she answers out loud; Chat takes typed messages the whole time. If your mic works in the app, you are ahead of the field report — Settings → Voice shows what this window's own mic requests did this session, which helps narrow it down.</li></ul></div>" },
  { id: "glossary", title: "Glossary — the words we use", related: ["getting-started", "chips-guide"], html:
    "<div class='doc-sec'><h4>Glossary — the words we use, in plain words</h4>" +
  "<p>Every special word in this wiki, explained once, in the order you are most likely to meet it. If a page ever uses a word that is not clear, it should be in this list.</p>" +
  "<p><b>Dashboard</b> — the page you are looking at. The buttons, the chat, the lists: all of it is the dashboard.</p>" +
  "<p><b>Bridge</b> — a small helper program that lives in the install folder. The dashboard asks it to do things — run a command, start the model, save a setting — and it does them.</p>" +
  "<p><b>Model</b> — the part that thinks and writes her answers. Hers lives inside one big file.</p>" +
  "<p><b>navi.llamafile / llamafile</b> — that big file. It holds the model and the program that runs it, all in one file, so there is nothing else to install.</p>" +
  "<p><b>Port</b> — a numbered door on your own computer that programs talk through. The bridge listens at door " + BRIDGE_PORT + "; the model at door 8080. Nothing from the internet comes through them.</p>" +
  "<p><b>Chip</b> — a small program that gives Navi a new skill. You write it, or install one somebody else wrote.</p>" +
  "<p><b>Chip</b> — a chip packed into one picture file. The code hides inside the image. Share the picture and you have shared the chip.</p>" +
  "<p><b>root.py</b> — a chip's main file, the one Navi runs. Every chip has exactly one. Other files are helpers it can bring in with <span class='mono'>import</span>.</p>" +
  "<p><b>Workflow</b> — chips lined up in a row, where each one's answer is handed to the next one, like a bucket brigade.</p>" +
  "<p><b>Pack</b> — a bundle of documents Navi can look things up in before she answers. One pack is one topic.</p>" +
  "<p><b>Index</b> — the map a pack builds from its documents, so Navi can find the right page fast instead of reading everything every time.</p>" +
  "<p><b>Active</b> — switched on. Only active packs feed her answers.</p>" +
  "<p><b>Repository (repo)</b> — one project's folder on GitHub, the website that holds code.</p>" +

function meshImportPngFile(file) {
  // THE PNG card importer (Build 7, spec section 13): the file-
  // upload control and the drag-and-drop zone both land here,
  // so both paths run the same bytes through the same bridge
  // parser — there is no second, weaker path. The verdict,
  // success or one of the bridge's specific refusals, renders
  // at the drop zone in meshPngMsg: never a silent no-op.
  if (!file) return;
  if (CONFIG.backend !== "live") { meshPngMsg = "Pairing needs the live bridge — the bench does not simulate Mesh traffic."; render(); return; }
  meshPngMsg = "Reading " + file.name + "…"; render();

  reader.onload = function () {
    var url = String(reader.result || "");

    if (!b64) { meshPngMsg = "That file could not be read — try the upload again."; render(); return; }
    fetch("/api/mesh/peers/png", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ png: b64 }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { meshState = j.mesh; meshPngMsg = "Peer added from the picture. Pairing is complete when this machine's card is added on the other side too."; }
        else meshPngMsg = (j && j.error) || "That picture was refused.";
        render();
      })
      .catch(function () { meshPngMsg = "The bridge did not answer — is it running?"; render(); });
  };
  reader.onerror = function () { meshPngMsg = "That file could not be read — try the upload again."; render(); };
  reader.readAsDataURL(file);
}

// "# files | # days ago" — read from the same backup record

// and the last backup's time), so the two can never disagree.
// The full detail stays on the Settings page.
function ghBackupSummary(gh) {

  var then = new Date(gh.lastBackupAt).getTime();
  if (isNaN(then)) return "No backup yet";

  // AND a file count) earns the "# files | # days ago" readout —
  // a partial record reads "No backup yet", never a mixed
  // placeholder like "— files | 0 days ago".

function paintRagReadme(full) {

function loadRagReadme(full) {

// Link routing (build .48, issue #10): plain anchors did nothing
// inside the standalone shell — WebKitGTK drops target=_blank and
// plain navigation out of the webview without a word, so every link

// GitHub device sign-in link, links inside her markdown replies)
// died on the click while the same page in a browser opened them
// all. One delegated handler, installed once here at startup,
// routes each anchor click by where its href points. Left alone,
// with their default behavior standing: non-left-button clicks,
// clicks with ctrl/meta/shift/alt held, empty or javascript:
// hrefs, pure in-page #fragment hrefs, and same-origin addresses
// that are not the docs pop-out form. Download anchors keep their
// native behavior in a browser — but inside the shell the webview
// cannot save a file at all, so there a download click (a download
// attribute, a blob: address, or one of the bridge's file/export
// addresses) runs the save flow below instead: the dashboard
// fetches the bytes itself and the bridge writes them into the
// operator's Downloads folder, saying where they landed.

    if (u.origin !== location.origin) return false;
    return u.pathname === "/api/chips/file" || u.pathname === "/api/chips/export-file" || u.pathname === "/api/rag/export-file";

  try {
    var u = new URL(href, location.href);
    var n = u.searchParams.get("name");
    if (n) return n;
    var seg = u.pathname.split("/").filter(function (s) { return !!s; });
    if (seg.length) return decodeURIComponent(seg[seg.length - 1]);
  } catch (e) {}
  return "navi-download";
}
function naviB64(buf) {
  var bytes = new Uint8Array(buf);
  var out = "";
  var CHUNK = 32768;
  for (var i = 0; i < bytes.length; i += CHUNK) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CHUNK, bytes.length)));
  }
  return btoa(out);
}
function naviDownloadNote(text) {
  if (view === "RAG") ragMsg = text; else chipMsg = text;
  render();
}
function saveShellDownload(href, attrName) {
  var name = naviDownloadName(href, attrName);
  naviDownloadNote("Saving " + name + " to the Downloads folder…");
  // Issue #10's standing rule covers downloads too: a failed
  // save in the desktop app ends at the warning toast — the
  // target address plus the Web UI stand-in — alongside the
  // in-view note that names the reason.
  var absHref = href;
  try { absHref = new URL(href, location.href).href; } catch (e) {}
  var fail = function (reason) {
    naviDownloadNote("That download could not be saved: " + reason);
    naviToast("That download could not be opened — the desktop app could not save it (" + reason + "). The address is: " + absHref + " Stand-in until this is fixed: open the Apex Web UI (http://localhost:8675) in your browser — links work there.");
  };
  fetch(href).then(function (r) {
    if (!r.ok) throw new Error("the bridge answered " + r.status);
    return r.arrayBuffer();
  }).then(function (buf) {
    return fetch("/api/downloads/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ filename: name, dataBase64: naviB64(buf) }) });
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.ok) naviDownloadNote("Saved " + name + " — " + (j.path || "in the Downloads folder") + ".");
    else fail((j && j.error) || "the bridge did not answer.");
  }).catch(function (err) {
    fail(err && err.message ? err.message : "the fetch failed.");
  });
}
document.addEventListener("click", function (e) {
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  var el = e.target;
  while (el && el.nodeType === 1 && String(el.tagName).toUpperCase() !== "A") el = el.parentNode;
  if (!el || el.nodeType !== 1 || String(el.tagName).toUpperCase() !== "A") return;
  var href = el.getAttribute("href") || "";
  if (docsInShell() && href && (el.hasAttribute("download") || href.toLowerCase().indexOf("blob:") === 0 || naviFileEndpoint(href))) {
    e.preventDefault();
    saveShellDownload(href, el.getAttribute("download") || "");
    return;
  }
  if (el.hasAttribute("download")) return;
  if (!href || href.toLowerCase().indexOf("javascript:") === 0) return;
  var url;
  try { url = new URL(href, location.href); } catch (err) { return; }
  if (url.protocol !== "http:" && url.protocol !== "https:") return;
  var popdocs = url.hash.indexOf("popdocs") !== -1 || url.search.indexOf("popdocs") !== -1;
  if (url.origin === location.origin) {
    if (!popdocs) return;
    // The docs pop-out form: inside the shell, run the same
    // open_docs_window flow the Docs view's own pop-out button
    // uses; in a browser, open the address in its own window.
    e.preventDefault();
    if (docsInShell()) {
      if (docsShellOut) { docsTauriInvoke("open_docs_window").catch(function () {}); return; }
      docsShellOut = true;
      docsTauriInvoke("open_docs_window").then(function () { docsShellOut = true; }).catch(function () { docsShellOut = false; docsPopBlocked = true; render(); naviToast("The documentation window could not be opened — the shell did not answer. Use the direct link in the Docs view instead. The address is: " + url.href + " Stand-in until this is fixed: open the Apex Web UI (http://localhost:8675) in your browser — links work there."); });
    } else {
      window.open(url.href, "_blank");
    }
    return;
  }
  // Another site entirely: the app itself never navigates away.
  // Inside the shell the link opens in the real browser through
  // openExternal; in a browser an anchor already aimed at a new
  // tab keeps its default, and any other anchor gets a new tab
  // rather than replacing the dashboard.
  if (docsInShell()) { e.preventDefault(); openExternal(url.href); return; }
  if (el.getAttribute("target") === "_blank") return;
  e.preventDefault();
  window.open(url.href, "_blank", "noopener");
});
// In live mode, pick up persona edits made directly to the config
// files since the app last ran — and start the chip catalog search
// in the background, so the Navi User Repo list has auto-populated by
// the time the Chips screen is opened.
if (CONFIG.backend === "live") {
  loadChipCatalog();
  hydrateChatsFromServer();
  // One real update check per session, shortly after load, so the
  // status column's UPDATER element can light up on its own when a
  // newer release exists — the operator never has to go looking.
  checkForUpdates();
  // And pick up the last apply's record: if this page load is the
  // relaunched app after a one-click update, the panel's first
  // paint already carries its "Updated vX → vY" confirmation (or
  // the failure and its fallback).
  fetchUpdateResult(false);
  fetch("/api/persona").then(function (r) { return r.json(); }).then(function (j) {
    if (j.soul) CONFIG.soul = j.soul;
    if (j.memory) CONFIG.memory = j.memory;
  }).catch(function () {}).then(function () { render(); });
} else {
  render();
}
