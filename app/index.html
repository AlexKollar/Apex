<style>
  :root { color-scheme:dark; --bg:#0a0e12; --panel:#10161d; --panel2:#0d1218; --line:#22303d; --text:#e6f1f5; --dim:#9fb3c8; --cy:#22d3ee; --am:#f5b544; --red:#f87171; --green:#34d399; --ver-alpha:#f87171; --ver-beta:#f5b544; --ver-stable:#22d3ee; --syn-cmd:#4ade80; --syn-bad:#ff8a8a; --syn-flag:#22d3ee; --syn-str:#fbbf24; --syn-path:#93c5fd; --syn-kw:#f9a8d4; --syn-num:#c4b5fd; --syn-op:#e879f9; --exec-bg:#000000; }

  body[data-theme="phosphor"] { color-scheme:dark; --bg:#050300; --panel:#0d0801; --panel2:#120b02; --line:#7c4a03; --text:#ffd166; --dim:#e8a33d; --cy:#ffb000; --am:#ffd166; --red:#ff6b6b; --green:#ffb000; --ver-alpha:#ff6b6b; --ver-beta:#ffd166; --ver-stable:#ffb000; --syn-cmd:#ffb000; --syn-bad:#ff6b6b; --syn-flag:#ffd166; --syn-str:#fef08a; --syn-path:#ffcf87; --syn-kw:#fb923c; --syn-num:#ffe066; --syn-op:#ff9f1c; --exec-bg:#000000; }
  /* Dark Liquid Glass treatment (build .55, #30): resource-light — backdrop blur only on the large surfaces, translucent fill + specular edge on repeated surfaces, multi-glow backdrop, opaque fallbacks. */
  body[data-theme="glass"] { background:#05080d radial-gradient(600px 300px at 15% 0%, rgba(34,211,238,.14), transparent 60%), radial-gradient(700px 400px at 90% 100%, rgba(88,80,236,.12), transparent 60%), radial-gradient(400px 300px at 70% 10%, rgba(52,211,153,.08), transparent 60%); background-attachment:fixed; }
  body[data-theme="glass"] nav, body[data-theme="glass"] aside { background:rgba(10,17,27,.55); backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4); }
  body[data-theme="glass"] .card, body[data-theme="glass"] .msg, body[data-theme="glass"] .foldcard { background:rgba(255,255,255,.05); box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 4px 18px rgba(0,0,0,.35); border-color:rgba(148,196,220,.35); }
  body[data-theme="glass"] .ac, body[data-theme="glass"] .acsearch { background:rgba(10,17,27,.82); backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4); }
  @supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))) { body[data-theme="glass"] nav, body[data-theme="glass"] aside, body[data-theme="glass"] .ac, body[data-theme="glass"] .acsearch { background:#0a111b; backdrop-filter:none; -webkit-backdrop-filter:none; } body[data-theme="glass"] .card, body[data-theme="glass"] .msg { background:#101a26; } }
  @media (prefers-reduced-transparency: reduce) { body[data-theme="glass"] nav, body[data-theme="glass"] aside, body[data-theme="glass"] .ac, body[data-theme="glass"] .acsearch { background:#0a111b; backdrop-filter:none; -webkit-backdrop-filter:none; } body[data-theme="glass"] .card, body[data-theme="glass"] .msg, body[data-theme="glass"] .foldcard { background:#101a26; } }
  /* Nordic icon color-coding: each menu icon carries its own color
     from the Aurora/Frost family — the same color in the expanded
     menu and the collapsed rail, since the icon span never changes.
     Every color clears 3:1 on the Polar Night surfaces. The active
     item trades the Frost fill for the deepest Polar Night step
     with a Frost edge, so its icon's own color stays readable. */
  body[data-theme="nord"] #nav-Chat .ic { color:#88c0d0; }
  body[data-theme="nord"] #nav-child-navi-Chips .ic { color:#ebcb8b; }
  body[data-theme="nord"] #nav-child-navi-RAG .ic { color:#81a1c1; }
  body[data-theme="nord"] #nav-Vault .ic { color:#bf616a; }
  body[data-theme="nord"] #nav-child-utilities-Updater .ic { color:#a3be8c; }
  body[data-theme="nord"] #nav-child-utilities-GitHub .ic { color:#d08770; }
  body[data-theme="nord"] #nav-child-utilities-Settings .ic { color:#d8dee9; }
  body[data-theme="nord"] #nav-child-utilities-Docs .ic { color:#d98a94; }
  body[data-theme="nord"] nav button.on, body[data-theme="nord"] nav button.on:hover { background:#2e3440; color:#eceff4; box-shadow:inset 2px 0 0 #88c0d0; }
  body[data-theme="nord"] nav button:hover { background:rgba(136,192,208,.14); }
  body[data-theme="nord"] .card:hover { border-color:#5e81ac; }
  /* Nordic markdown: her rendered answers follow the palette —
     Snow Storm words (the body text already inherits them), Frost
     headings and links, inline code on a Frost wash, code blocks
     and terminal output on the deeper Polar Night step with Nord
     syntax colors, quotes ruled in muted Frost. The wiki's section
     heads and the editor's surfaces and tokens follow too. */
  body[data-theme="nord"] .md-h { color:#88c0d0; }
  body[data-theme="nord"] .md .ic { background:rgba(136,192,208,.16); color:#88c0d0; }
  body[data-theme="nord"] .md-code { background:#242933; color:#d8dee9; border-color:#4c566a; }

  body[data-theme="nord"] .ac-it.on { background:rgba(136,192,208,.16); }
  body[data-theme="nord"] .tok-com { color:#616e88; }
  body[data-theme="nord"] .tok-str { color:#a3be8c; }
  body[data-theme="nord"] .tok-kw { color:#81a1c1; }
  body[data-theme="nord"] .tok-num { color:#b48ead; }
  body[data-theme="nord"] .tok-dec { color:#d08770; }
  body[data-theme="nord"] .tok-navi { color:#88c0d0; }

  body[data-theme="nord"] .ed-extras i { background:#b48ead; }

  body[data-theme="terminal"] #nav-child-navi-RAG .ic { color:#2dd4bf; }
  body[data-theme="terminal"] #nav-Vault .ic { color:#fde047; }
  body[data-theme="terminal"] #nav-child-utilities-Updater .ic { color:#bef264; }
  body[data-theme="terminal"] #nav-child-utilities-GitHub .ic { color:#facc15; }
  body[data-theme="terminal"] #nav-child-utilities-Settings .ic { color:#dcfce7; }
  body[data-theme="terminal"] #nav-child-utilities-Docs .ic { color:#6ee7b7; }
  body[data-theme="terminal"] nav button.on, body[data-theme="terminal"] nav button.on:hover { background:#052e16; color:#dcfce7; box-shadow:inset 2px 0 0 #4ade80; }
  body[data-theme="terminal"] .md-h { color:#a3e635; }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif; overflow:hidden; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  /* Motion tokens (0.1.9e Build 6, issue #109): ONE motion
     system for the whole app — every transition and animation
     below takes its duration from these variables and its
     easing from the two curves, so the app moves in one
     language: fast for hovers and presses, med for unfolds,
     slides, and pane swaps, slow for the one big flip, view
     for view entrances. Under prefers-reduced-motion the
     tokens themselves collapse to zero — the operating
     system's word always wins over the Potato toggle in
     Settings -> Appearance, which applies the same collapse
     through body[data-motion="potato"] at the foot of this
     stylesheet. */
  :root { --motion-fast:.14s; --motion-med:.3s; --motion-slow:.55s; --motion-view:.22s; --motion-glide:.28s; --motion-press:.08s; --motion-ease:cubic-bezier(.22,.8,.3,1); --uiscale:1; }
  @media (prefers-reduced-motion: reduce) { :root { --motion-fast:0s; --motion-med:0s; --motion-slow:0s; --motion-view:0s; --motion-glide:0s; --motion-press:0s; } }
  /* Fixed-frame dashboard: the app fills the viewport and the page
     itself never scrolls. The left menu and the right status column
     stay fixed in place; only the center column scrolls — and in the
     Chat view only the message thread scrolls, with the composer
     pinned beneath it. */
  /* Build 6 (#111): the expanded menu is 196px — at 170px the
     group headers' labels + auto-margin chevron overflowed the
     rail and the chevron clipped at its edge. The frame height
     divides by --uiscale: the UI scale (body zoom) magnifies
     used lengths, so the frame asks for 100dvh / scale and
     lands exactly on the viewport at every scale. */
  #app { display:grid; grid-template-columns:196px minmax(0,1fr) 230px; grid-template-rows:minmax(0,1fr); height:calc(100vh / var(--uiscale, 1)); height:calc(100dvh / var(--uiscale, 1)); overflow:hidden; }
  #app.closed { grid-template-columns:54px minmax(0,1fr) 230px; }
  /* The status column starts hidden (Build 6, #114, as
     corrected): on desktop widths the column's 230px goes to
     the content until the operator opens it with the pane
     button in her presence bar. Scoped to desktop — on phones
     the column is the dock overlay, whose semantics are
     unchanged and never gated by this class. The class is in
     the static markup, so the first paint is already the
     two-column frame; the grid transition animates only the
     operator's toggles. */
  @media (min-width:801px) {
    #app.no-status { grid-template-columns:196px minmax(0,1fr) 0px; }
    #app.no-status.closed { grid-template-columns:54px minmax(0,1fr) 0px; }
    #app.no-status aside { display:none; }
  }
  nav { border-right:1px solid var(--line); background:var(--panel2); padding:14px 10px; height:100%; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
  /* Her version at the foot of the menu, under a divider bar: the
     number is read from the VERSION file at the install root (the
     bridge reports it on /api/status and CONFIG.version follows
     it), so the menu always shows the file's truth. It reads in
     GitHub tag form - v + number + status tag ("v0.1.9") -
     centered in the footer's row, and the collapsed rail keeps
     the same whole string, centered: at 11px mono it fits the
     54px rail without clipping. */
  /* Build .87 (Alex's ruling): Docs and Settings leave the main
     stack and sit at the foot of the menu, stacked directly over
     the version line. Superseded in 0.1.9e Build 4: the foot is
     the Apex | Utilities group now — its container (.nav-util)
     carries the auto margin, its children (Settings, Docs,
     GitHub) open UPWARD over the header, and the version follows
     the group with no gap. */
  .nav-util { margin-top:auto; display:flex; flex-direction:column; }
  #nav-version { border-top:1px solid var(--line); padding:9px 8px 0; color:var(--dim); font-size:11px; white-space:nowrap; text-align:center; }
  #nav-version .nv-num { color:var(--text); font-weight:700; }
  #nav-version .nv-val { font-weight:700; }
  #nav-version.st-alpha .nv-val, #nav-version.st-edge .nv-val { color:var(--ver-alpha); }
  #nav-version.st-beta .nv-val { color:var(--ver-beta); }
  #nav-version.st-stable .nv-val { color:var(--ver-stable); }
  #app.closed #nav-version { text-align:center; padding-left:0; padding-right:0; }
  nav .logo { color:var(--cy); font-weight:700; letter-spacing:.18em; padding:4px 8px 2px; white-space:nowrap; }
  /* Her tagline under the wordmark: one static line — "Powered by
     Navi" — standing still where the rotating loglines used to
     cycle. Hidden when the menu collapses to its rail. */
  nav .tagline { color:var(--dim); font-size:11px; letter-spacing:.04em; line-height:1.45; padding:0 8px 12px; }
  #app.closed nav .tagline { display:none; }
  @keyframes navi-glitch { 0% { opacity:1; transform:translate(0); text-shadow:none; clip-path:inset(0 0 0 0); } 15% { opacity:.7; transform:translate(-2px,1px) skewX(-4deg); text-shadow:2px 0 rgba(248,113,113,.8), -2px 0 rgba(34,211,238,.8); clip-path:inset(12% 0 55% 0); } 30% { opacity:.9; transform:translate(2px,-1px); text-shadow:-3px 0 rgba(248,113,113,.8), 3px 0 rgba(34,211,238,.8); clip-path:inset(60% 0 8% 0); } 45% { opacity:.4; transform:translate(-1px,0) skewX(3deg); clip-path:inset(30% 0 30% 0); } 60% { opacity:.8; transform:translate(3px,1px); text-shadow:2px 0 rgba(34,211,238,.8), -2px 0 rgba(248,113,113,.8); clip-path:inset(5% 0 78% 0); } 80% { opacity:.6; transform:translate(-2px,0); clip-path:inset(45% 0 40% 0); } 100% { opacity:1; transform:translate(0); text-shadow:none; clip-path:inset(0 0 0 0); } }
  .glitching { animation:navi-glitch .45s steps(2,end) both; }
  /* Minimized, the banner stays exactly as it is — the full
     "APEX", never clipped: it simply wraps inside the rail at
     a smaller size instead of losing part of the word. */
  #app.closed nav .logo { white-space:normal; overflow:visible; letter-spacing:.05em; font-size:10px; line-height:1.4; text-align:center; padding:4px 0 12px; }
  nav button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; color:var(--dim); padding:8px; border-radius:4px; cursor:pointer; font:inherit; white-space:nowrap; overflow:hidden; }
  nav button.on { background:var(--cy); color:#000; font-weight:700; }
  nav button .ic { display:inline-flex; flex:0 0 auto; }
  nav button .ic svg { display:block; }
  #app.closed nav button { justify-content:center; }
  #app.closed nav button .lbl { display:none; }
  /* Minimized to the rail, hovering (or tabbing to) an icon names
     the view in a tooltip beside it; the expanded menu shows its
     labels and the tooltip span stays hidden. The closed nav and
     its buttons let the tooltip paint outside the rail. */
  .nav-tip { position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); background:var(--panel); color:var(--text); border:1px solid var(--line); padding:3px 8px; font-size:11px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity var(--motion-fast) ease; z-index:60; display:none; }
  #app.closed nav { overflow:visible; }
  #app.closed nav button { overflow:visible; position:relative; }
  #app.closed .nav-tip { display:block; }
  #app.closed nav button:hover .nav-tip, #app.closed nav button:focus-visible .nav-tip { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .nav-tip { transition:none; } }
  /* Grouped menu + motion (0.1.9e Build 4; Alex: "beautifully
     animated and fluid — lean into the web tech"). The language:
     groups open and close on the grid-template-rows technique
     (the same one the Docs topics use) — a ~300ms unfold on a
     soft cubic-bezier settle, chosen for feel (Alex: beauty has
     the floor on these small surfaces) — the
     chevron turns with the state, and children arrive with a
     slight stagger — each child's transition-delay is set from
     its index when the menu is built, and only transform/opacity
     animate, so the surfaces stay on the GPU path and hold 60fps
     on modest hardware. No backdrop filters on animated elements,
     no idle animation loops: transitions fire on state changes
     only. The Utilities group at the foot opens upward — its
     children stack ABOVE the header in the DOM, so the same
     height motion reads as a drop-up. View switches keep the
     standing .22s view-in fade (below). Under
     prefers-reduced-motion every one of these collapses to an
     instant state change (the global rule at the foot of this
     block and the standing reduced-motion rules). */

function ghBadgeSync() {

function caseEvidenceFiles(files) {

      var url = String(reader.result || "");
      var b64 = url.indexOf(",") !== -1 ? url.slice(url.indexOf(",") + 1) : "";
      casePost("/api/cases/evidence", { case: slug, name: f.name, dataBase64: b64 }, function (j) {
        done++;
        if (done === list.length) { caseMsg = "Evidence filed: " + list.map(function (x) { return x.name; }).join(", ") + "."; refreshCaseDetail(slug); render(); }
      });
    };
    reader.onerror = function () { done++; if (done === list.length) render(); };
    reader.readAsDataURL(f);
  });

function getCommands() {
  var out = DEFAULT_COMMANDS.map(function (c) { return { name: c.name, description: c.description, source: "default" }; });
  if (CONFIG.backend === "live" && liveCommands) {
    liveCommands.forEach(function (n) {
      if (!DEFAULT_COMMANDS.some(function (c) { return c.name === n; })) out.push({ name: n, description: "Installed on this system", source: "installed" });
    });
  } else {
    (CONFIG.installed || []).forEach(function (n) {
      var cat = CATALOG.filter(function (c) { return c.name === n; })[0];

    });

var DOC_PAGES = [
  { id: "getting-started", title: "Getting started", related: ["chat-cli", "installing"], html:
    "<p style='color:var(--dim)'>How Apex fits together, and how she starts.</p>" +
    "<div class='doc-sec'><h4>The shape of her — dashboard, bridge, model</h4>" +
  "<p>Apex is three pieces on your own machine:</p><ul>" +
  "<li>The <b>dashboard</b> is this page, served by the bridge at <span class='mono'>http://localhost:" + BRIDGE_PORT + "</span>.</li>" +
  "<li>The <b>bridge</b> (bridge.py, in the install folder) does the real work: it serves the dashboard, runs shell commands, manages chips and workflows, holds the sudo root shell, and carries your words to the model.</li>" +
  "<li>The <b>model server</b> is navi.llamafile, running <span class='mono'>./navi.llamafile --server --v2</span> plus the flags from her <b>hardware profile</b> on port 8080 — at install, the installer profiled this machine (CPU, RAM, GPU) and chose the context size, threads, batch size, and GPU layers to fit it, so her settings come from your hardware, not the developer's; Settings shows what was detected and what was chosen, and the full log is <span class='mono'>hardware-profile.log</span>; the model answers to the id <span class='mono'>navi</span>, which the bridge reads from the server itself (<span class='mono'>/v1/models</span>) rather than guessing.</li></ul>" +
  "<p>Nothing leaves the machine on its own — the only network calls the bridge makes are to GitHub: when you open the chip or pack catalogs, check something for updates, or, once you have signed in and set it up, run a backup. The <b>GitHub — issues &amp; backups</b> page in this wiki covers that whole side of her.</p>" +
  "<p>Two small details ride the frame: under the <b>APEX</b> wordmark sits her <b>tagline</b> — “Powered by Navi”, one static line; and at the top of the status column, her <b>presence line</b> starts at “Navi is here.” and cycles every few minutes through what she's up to — listening to the network breathe, arguing with a CAPTCHA, haunting Rockport's west end.</p></div>" +
    "<div class='doc-sec'><h4>Starting her up</h4>" +
  "<p>On Linux she lives in <span class='mono'>/opt/navi-apex</span>. Launch her from the application menu or <span class='mono'>./start.sh</span>. Every launch is check-first: the launcher probes the model server, and if navi.llamafile is already running — from boot, an earlier launch, or started by hand — it leaves it alone and just runs the app; only when nothing answers does it start the server itself, with <span class='mono'>./navi.llamafile --server --v2</span> and the hardware-profile flags from <span class='mono'>config/navi.config.json</span>. The launcher starts the bridge, verifies the thing answering on port " + BRIDGE_PORT + " is really this build — naming whatever else it finds by its page title — and only then opens the dashboard. During install you chose when the model server starts: <b>on app launch</b> (the bridge starts navi.llamafile when you press Connect) or <b>at system boot</b>. Server output lands in <span class='mono'>navi.llamafile.log</span> beside the app.</p></div>" },
  { id: "chat-cli", title: "Chat & CLI mode", related: ["chips-guide", "voice"], html:
    "<div class='doc-sec'><h4>Chat and CLI access</h4>" +
  "<p>Chat is <b>CLI-first</b>. Type a system command — anything whose first word is a command this machine has — and it runs immediately, no model call, no waiting on Navi to orchestrate it: the raw terminal output lands in the thread as a terminal block and becomes <b>context she reasons over</b>, so you can list a folder and then ask her about a file the listing showed. Everything else goes to Navi as conversation, including plain-language requests like “show me the contents of /home/name/”, where she runs the command and answers with the actual output attached. Under the composer sit two mode toggles — <b>CLI</b> and <b>Navi</b>: press one once and it latches, so every line you send goes that way until you press the other; the pill beside them shows which way the current line will go, and clicking the pill flips the latch. A leading <span class='mono'>$</span> flips to a command, a leading <span class='mono'>&gt;</span> flips back to Navi — and either one re-latches the mode to match. Chips are untouched by the routing: they are her own purpose-built tools, run the same ways as ever.</p>" +
  "<p><b>Sending, and attaching files.</b> There is no Send button — <b>Enter</b> sends, in every mode; beside the <b>CLI | Navi</b> toggle under the bar, plain words say so: <i>Press enter to send.</i> The whole composer — her chips on their slim shelf, the bar, the toggle row — sits in one dock at the foot of the chat, and the bar dresses for the latched mode: latched to CLI it takes the terminal green and command wording (<span class='mono'>Run a command — try: ls</span>); latched to Navi it keeps her cyan. On a phone the dock's Call button is the phone glyph alone, so the bar keeps its room. The paperclip button beside the bar attaches a picture or a text file to this chat. The attachment stays in the thread where you uploaded it: a text file's contents ride with your next message as context she can reason over, and a picture is stored and referenced by name — her local model is text-only, so she does not see pictures, and nothing in the app claims she does. Every upload is also listed under the status column's <b>Chats</b> tab, in its Uploaded files, where you can find it later and delete it.</p>" +
  "<p>The composer works like a good shell: the line is <b>colored as you type</b> — the command word by whether the system knows it, flags, quoted strings, and paths each in their own color, the zsh-syntax-highlighting read — a dim <b>ghost</b> of the most recent matching command from this chat completes the line (Tab or → accepts it, in the zsh-autosuggestions way), and the command word autocompletes from what the system has installed, the same set that decides the CLI route. The terminal blocks in the thread keep the same coloring, so the history reads like a real shell session. Her replies render as markdown: code arrives as code blocks, not literal backticks. When navi.llamafile is disconnected, chat drops to a <b>plain command line</b> until you reconnect from the status column; chips still run in that mode. Above every view sits her <b>presence bar</b> — her picture (her own portrait, the lamp-post key art that ships with the app), her name, her dot, and what she is doing: here (the same living line the status column carries), typing, in a call with you, or away when her model is stopped. The bar is part of the frame, not of any one page: it stays over Chat, Settings, Docs — everywhere — and at its top right sits the status column's <b>pane button</b>, wearing the panel glyph. Every message in the thread wears its author's face in the gutter, their name, and the time it was sent — hers, yours (the name from your profile), and the call transcript in Settings → Voice reads the same way, spoken marker kept. The status column's doors are the frame's own now: the <b>pane button</b> at the presence bar's top right — on every page, at every width — and the panel button in the phone's top bar. Those are the only two doors; every one drives the one column state and raises the rail in place wherever you are; the phone's top bar itself is pinned, so the doors are there at any scroll depth. Conversations are saved as known chats — switch from the status column's <b>Chats</b> tab (the status pane's second tab, beside Status), without leaving this page.</p>" +
  "<p><b>Her window.</b> Apex opens in her own standalone window — the Tauri shell — and closing the window quits the app. There is no tray icon and no login autostart: she runs when you launch her from the application menu, and not before. Her window binary is verified, never assumed: installers stamp it with a hash of the shell sources, a failed rebuild retires the previous binary (navi-apex-shell.stale) instead of leaving it to be run, and the launchers refuse to run a binary the stamp doesn't cover — an older shell is a different app wearing this build's name.</p></div>" +
    "<div class='doc-sec'><h4>Sudo mode</h4>" +
  "<p>The status column's sudo switch makes Navi execute commands as root. Turning it on asks for your sudo password once; the bridge validates it by opening <b>one persistent root shell</b> that every sudo command runs inside, so a fingerprint-first PAM stack is consulted exactly once, at authentication. The password lives only in this page's memory — never saved, never logged — and turning sudo off closes the root shell on the spot.</p></div>" +
    "<div class='doc-sec'><h4>Output cards — the thread folds itself</h4>" +
  "<p>When the conversation moves on, the bulky parts of earlier exchanges fold into small cards so the thread stays readable: a terminal block folds into a card whose line shows the command in its colors, how it ended (like <span class='mono'>exit 0</span>), and the first line of its output; a long reply from Navi — 500 characters or more, eight lines or more, or one containing a code block — folds into a card labeled <b>Navi reply</b> with its first line and its size. Click a card to open it and read the whole thing; click again to fold it. The card you are still in — everything from your last message onward — never folds. Folding is only about looks: nothing is deleted, the whole history stays in the thread and on disk, and Navi still sees the full output as her context, exactly as before. Clearing the chat clears the cards with it.</p></div>" +
    "<div class='doc-sec'><h4>Your command shows once</h4>" +
  "<p>A command you run shows exactly once in the thread: in your own line, in its colors. The terminal block under it carries the output only — no repeated command line inside the block. A small line under the block says how the command ended (like <span class='mono'>exit 0</span>) when that is known.</p></div>" +
    "<div class='doc-sec'><h4>Colors for commands</h4>" +
  "<p>Command lines are colored the same way everywhere — while you type in the chat bar, in your sent line in the thread, and on a folded card: the command word is one color when the system knows it and another when it does not, and flags, quoted words, file paths, numbers, operators like <span class='mono'>|</span>, and <span class='mono'>$VARIABLES</span> each get their own. After a pipe, the next word is colored as a command again, because it is one. Every theme tunes these colors for its own surfaces, so they stay readable in all eleven themes. Ordinary sentences to Navi stay plain — only lines that read as commands get the colors.</p></div>" +
    "<div class='doc-sec'><h4>The shell remembers — recall, search, completion, and shortcuts</h4>" +
  "<p>Your command history is kept in one place, like a shell's history file: it survives switching chats, clearing a chat, and closing the page, and it holds up to 200 commands. With the suggestion list closed, press the <b>Up arrow</b> to walk back through commands you have run and the <b>Down arrow</b> to walk forward again — going past the newest brings back what you had typed. Press <b>Ctrl+R</b> to search the history: type some letters and the newest matching command shows; press Ctrl+R or the arrow keys to step through matches, <b>Enter</b> or <b>Tab</b> to put the match in the bar (it does not run yet), and <b>Escape</b> to cancel and get your typed line back. As you type a command, the list now completes more than the first word: file and folder paths complete from the real filesystem (a folder completes with a slash and opens its contents), known flags and subcommands for common commands like <span class='mono'>git</span> and <span class='mono'>ls</span> are offered, and arguments you have used with that command before are offered too, marked as used before. The editing shortcuts from the shell work as well: <b>Ctrl+A</b> and <b>Ctrl+E</b> jump to the start and end of the line, <b>Ctrl+U</b> cuts everything before the cursor, <b>Ctrl+K</b> cuts everything after it, <b>Ctrl+W</b> cuts the word before the cursor, and <b>Ctrl+Y</b> pastes back what a cut took. History shortcuts like <span class='mono'>!!</span> (the last command), <span class='mono'>!$</span> (its last argument), and <span class='mono'>!3</span> (the third command in the history) never run silently: the first Enter rewrites the bar with the expanded command and asks you to check it — press Enter again to run exactly what you see.</p></div>" +
    "<div class='doc-sec'><h4>Raw terminal work — Chat's CLI mode</h4>" +
  "<p>There is no separate terminal view: <b>Chat's CLI mode is the terminal</b>. Press the composer's <b>CLI</b> toggle once and it latches — every line you send runs as a command and the raw output lands in the thread as a terminal block, with nothing of Navi in the loop until you press <b>Navi</b> (or start a line with <span class='mono'>&gt;</span>) to latch back. The same installed commands decide what counts as a command, the same autocomplete finishes the command word as you type, and the same sudo switch in the status column covers the commands you run this way. One command is the composer's own, in either mode: type <span class='mono'>/cls</span> and send it to clear the current chat — the thread empties and its folded cards reset, exactly what the old Clear chat button did before it retired; the line itself is never sent, never run, and never enters the history.</p></div>" +
    "<div class='doc-sec'><h4>Chats live on the server now</h4>" +
  "<p>Your chats are kept by the <b>bridge</b>, not by this browser window: plain files in <span class='mono'>config/chats/</span> on the machine Apex runs on, one per thread. Open Apex from the desktop, through DHD, or from a second browser on the same install and you are looking at the <b>same conversations</b> — sign in on your server from work and the thread you left on the laptop is simply there. The browser keeps a local copy as a cache and an offline fallback, and the first time a browser with older chats meets an empty server store, its chats are imported as the seed — never discarded. Your uploads index rides with the chats. Chats are also the ninth backup essential: tick <b>Chats</b> in Settings → GitHub &amp; Backup and the threads ride the ready-to-fly backup; a restore <b>converges</b> them — newest wins per thread, and where both machines moved the same thread on, both versions survive, the incoming one as a dated sibling. Nothing is ever merged away silently.</p></div>" },
  { id: "chips-guide", title: "Chips development guide", related: ["navi-functions", "chips-publishing"], html:
    "<div class='doc-sec'><h4>Chips — chips, the catalog, and the Studio</h4>" +
  "<p>A chip is a small Python module shipped as a <b>chip</b>: a .png whose entire codebase rides inside the image. A loadable chip declares <span class='mono'>command</span>, <span class='mono'>use</span>, <span class='mono'>aliases</span> and <span class='mono'>params</span>, and defines <span class='mono'>run(arguments)</span>. Chips reach Navi through <span class='mono'>navi_internal.navi_instance</span> — <span class='mono'>print_message(text)</span> to speak, <span class='mono'>llm_chat(message)</span> to ask her model, <span class='mono'>process_message(text)</span> for her full pipeline. Every method is written up in full on this wiki's <b>Navi Chip Functions</b> page — the documentation is their home.</p>" +
  "<p><b>Navi User Repo (NUR)</b> searches GitHub for repos tagged <span class='mono'>navi-chips</span> — that topic is the whole store. The Saints Sec Chips and Community Chips tabs are where you find and install chips: a card there shows whether you already have the chip, and that is all it does with it. A chip that is already on this machine — installed from its repo, or forged in Chip Studio under the same name — reads <b>INSTALLED</b> on its catalog card and its Install button sits grayed out: there is no second install over the copy you have. Install tracks the latest release; a newer release offers an update, which you take from the chip's card on the Local Chips tab. <b>Chip Studio</b> is where chips are written: a full code editor with highlighting, find, templates, and a live structure check. To publish: public repo, the <span class='mono'>navi-chips</span> topic, a release tag as the version.</p>" +
  "<p><b>Editing a chip you already have.</b> <b>Local Chips</b> is where you manage the chips you have — its card carries every management action: <b>Run</b>, <b>Download .png</b>, <b>Edit in Studio</b>, <b>Edit README</b>, <b>Export for GitHub</b>, <b>Publish to GitHub</b>, <b>Check for updates</b> / <b>Update</b>, and <b>Delete</b>. Uninstalling is not fenced into that one card anymore: an installed chip's catalog card carries <b>Uninstall</b> too, and so does its sleeve in <b>ChipDeck</b> — cartridge and install record go together from any of them, and a chip with local edits asks before it goes. Any chip in the folder can go back to the Studio — press <b>Edit in Studio</b> on its card in Navi User Repo (NUR) → Local Chips, or pick it in the Studio's <b>Open a chip</b> list: forged chips, GitHub installs, and chips you once exported and installed again all open with their whole file set, root.py and modules together. Saving re-forges the chip with your changes inside. If the chip came from GitHub, saving marks it <b>edited locally</b>: the app says plainly that your copy no longer matches the published one, and an Update will refuse rather than quietly overwrite your edits. To share your version, use <b>Export for GitHub</b> in Navi User Repo (NUR) and cut a new release. Knowledge packs work the same way: <b>Edit in RAG Studio</b> on the RAG tab reopens any pack — documents in or out, name and description adjusted — and saving rebuilds its index on your machine.</p>" +
  "<p><b>Installs prove themselves.</b> When a chip installs, the bridge re-scans the chips folder before it answers: if the cartridge landed on disk but does not list, the answer says so, and why — an install is never reported done on faith. A cartridge whose payload will not parse is listed in Local Chips as <b>couldn't be read</b> — visible and deletable, but it cannot run, and the runners skip it. <b>Older chips still run:</b> installing walks the repo's folders recursively, so a chip laid out as a package keeps its relative paths and its imports resolve at run time; a repo's <span class='mono'>chip-requirements.txt</span> is read and the chip's card shows the declared dependencies plainly — they are <b>not installed automatically</b>; and every chip sandbox carries the legacy <span class='mono'>navi.py</span> shim (<span class='mono'>get_parameters</span>, old semantics) unless the chip ships its own.</p>" +
  "<p><b>A chip's face is a card, drawn at card grade.</b> New forges wear the family shell — black body, coral notched bands top and bottom as the cartridge's contacts (coral is the chip family's color — knowledge cartridges wear green, Mesh pairing cards blue) — with the chip's own story on it like a Mesh card's: the family header, its art large in its window, then the chip's name, what it does, and in small print its version and its output kind. The window itself is textured now: a dim QR-style tile field, seeded from the chip's name, and over it the art renders as a solid silhouette with a shade offset — the built-in glyphs (a key for cryptex, a hash mark for a hasher, a terminal for a shell tool) were redrawn as filled objects on the field's own 20-by-20 grid, so each reads at sleeve size without its name. The glyph is named in the chip's manifest (<span class='mono'>glyph</span> in navi-chip.json); with no glyph named, a keyword read of the chip's name and description picks one. <b>Better still, draw your own:</b> a manifest <span class='mono'>icon</span> — 20 rows of 20 characters, <span class='mono'>#</span> for the accent, <span class='mono'>o</span> for its shade, <span class='mono'>.</span> for empty — outranks the built-in glyph and rides inside the picture like the glyph does; art in the wrong shape is refused in plain words at forge time, and a picture whose art arrives damaged simply falls back to its glyph. A chip no art claims keeps the older name-seeded pattern in the window as a fallback. The version itself also rides <b>inside</b> the picture now, so the cartridge states its own version wherever it travels — on the face, in the install receipt, and on its ChipDeck sleeve. Faces are drawn at forge time — installed and published pictures keep the faces they were forged with until they are re-forged.</p></div>" +
    "<div class='doc-sec'><h4>Running chips from chat, and Workflows</h4>" +
  "<p>Any loaded chip runs from the conversation: <span class='mono'>./&lt;name&gt;</span> — the way you run a program — with its arguments after it (<span class='mono'>./navi-cryptex hex -e -t \"Hello world!\"</span>); a short name resolves (./cryptex finds navi-cryptex), a bare <span class='mono'>./</span> answers with the shelf itself, and typing <span class='mono'>./</span> in the composer offers the chips' names as you type. <span class='mono'>/chip &lt;name&gt;</span> remains as the long-form alias, alongside “run the &lt;name&gt; chip” and its name alone — its output lands in the thread. Under the CLI latch (<span class='mono'>$</span>), <span class='mono'>./</span> is the shell's own again: the latch decides, never a guess. There is no pill row above the composer anymore — the shelf lives in ChipDeck now, and running lives at the keyboard. The bridge genuinely runs it: code defining <span class='mono'>run()</span> executes with a working <span class='mono'>navi_internal</span>; a chip that only declares an output shows that instead. <b>Workflows</b> chain chips in order — each chip's output becomes the next chip's input, and the last output is the result.</p></div>" +
    "<div class='doc-sec'><h4>Writing a chip, step by step</h4>" +
  "<p>A <b>chip</b> is a small Python program Navi can run. A chip is a set of files: <span class='mono'>root.py</span> — the main file, the one Navi runs; every chip has exactly one — and helper files like <span class='mono'>helpers.py</span>, extra Python files root.py brings in with <span class='mono'>import helpers</span>. The rules root.py follows (the Studio checks them and underlines what is missing):</p><ol>" +
  "<li>It brings in Navi with <span class='mono'>import navi_internal</span> and takes hold of her with <span class='mono'>navi_instance = navi_internal.navi_instance</span>.</li>" +
  "<li>It says its name with <span class='mono'>command</span> — the word people type to run it.</li>" +
  "<li>It says what it does with <span class='mono'>use</span> — one short line.</li>" +
  "<li>It can list other names in <span class='mono'>aliases</span> and describe its inputs in <span class='mono'>params</span> (what <span class='mono'>-help</span> shows).</li>" +
  "<li>It defines <span class='mono'>run(arguments)</span> — the part Navi calls; <span class='mono'>arguments.text</span> is the words typed after the chip's name.</li></ol>" +
  "<p>Through navi_instance a chip can <span class='mono'>print_message(text)</span> (show a line), <span class='mono'>llm_chat(text)</span> (ask her model), <span class='mono'>process_message(text)</span> (hand text to Navi as if typed), <span class='mono'>get_user()</span>/<span class='mono'>set_user(name)</span>, <span class='mono'>clear_terminal()</span>, and <span class='mono'>chat_with_navi()</span>. Every one of those functions is explained in full — what it takes, what it gives back, and when to reach for it — on this wiki's <b>Navi Chip Functions</b> page, in the sidebar. <b>Making one:</b></p><ol><li>Chips tab → Chip Studio.</li><li>Name it.</li><li>Write root.py.</li><li>Add helper files in the file list.</li><li>Forge chip.</li></ol><p>The whole file set packs into the chip picture. The editor colors code, guides indents, folds blocks, finds words in every file, saves on its own, underlines missing pieces, and takes focus mode — the app's one expand idiom, the Vault's — which puts everything but the editor away; its toolbar holds the rest (command palette, outline, zoom, wrap). On a phone the Studio works one pane at a time — Face, Code, Test under a full-width switch — with the face as a collapsible strip, a snippet shelf and autocomplete over the keyboard, and Run, Forge and Save pinned to the thumb. The writing desk itself has its own page in the sidebar: <b>The Chip Studio editor</b>.</p></div>" },
  { id: "navi-functions", title: "Navi Chip Functions", related: ["chips-guide", "studio-editor"], html:
    "<div class='doc-sec'><h4>Navi Chip Functions — what a chip can call</h4>" +
  "<p>A chip does not run off on its own — it runs inside Navi, and everything it does with her goes through one doorway: <span class='mono'>navi_internal</span>, her own chip API. At the top of root.py the chip brings her in and takes hold of the live instance:</p><ul>" +
  "<li><span class='mono'>import navi_internal</span> — brings Navi's chip API into the chip.</li>" +
  "<li><span class='mono'>navi_instance = navi_internal.navi_instance</span> — the live Navi herself. Every function below is called on this instance; take hold of it first, at the top of <span class='mono'>run()</span> or at module level.</li></ul>" +
  "<p><b>Talking and thinking.</b> The three functions a chip reaches for most:</p><ul>" +
  "<li><span class='mono'>print_message(text, include_ai_name=True)</span> — prints a message to Navi's terminal, with her name in front of it unless you pass <span class='mono'>include_ai_name=False</span>. This is the main way a chip talks: results, progress, errors — if the operator should see it, it goes through here.</li>" +
  "<li><span class='mono'>llm_chat(user_message, called_from_app=False)</span> — sends a message to Navi's model and returns its response, so a chip can ask her to think and then work with what she says. The published navi-nmap chip uses it to turn raw scan output into a summary a person can read.</li>" +
  "<li><span class='mono'>process_message(user_message)</span> — runs a message through Navi's full pipeline — command detection and all — exactly as if the operator had typed it. Reach for it when the chip wants Navi herself to handle something, not just her model.</li></ul>" +
  "<p>The difference between the last two matters: <span class='mono'>llm_chat</span> is a question and an answer; <span class='mono'>process_message</span> is handing her the keyboard.</p></div>" +
    "<div class='doc-sec'><h4>The operator, the terminal, and the session</h4>" +
  "<p><b>Who she is working for:</b></p><ul>" +
  "<li><span class='mono'>get_user()</span> — returns the current operator's name: the name selected in Settings, the one her greetings use.</li>" +
  "<li><span class='mono'>set_user(sys_user)</span> — sets the current operator's name.</li></ul>" +
  "<p><b>The screen and the session:</b></p><ul>" +
  "<li><span class='mono'>clear_terminal()</span> — clears the terminal screen and reprints the Navi banner. A chip that is about to draw something full-screen starts here.</li>" +
  "<li><span class='mono'>chat_with_navi()</span> — opens an interactive chat session with Navi, dropping the operator into conversation with her from inside the chip.</li>" +
  "<li><span class='mono'>setup_history()</span> — initializes the history for prompt sessions, so a chip that runs its own prompts keeps them navigable.</li>" +
  "<li><span class='mono'>setup_navi_vocab()</span> — registers commands and aliases with Navi's vocabulary (the spaCy entity ruler), so her command detection learns the words the chip brought with it.</li></ul>" +
  "<p><b>This page is their home.</b> The full method list lives here in the documentation, complete and kept current — Chip Studio carries no method panels of its own, so the list is written once and read while you write. Upstream, the project's chip-developer wiki page, <i>Developing Chips — Indepth</i>, documents <span class='mono'>navi_internal.py</span>'s NaviApp class — the source this page follows. New to chips entirely? Start with the <b>Chips development guide</b>, in the sidebar.</p></div>" },
  { id: "studio-editor", title: "The Chip Studio editor", related: ["chips-guide", "glossary"], html:
    "<div class='doc-sec'><h4>The Chip Studio editor, button by button</h4>" +
  "<p>The editor is the writing desk inside Chip Studio — the place chip code gets written. It looks plain on purpose: everything it does is one click or one key away, and this page names each thing in the order you will meet it.</p>" +
  "<p><b>These pages live in the Docs view.</b> This wiki's home is the Docs view — the main documentation window. Press <b>Pop out</b> at the top of the Docs view and the wiki detaches into its own window, open at the page you were reading, so you can keep it beside the editor or the chat while you work. <b>Pop back in</b> — in the popped window or in the Docs view holding its place — returns it to the Docs view, same page. The pop-out is always another window entirely — the app's own second window — never a panel inside this one; if a window host ever blocks it, the Docs view says so and offers a direct link that opens the wiki in a new window instead.</p>" +
  "<p><b>The file list.</b> On the left is the list of the chip's files. <span class='mono'>root.py</span> sits at the top — the main file, the one Navi runs. Click any file to open it. Buttons under the list add a new file, rename the open one, or delete it (root.py cannot be deleted — every chip needs its main file). A dot beside a file's name means “changed, not saved yet”. Everything in the list travels with the chip: forge the chip and all the files go inside the picture.</p>" +
  "<p><b>Focus mode.</b> The button in the toolbar with the four corners puts everything but the editor away — the rail, the status column, the Studio's own header rows — room to think on a big chip. It is the same expand idiom the Vault uses; the app has exactly one. Press it again, or press <span class='mono'>Esc</span>, to bring the room back. Your place in the code does not move either way.</p>" +
  "<p><b>On a phone</b> the Studio works one pane at a time — <b>Face</b>, <b>Code</b>, <b>Test</b> under a full-width switch — the face art as a collapsible strip, and Run, Forge and Save pinned in a bar at the thumb that reserves its own height in the layout, so nothing ever slides under it. A snippet shelf and an autocomplete row sit over the keyboard as the primary input aids. No desktop feature is cut to make room.</p>" +
  "<p><b>Reading the code.</b> The editor colors the code — names, words, and numbers each get their own color, so the shape of a line is visible at a glance. Thin vertical lines (<b>indent guides</b>) show where a block starts and ends. Click the small arrow beside a block to <b>fold</b> it away; click again to bring it back. Folding is only for your eyes — a save always keeps the whole file.</p>" +
  "<p><b>Finding things.</b> <b>Find</b> searches the open file, and can replace what it finds. <b>Find in all files</b> searches every file in the chip and lists the hits as file and line — click a hit to jump straight there. The <b>Outline</b> list names every function and class in the file; pick one to jump to it. The command palette also has <b>go to line</b> for when you know the number.</p>" +
  "<p><b>The red squiggles.</b> A wavy red line under code means the chip is missing something it needs — a file with no <span class='mono'>run()</span>, say. The bar under the editor says what is wrong, in words. Fix the words and the line goes away.</p>" +
  "<p><b>More than one cursor.</b> Hold <span class='mono'>Alt</span> and click to plant another cursor. Type once and every cursor types at once — handy for renaming a word in ten places. The palette's “clear extra cursors” puts you back to one.</p>" +
  "<p><b>The command palette.</b> The <b>Commands</b> button opens one box that lists everything the editor can do. Type a few letters of the thing you want, press Enter, and it happens. If you forget where a button lives, the palette knows.</p>" +
  "<p><b>Minimap, zoom, wrap.</b> The thin strip on the right is a tiny picture of the whole file — click it to jump. <b>Zoom</b> makes the letters bigger or smaller. <b>Wrap</b> folds long lines onto the screen instead of letting them run off the side.</p>" +
  "<p><b>Saving.</b> On a chip that already exists, the editor saves by itself while you work — watch the dot beside the file's name disappear. <span class='mono'>Ctrl+S</span> saves right now. On a brand-new chip, <b>Forge chip</b> is the save.</p>" +
  "<p><b>The face art box.</b> Under the description sits a box for the chip's own face art: 20 rows of 20 characters — <span class='mono'>#</span> draws in the accent, <span class='mono'>o</span> in its shade, <span class='mono'>.</span> leaves a cell empty. It is the chip's <span class='mono'>icon</span> in its manifest: your art outranks the built-in glyph on the forged face, and it travels inside the picture. Leave the box empty and the chip wears its glyph. Art in the wrong shape — the wrong number of rows, a row of the wrong length, a character outside the three — is refused in plain words when you save, never silently dropped.</p></div>" },
  { id: "chips-publishing", title: "Publishing chips", related: ["chips-guide", "rag"], html:
    "<div class='doc-sec'><h4>Publishing a chip on GitHub</h4>" +
  "<p>Publishing means putting your chip on <b>GitHub</b> (a website that holds code) so any Navi can find and install it. The export builds the whole package — you never copy files by hand:</p><ol>" +
  "<li>Forge the chip in Chip Studio first.</li>" +
  "<li>Open Chips → Navi User Repo (NUR) → Local Chips and find your chip — installed chips under <b>Installed</b>, your own makes under <b>Forged</b>.</li>" +
  "<li>Type a version like <span class='mono'>0.1.0</span> (a version is just a label: this is the first one) and press <b>Export for GitHub</b>, then download the ZIP (one file holding many files).</li>" +
  "<li>On GitHub, make a new <b>public</b> repository (one project's folder on GitHub; public means everyone can see it) and unzip the export at its top.</li>" +
  "<li>On the repo page, open the About gear and add the topic <span class='mono'>navi-chips</span> — a topic is a label, and this label is how Navi finds chips.</li>" +
  "<li>Publish a <b>release</b> (GitHub's way of saying: this exact version, ready to download) — the version tag is created with that publish, so tag it with the same version.</li></ol>" +
  "<p><b>Signed in to GitHub?</b> Skip the ZIP: <b>Publish to GitHub</b> on the chip's card does the middle steps for you — it creates the public repo (an existing one is updated, and she says so), sets the <span class='mono'>navi-chips</span> topic on its own, and uploads the same files the export builds. The repo name is pre-filled from the chip's name and yours to edit before anything uploads. And Publish finishes the job: it creates the version tag and publishes the release itself, with the chip picture attached. If that version is already released, Publish refuses and says so — bump the version in the manifest instead of overwriting a release. And the README page is yours too: <b>Edit README</b> on the chip's card edits the generated page; your text is kept inside the chip and ships in the export and the upload alike, with a restore back to the generated page.</p>" +
  "<p><b>Inside the export:</b> <span class='mono'>root.py</span> and the helper files (install downloads every Python file in the repo <b>recursively</b>, keeping folder paths, so package layouts survive — root.py, or the entry named in the manifest, is the chip; the rest are its modules; a <span class='mono'>chip-requirements.txt</span> at the repo top is read and shown on the chip's card as declared dependencies, never installed automatically); <span class='mono'>navi-chip.json</span>, a small card with the name, description, version, and entry file; the chip <span class='mono'>.png</span>; and a generated <span class='mono'>README.md</span> page. <b>Installs and updates:</b> Navi User Repo (NUR) searches GitHub for the <span class='mono'>navi-chips</span> topic; Install brings the whole file set down as a chip; a release with a bigger tag offers every install an update. Knowledge packs publish the same way — see the RAG page.</p></div>" },
  { id: "chipdeck", title: "ChipDeck — the binder", related: ["chips-guide", "rag", "mesh"], html:
    "<p style='color:var(--dim)'>One binder for everything that rides a picture.</p>" +
    "<div class='doc-sec'><h4>What lives in the binder</h4>" +
  "<p><b>ChipDeck</b> (in the menu, under Chips) is a gallery of sleeves, one per picture-riding thing on this machine: every <b>installed chip</b>, every <b>Apex | Mesh pairing card</b> on file in <span class='mono'>config/mesh/cards/</span>, and every <b>knowledge pack</b>, drawn as its cartridge. Each sleeve shows the <b>actual picture</b> — the cartridge's real bytes, not an icon for it — with the thing's state at a glance (installed from where, edited locally, paired, active) and its actions gathered underneath: chips run (straight into chat, as <span class='mono'>./&lt;name&gt;</span>), download their picture, open in Chip Studio, and uninstall; Mesh cards download and unpair; packs activate, deactivate, download their cartridge, and remove.</p>" +
  "<p><b>Drop a picture on the Deck and it slots in.</b> The data inside the picture says what it is — chip, knowledge cartridge, or Mesh card — and each kind installs through its own door, with its own checks. The receipt names the version the picture itself carries, and a chip's sleeve states it too — a picture forged before versions rode inside simply shows none, and nothing guesses one for it. A picture whose data was stripped on its way to you (chat apps recompress uploads) is refused in plain words, never silently ignored: send originals inside a <span class='mono'>.zip</span>.</p>" +
  "<p><b>What never rides a picture stays out of the binder:</b> Soul, Memory, settings and config, the Vault's notes, and every key. Those travel in backups only — there is no cartridge for them, by design.</p></div>" },
  { id: "rag", title: "RAG packs & exports", related: ["chips-publishing", "settings"], html:
    "<div class='doc-sec'><h4>RAG — knowledge packs</h4>" +
  "<p>Her knowledge comes in <b>packs</b>, chip-style like her chips, managed in the <b>RAG tab</b>. A pack is a GitHub repo tagged <span class='mono'>navi-rag</span> whose documents are its <span class='mono'>.md</span>/<span class='mono'>.txt</span> files and the extracted text of its <span class='mono'>.pdf</span> files (a PDF gives up its words at the door; only the text is stored).</p>" +
  "<p>Installing one downloads the documents into <span class='mono'>rag-packs/</span> and <b>builds the pack's index there, at install time</b> — feature-hashed term vectors, small local embeddings computed with the standard library alone, no model to download. At question time only your question is embedded, so retrieval stays fluid on CPU.</p>" +
  "<p>Each pack carries an <b>active</b> toggle: only active packs feed her answers, and when a pack informs an answer, the pack and the document it came from appear as a source pill under her message — display only, never part of her reply text, so her voice never reads citations aloud, and a message that drew on no pack carries none. A bare <span class='mono'>/rag</span> in chat lists the packs on this machine and which are active.</p>" +
  "<p><b>RAG Studio</b> (the RAG tab's second tab) forges packs from documents on your disk — picked files, or a folder on this machine — into the same folder, documents, index, and metadata, ready to use immediately. Publishing a pack mirrors chips: a public repo, the <span class='mono'>navi-rag</span> topic, and a release tag as its version — a newer tag is what offers an update.</p>" +
  "<p><b>A pack can ride a picture, too.</b> <b>Export as PNG</b> on a pack's card draws its <b>knowledge cartridge</b> — a card-grade face at the same grade as a chip's now: the family shell with green contacts — green is the knowledge family's color, as coral is the chips' — and the pack's center is the spray: the seeded tile field grown to fill the whole window, denser and brighter toward the middle, in the pack's greens. The pack's own art still outranks the spray when its manifest declares an <span class='mono'>icon</span> (the same 20-by-20, three-character drawing a chip declares, edited as text rows in RAG Studio) — then it renders as a solid silhouette over the tile field, in green — the pack's name and what it holds, and in small print its version and how many documents ride inside. The picture carries the pack's manifest and every document's full text, compressed inside the image. Hand someone the picture and they install the pack from the picture alone — <b>Install from a picture…</b> on this tab, or a drop onto ChipDeck — and the index is <b>built on their machine at install time</b> from the texts inside: a cartridge never carries an index, and nothing reads the picture when her answers draw on the pack. Installed from a picture, a pack is a pack in every way — same folder, same index, same active toggle. There is a ceiling: a cartridge may run to 8 MB of picture; past it the export refuses in plain words and the ZIP stays the way to carry that pack — nothing is ever truncated to squeeze into a picture. And the standing warning for every Apex picture: chat apps recompress the pictures people upload and strip the data out, leaving a picture that looks right and carries nothing — send the original file inside a <span class='mono'>.zip</span>.</p>" +
"<p>The Packs list's <b>Export for GitHub</b> button packages a pack into exactly that repo shape:</p><ul>" +
  "<li>a generated README page (installs skip a root README, so it is never indexed),</li>" +
  "<li>a navi-rag.json manifest,</li>" +
  "<li>the documents under documents/,</li>" +
  "<li>a .gitignore, and</li>" +
  "<li>the pack's built index.json, shipped as a reference copy — installing Navi rebuilds the index locally from the documents, so the two can never disagree.</li></ul>" +
  "<p>Installed packs and their indexes are on the persistence keep-list with her chips and voice models: updates and --fresh installs keep them. The folder starts empty — Navi ships with no pre-installed packs.</p></div>" +
    "<div class='doc-sec'><h4>The Packs list — cards, like the chips</h4>" +
  "<p>The catalog half of the Packs list wears the same flip cards as the chips catalog: the front carries the pack's name, description, stars and forks, latest release, and whether it is installed, and <b>README →</b> flips the card over to read the repo's README inside it, with links to its Issues and — when the repo has a wiki — its Documentation. A pack that is already on this machine, installed from its repo <i>or forged in RAG Studio under the same name</i>, reads <b>INSTALLED</b> on its catalog card and its Install button sits grayed out — there is no second install over the copy you have. The pack's own card under <b>On this machine</b> is where it is managed: the Active toggle, Edit in RAG Studio, Delete, the Version field, Export for GitHub, Publish to GitHub, and Edit README all live there.</p></div>" +
    "<div class='doc-sec'><h4>Publishing a pack, step by step</h4>" +
  "<ol><li>Forge the pack in RAG Studio. On its card in the Packs list, press <b>Edit README</b> if you want your own words on its GitHub page — your edited README is kept with the pack and ships in the export and the upload alike (Restore generated README undoes it).</li>" +
  "<li><b>Signed in to GitHub:</b> type a version like <span class='mono'>0.1.0</span> and press <b>Publish to GitHub</b>. Check the repo name — pre-filled from the pack's name, yours to edit — and confirm. Navi creates the public repo if it is new, sets the <span class='mono'>navi-rag</span> topic on its own, and uploads the files; an existing repo is updated, and she says so.</li>" +
  "<li><b>Not signed in:</b> press <b>Export for GitHub</b> and download the ZIP instead. Make a new public repository on GitHub, unzip the export at its top, and add the topic <span class='mono'>navi-rag</span> (repo page → About gear → Topics).</li>" +
  "<li>With the ZIP route, the last step is yours: publish the release on GitHub — the version tag is created with that publish, so tag it with the same version. Signed in, <b>Publish to GitHub</b> does that step too.</li></ol>" +
  "<p><b>Inside the export:</b></p><ul>" +
  "<li>a <span class='mono'>README.md</span> page (installs skip a root README — it describes the pack, it is never a document),</li>" +
  "<li>the <span class='mono'>navi-rag.json</span> card,</li>" +
  "<li>the documents under <span class='mono'>documents/</span>, and</li>" +
  "<li><span class='mono'>index.json</span> — the built index, shipped as the pack's reference copy.</li></ul>" +
  "<p>Install downloads the documents (Markdown, text, and PDF files anywhere in the repo) and builds the index fresh on that machine. A release with a bigger tag offers everyone an update.</p></div>" },
  { id: "vault", title: "The Vault", related: ["rag", "settings"], html:
    "<div class='doc-sec'><h4>A shared desk of plain markdown</h4>" +
  "<p>The <b>Vault</b> is a folder of markdown notes you and Navi share — her desk, open to you. It lives at <span class='mono'>config/vault/</span> inside the install folder: ordinary <span class='mono'>.md</span> files in ordinary folders, no database, no proprietary format.</p>" +
  "<p><b>Obsidian compatible, by construction:</b></p><ul>" +
  "<li>Open <span class='mono'>config/vault/</span> in Obsidian as a vault and everything just works — the same files, both ways.</li>" +
  "<li>YAML frontmatter is preserved exactly as written; the editor shows it raw and the preview never mangles it.</li>" +
  "<li><span class='mono'>[[wikilinks]]</span> and <span class='mono'>#tags</span> are first-class text: clicking a wikilink in Preview jumps to that note, or offers to create it.</li></ul></div>" +
    "<div class='doc-sec'><h4>Working in it, and how Navi uses it</h4>" +
  "<p><b>In the Vault view:</b></p><ol>" +
  "<li>The file tree sits in its own column on the left of the editor, Obsidian-style — the pair spans the full width of the view and fills its height, the tree scrolling its own length while the editor reaches the bottom of the window — and carries New note, New folder, Rename, Delete (with a confirm), and Move. Drag a note onto a folder header — targets light up while you drag, and a drop anywhere else changes nothing — or open the note's ⋯ menu, pick Move, and choose the folder, which is how it works by touch. Every note and folder carries that one ⋯ menu — Move, Rename, and Delete (with a confirm) for notes, New note and Delete for folders — so the names get the tree's width to themselves. Drop markdown files from your computer onto the vault to import them — other file types are refused in plain words.</li>" +
  "<li>The editor autosaves as you type and says when it saved; Edit, Split, and Preview modes sit on one toggle, rendered by the same markdown renderer as chat and these Docs. The expand button in the editor's header opens <b>focus mode</b> — the editor alone filling the whole window, the menu, her presence bar, and the tree all put away — and the same button, or Escape, brings the Vault back exactly as it was.</li>" +
  "<li>A strip at the foot of the editor shows each note's Backlinks, Outgoing links, and Tags; the top bar searches the whole vault, opens (or creates) today's Daily note, and exports the vault as a .zip of the folder itself. Files in a <span class='mono'>Templates/</span> folder are offered as starting templates for new notes.</li></ol>" +
  "<p><b>Her side of the desk</b> is <span class='mono'>Navi's Desk/</span>: when a conversation produces something worth keeping — a decision, a finding, something you asked her to remember — she files a dated note there and tells you she did; when a vault note informs one of her answers, she names it as a source, the way she names a RAG pack. <b>Your side</b> is <span class='mono'>Operator/</span>, and she never edits it silently: she writes there only when you ask her to in chat, and she says what she filed.</p>" +
  "<p><b>Keeping it.</b> The vault folder is on the installer's persistence keep-list beside her chips, packs, Soul, and Memory: updates, reinstalls, and <span class='mono'>--fresh</span> installs preserve it. In Settings → GitHub &amp; Backup it is listed with chips and packs as an optional include; Soul, Memory, and Settings stay the always-ticked core.</p></div>" },
  { id: "case-files", title: "Case Files — the engagement workspace", related: ["vault", "chips-guide", "threat-intelligence"], html:
    "<div class='doc-sec'><h4>Cases, findings, evidence, timeline</h4>" +
  "<p><b>Case Files</b> (in the menu's <b>Apex | Apps</b> group, with the Vault seated under it) is where an engagement lives. A case is a folder of plain markdown in the Vault — <span class='mono'>cases/&lt;name&gt;/</span> — with its manifest in <span class='mono'>case.md</span> (client, scope, status, opened date, as frontmatter), its findings as notes in <span class='mono'>findings/</span>, its evidence as files in <span class='mono'>evidence/</span>, and its story in one newest-first <span class='mono'>timeline.md</span>. Plain files, on purpose: a case rides the Vault's backups, opens in Obsidian exactly as it lies, and can be read with any text editor on any machine.</p>" +
  "<p>The view cold-starts on the <b>case list</b>, always. Open a case for its findings (structured cards, by severity), its evidence (drop files straight onto the case), and its timeline. Mark <b>one case open</b> and it becomes the case Navi works: ask her in chat to <i>“file that as a finding”</i> and she files the exchange into the open case and tells you she did — out loud, naming the case and the file, never silently. The latest terminal or chip output from chat can be filed as a finding from the case page, too.</p></div>" +
    "<div class='doc-sec'><h4>The case chat, her own findings, and the open case (Build 15)</h4>" +
  "<p>Every case has <b>its own chat</b>, made the first time the case is opened and returned to ever after — one case, one canonical thread, riding the same server-side store as every other chat (it survives machines the way chats now do). It is listed on the Chats tab with a CASE tag, and <b>Open the case chat</b> on the case page walks you straight into it. The chat is a reference, not a container: the case's content stays in the Vault's plain files.</p>" +
  "<p>While a case is open, <b>Navi can file her own findings</b> into it — conclusions she reaches, in her own words, filed under her own name (the finding's frontmatter says so, the case page marks it FILED BY NAVI, and a line lands in the timeline). It is never silent: the filing happens in the thread where she reached the conclusion, and the receipt — the finding's title and its path — hangs on her message there. She files nothing from unrelated chats and nothing without that receipt.</p>" +
  "<p>The <b>open case is visible</b>: the status column carries it (CASE, in the stats), and in the case's own chat a chip above the thread names it — tap it to jump to the case. Closing the case (making another one open, or none) clears both.</p></div>" +
    "<div class='doc-sec'><h4>Deleting a case (Build 15)</h4>" +
  "<p>Deleting is complete, and it is confirmed in words first. <b>Delete this case…</b> at the foot of the case page arms a confirmation that names exactly what will go: the case and <b>every file it owns in the Vault</b> — its findings, evidence, timeline, manifest and exported report — and <b>its tied chat</b>, the whole conversation. Confirm, and all of it goes; there is no undo. One honest limit, stated on the confirmation itself: <b>backups already taken keep the copies inside them</b> — deleting a case does not reach into backup history. If the deleted case was the open one, the open-case pointer clears with it.</p></div>" +
    "<div class='doc-sec'><h4>The report export</h4>" +
  "<p><b>Export the report</b> composes one markdown document per case — the head (name, client, scope, dates, status), the findings by severity in full, the timeline as an appendix, the evidence — and lands it as <span class='mono'>report.md</span> inside the case folder, with a download to match. Since Build 15, <b>image evidence is shown, not just named</b>: PNG/JPG/GIF/WebP evidence is embedded in the report itself as data, so the single file stays self-contained wherever it travels; an image over ~8 MB stays listed by name with the reason stated, and non-image evidence keeps the name-and-size listing. A finding marked <b>internal</b> is withheld from the export <i>and counted in it</i> (“2 internal notes withheld”) — never silently omitted — and no internal machine names or Mesh details are ever written into a report. Reports export as markdown; there is no PDF path in the app today, and the export does not pretend otherwise.</p></div>" },
  { id: "threat-intelligence", title: "Threat Intelligence — the Center", related: ["case-files", "mesh"], html:
    "<div class='doc-sec'><h4>What the Center is</h4>" +
  "<p><b>Threat Intelligence</b> (in the menu's <b>Apex | Apps</b> group) is Apex's standing picture of the threat landscape — and the one Navi reasons with. It pulls <b>public, keyless feeds</b> on a cadence into a local store (<span class='mono'>config/intel.db</span>): the <b>NVD</b> (CVEs, CVSS scores, affected products), <b>CISA's KEV catalog</b> (the vulnerabilities known to be exploited, with remediation due dates), <b>EPSS</b> (each CVE's likelihood of exploitation, refreshed daily), <b>CISA advisories</b>, and curated reporting (Krebs on Security, BleepingComputer). No accounts, no API keys, no scraping — published feeds, pulled politely, each keeping its own fields: a record's identity is its CVE ID, and KEV owns the exploited status, NVD the scores and products, EPSS the likelihood.</p>" +
  "<p>The page is <b>freshness first</b>: a strip up top says who gathered the picture and how old every source is — <i>fresh</i> under 12 hours, <i>aging</i> under 48, <i>stale</i> beyond — because a stale picture presented as fresh is worse than none. Below it, the <b>triage queue</b> (your matches first, then what's newly exploited, then the loudest new disclosures), <b>the record</b> (one CVE in full: description, products, references, EPSS history), and <b>Navi's brief</b> — the same standing summary she carries into chat. On a phone the arrangement is its own: one column, brief first.</p></div>" +
    "<div class='doc-sec'><h4>Matching — declared, local, honest</h4>" +
  "<p>The Center matches records against a small, specific profile: the <b>watchlist</b> you declare on the page (the software you run), the <b>Mesh roster</b> (node names, this machine's platform), and <b>words from your open cases</b>. A match to a declared product through its CPE identity is an <i>exact</i> match; a watch term appearing in a record's text is a <i>keyword</i> mention — the queue labels which, because the grades mean different things. Matching happens <b>on this machine</b>: the watchlist and the case words are never sent to a feed. The only outbound traffic is the feed pulls themselves, on vendor-published schedules.</p></div>" +
    "<div class='doc-sec'><h4>Navi's three depths of knowing</h4>" +
  "<p><b>The standing brief</b> rides her chat context on every turn — bounded (roughly 700 tokens), always carrying its freshness stamps, so she answers “what's the picture?” from the store and dates it when she does. <b>Deliberate lookup</b>: type <span class='mono'>intel: openssl</span>, or ask <i>“what do we know about CVE-2024-3094?”</i>, and the answer comes straight from the store without a model round-trip — including when the honest answer is “not in the store.” <b>The seam</b>: name a CVE ID or a watched product in ordinary chat and that record is pulled into her context for that reply only. In a <b>case chat</b>, the case's own matched records ride along — and from the Center's record view, a record can be <b>filed straight into the open case</b> as a finding, its citation (the CVE ID and the digest's stamp) written into the note so case exports carry it.</p></div>" +
    "<div class='doc-sec'><h4>One collector, and the Mesh carries it</h4>" +
  "<p>Collection is the heavy half, so a Mesh names <b>one collector</b>: the strong node pulls the feeds and builds the digest (<span class='mono'>navi-intel-digest/1</span> — the ranked picture, at most ~300 records, with its collector and per-source stamps in the header); thin clients fetch the digest from the collector over the Mesh door itself, import it, and <b>match locally</b> — a receiver never polls the feeds. Set the collector's node id in the page's Collection card; leave it blank and this node collects for itself. If the collector is unreachable a receiver says so on its freshness strip and (only if you enable it) falls back to collecting locally. Offline entirely, the Center serves its last-good picture with its age on it — never a silent old answer.</p></div>" },
  { id: "voice", title: "Voice & calls", related: ["chat-cli", "settings"], html:
    "<div class='doc-sec'><h4>Her voice — calling Navi</h4>" +
  "<p>Navi can be <b>called</b>, not just typed at — and the whole loop is local, running on CPU on this machine, because a voice that phones home isn't hers. A call runs in four steps:</p><ol>" +
  "<li>You speak.</li>" +
  "<li><b>faster-whisper</b> (OpenAI's Whisper on CTranslate2, int8) turns it into text.</li>" +
  "<li>Her model answers with her persona, her CLI access, and her chips intact.</li>" +
  "<li><b>Kokoro</b> — an 82M-parameter voice model, Apache-2.0 — speaks the answer back, sentence by sentence as it arrives, so she starts talking before she's finished thinking.</li></ol>" +
  "<p><b>Piper</b> is the lighter fallback engine. Nothing you say is recorded anywhere but this machine.</p>" +
  "<p><b>Settings → Voice</b> is her voice's one home — the call itself and her settings together (which Whisper model hears you, which engine and voice she speaks with, her speed and pitch — saved in <span class='mono'>config/navi.config.json</span>): a Call button, push-to-talk through your real microphone, an elapsed timer, and a live transcript; the same call can be started from the Chat tab — the Call button beside its composer opens the live call panel (timer, push-to-talk, End) right in the chat window, with the thread as the transcript and the composer speaking to the call; a mic beside the chat composer does push-to-talk for one-off spoken messages, and typed-chat replies can be spoken aloud too. The speech engines are an optional install — the installers offer them in an isolated <span class='mono'>voice/venv</span> — and until they exist the app says voice is unavailable and names the step, rather than faking audio. Models download once into <span class='mono'>voice/models/</span>, which sits on the persistence keep-list with her chips, the llamafile, and her Soul/Memory. Finished calls are recorded in <span class='mono'>voice/calls.json</span> and filed into the conversation — a call is a conversation, not a separate mode. <b>Her voice is picked in Settings → Voice</b>: the list is auto-generated — the bridge enumerates the voices this machine's Kokoro installation actually has (the voice files it holds, or the catalog the installed package pulls from, which download on first use) — and she defaults to <b>Isabella</b>, the British female voice (<span class='mono'>bf_isabella</span>).</p></div>" },
  { id: "dhd", title: "DHD — Apex from anywhere", related: ["settings", "installing", "troubleshooting"], html:
    "<div class='doc-sec'><h4>What DHD is</h4>" +
  "<p><b>Apex | DHD</b> — Dial-Home Device, the way home — is Apex's public door. <b>Apex | Node</b> [local] lets a phone on your home network open Apex; DHD extends the <b>same dashboard</b> to a genuinely public address, so you can reach the Apex on your own machine from anywhere.</p>" +
  "<p>Everything is Apex's own work, assembled and managed by Apex itself — no Tailscale, no tunnel or proxy service, no Certbot:</p><ul>" +
  "<li>A <b>reverse proxy Apex runs itself</b> listens on ports 80 and 443 and forwards to the bridge on <span class='mono'>127.0.0.1:" + BRIDGE_PORT + "</span>. In DHD mode the bridge never binds publicly — the proxy is the only public face.</li>" +
  "<li><b>TLS from the first click.</b> With no domain, Apex generates a <b>self-signed certificate</b> and the door opens on it. With a domain, Apex's <b>built-in ACME client</b> obtains a real Let's Encrypt certificate and renews it on its own.</li>" +
  "<li>The <b>same access code</b> as the home-network door guards DHD — one code, the same acceptance cookie. Nothing is served through the proxy before the code, and the public door throttles wrong codes: they slow down, and five in a row lock the door for five minutes.</li></ul>" +
  "<p>DHD has its own page, reached from the menu's <b>Apex | Systems</b> group (the Apex | Node controls live on this page), and the status column's <b>Servers</b> group shows it in the family order — Navi (the engine row, llamafile on port 8080), Apex | Node [local], Apex | Mesh, then Apex | DHD, each row with its own pulsing dot and its own dropdown of details. The Servers header itself collapses the whole group; shut, it still carries one dot per server, so a problem stays visible. The Apex | Node controls live on this same page, under the DHD options. Directly under Navi's status in the status column, bracketed by separators, sits the update line: a green <b>Up to date</b>, or a yellow <b>Update available</b> when a check found one — that one line is the whole entry.</p></div>" +
    "<div class='doc-sec'><h4>Turning it on — one click</h4>" +
  "<ol><li>Open the <b>DHD</b> page from the menu.</li>" +
  "<li>Flip the <b>master switch</b>. That is the click.</li>" +
  "<li>Apex does the rest in order: it generates the certificate, brings its proxy up on 80/443 in front of the bridge, and runs a local reachability check — the proxy must answer on 443 from this machine (answered on this machine; the local half only). The page then reports the live state, the LAN address under its own label, and the public address when there is one.</li>" +
  "<li>Once the public path is set up (router forwards in place, and your domain live if you use one), open the public address from anywhere, type the <b>access code</b> (shown on the DHD page, on this machine only), and you are in — a full session, Updater included: a remote session can run the one-click update end to end, exactly like sitting at the machine.</li></ol>" +
  "<p>If a step fails, the page names the step in plain words — the proxy could not take its ports, the certificate could not be prepared, the self-check did not answer — and the previous state is left completely untouched. Nothing ever half-opens. One Linux note: ports below 1024 are reserved, so if the proxy step names them, grant the bridge the low-port capability once (<span class='mono'>sudo setcap 'cap_net_bind_service=+ep'</span> on the python3 binary it runs with) and flip the switch again.</p></div>" +
    "<div class='doc-sec'><h4>Addresses — domain, public IP, and LAN</h4>" +
  "<p>DHD works with <b>three different addresses</b>, and the page never mixes them up:</p><ul>" +
